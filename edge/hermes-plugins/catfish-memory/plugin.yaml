name: catfish-memory
version: 0.1.0
description: "Catfish 扩展 memory provider — 聚合 employee_journal / skills_catalog / feedback / session_meta / skill_guard 5 个 catfish 边缘数据源, 通过 hermes MemoryProvider 接口注入 system prompt. 替代 gateway 老 memory_registry 反 pattern (BL-MEMORY-OWNERSHIP-FIX, docs/MEMORY-OWNERSHIP-ARCHITECTURE.md)."
hooks:
  - sync_turn        # 每轮 user+assistant 完成调一次, plugin 内部节流 (每 N 轮 / 时间窗口)
  - on_session_end   # session 真结束时 force-flush buffer 兜底 (CLI atexit / /reset / /new)
# hermes v0.22: 替换内置工具要声明 + 配置里授权 (plugins.entries.<名>.granted_capabilities,
# Companion 写)。替换内置 memory 工具 (5 kind 路由)
capabilities:
  - tools.override
