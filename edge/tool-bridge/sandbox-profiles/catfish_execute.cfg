# =====================================================================
# catfish_execute.cfg — nsjail Linux profile for execute_code
#
# 跟 macOS catfish_execute.sb 对称, 用于 Hermes 服务器 + 客户内网 GPU.
# nsjail 用 protobuf 文本格式 (Google 开源 https://github.com/google/nsjail).
#
# 用法:
#   nsjail --config catfish_execute.cfg \
#          --bindmount_ro /usr/bin/python3:/usr/bin/python3 \
#          --bindmount /tmp/catfish-task-<id>:/tmp/task \
#          -- /usr/bin/python3 -c '...'
#
# 设计目标 (跟 macOS 同样 5 大类):
#   1. 网络全断  (clone_newnet + iface_no_lo)
#   2. 写文件白名单 (只 /tmp/task 可写, 其他 chroot/mount 都只读)
#   3. 读敏感路径不可见 (chroot 模式根本看不到 ~/.ssh /etc/passwd)
#   4. 设备 / iokit  (clone_newuser + clone_newipc 隔离)
#   5. sysctl/proc 写不动 (clone_newpid + 默认 ro proc)
#
# 多了 macOS 没有的 (这就是 nsjail > sandbox-exec 的地方):
#   6. fork bomb 真拦 (rlimit_nproc=10 + cgroups pids.max)
#   7. 内存爆炸真拦 (rlimit_as=512MB + cgroups memory.limit)
#   8. CPU 真限 (rlimit_cpu=30s + cgroups cpu.max)
# =====================================================================

mode: ONCE                     # 跑一次, 不 daemonize (跟 sandbox-exec 等价)

# 启用所有 namespace 隔离 (kernel 级真隔离, 比 sandbox-exec 强一档)
clone_newnet: true             # 网络 namespace = 沙箱看不到任何网卡
clone_newuser: true            # user namespace = uid 重映射, root 在沙箱外仍非 root
clone_newpid: true             # pid namespace = 沙箱内看不到外部进程
clone_newipc: true             # ipc namespace = 信号量/共享内存隔离
clone_newuts: true             # uts namespace = 主机名隔离
clone_newcgroup: true          # cgroup namespace = cgroup 视图隔离

# 默认不允许 network loopback (catfish 不需要 lo, 跟 macOS 对齐)
iface_no_lo: true

# disable_no_new_privs: 默认 false → no_new_privs 开启, 不能 setuid 提权
# (注意: 部署时如果 nsjail 自己不是 root, 这个会让沙箱内更安全)

# ---------------------------------------------------------------------
# 资源 rlimit (内核级, 沙箱内进程不能突破)
# ---------------------------------------------------------------------
rlimit_as: 512                 # 虚拟内存上限 512 MB (防 4GB mem bomb)
rlimit_cpu: 30                 # CPU 累计 30 秒 (防死循环)
rlimit_fsize: 50               # 单文件最大写 50 MB (防写超大文件填满 TASK_DIR)
rlimit_nofile: 256             # 文件描述符最多 256 (防 fd 泄漏)
rlimit_nproc: 10               # 进程数上限 10 (★ fork bomb 真拦, macOS 拦不住的关键)
rlimit_stack: 8                # 栈 8 MB

# 总运行时间硬限 (墙钟时间, 比 rlimit_cpu 更严)
time_limit: 30

# ---------------------------------------------------------------------
# 文件系统: 用 mount 白名单 (mount root 为 tmpfs = chroot 效果)
# 注: nsjail master 分支删了顶层 chroot 字段, 用 mount root tmpfs 替代
# ---------------------------------------------------------------------

# 沙箱内 / 是 tmpfs (干净空白)
mount {
  src: "none"
  dst: "/"
  fstype: "tmpfs"
  rw: false
  is_bind: false
}

# 系统 lib 只读 mount 进沙箱 (python 启动需要 stdlib + libc)
# 注意: ARM64 / x86_64 路径不同, 部署脚本根据 uname 选
mount {
  src: "/usr/lib"
  dst: "/usr/lib"
  is_bind: true
  rw: false
}
mount {
  src: "/usr/bin/python3"
  dst: "/usr/bin/python3"
  is_bind: true
  rw: false
  mandatory: false             # 可选: 调用方按需替换 (例如 /opt/python3)
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  mandatory: false             # x86_64 有 /lib, 某些发行版 /lib 是 symlink
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  mandatory: false             # arm64 没有 /lib64, x86_64 有
}
mount {
  src: "/etc/ld.so.cache"
  dst: "/etc/ld.so.cache"
  is_bind: true
  rw: false
  mandatory: false
}

# /dev 必需 (python 启动要 /dev/null /dev/urandom)
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
  rw: false
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: false
}

# /proc (只读, 看不到沙箱外进程因为有 pid namespace)
mount {
  src: "none"
  dst: "/proc"
  fstype: "proc"
  rw: false
}

# TASK_DIR: 沙箱内唯一可写的工作目录
# 调用方用 --bindmount /tmp/catfish-task-<id>:/tmp/task 注入, 不在 cfg 写死
# (cfg 是模板, 每次 dispatch 用不同 TASK_DIR)

# ---------------------------------------------------------------------
# 环境变量 — 干净 env, 只放最小必要
# ---------------------------------------------------------------------
envar: "PATH=/usr/bin:/bin"
envar: "HOME=/tmp/task"        # HOME 重定向到 TASK_DIR (跟 macOS 对齐)
envar: "TMPDIR=/tmp/task"
envar: "LANG=C.UTF-8"
envar: "LC_ALL=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"   # 防写 .pyc 污染只读 lib

# 不要继承员工 mac 的 GITHUB_TOKEN / OPENAI_API_KEY 等 secret
keep_env: false

# ---------------------------------------------------------------------
# seccomp filter — 系统调用白名单
# (默认 nsjail 给一个合理的, 可以再收紧)
# ---------------------------------------------------------------------
# 这里用宽松默认, BL-S29.6 收口时再加严格 seccomp_string
# 关键 deny: ptrace (跨进程注入), mount/umount (改沙箱布局),
#           reboot (整机), bpf (eBPF 攻击), kexec_load
disable_no_new_privs: false     # 启用 no_new_privs, syscall filter 加固

# 显式 deny 一些危险 syscall (即使没收紧 seccomp_string 也兜底)
# nsjail 自己有默认黑名单, 这里只是文档化哪些必拦

# ---------------------------------------------------------------------
# 日志 / 输出
# ---------------------------------------------------------------------
log_level: WARNING               # 沙箱本身的 log 级别 (ERROR/WARNING/INFO/DEBUG)

# stderr 透传给调用方 (catfish_tool_bridge audit 能拿到)
# (默认就是透传, 不需要额外配置)

# END catfish_execute.cfg
