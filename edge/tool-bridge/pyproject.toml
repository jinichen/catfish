[project]
name = "catfish-tool-bridge"
version = "0.1.0"
description = "Bridge for Catfish Companion to call hermes-agent tools via unix socket JSON-RPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

# 运行时依赖:
#   - 主路径: stdlib only (asyncio unix socket / TCP localhost on Win, json 协议)
#   - BL-WIN2 (5/8): Windows 平台条件依赖 keyring (Win Credential Manager
#     wrapper). mac/Linux 用不到, 通过 sys_platform marker 只 Win 装. 没
#     keyring 时 secret_resolver 会 fallback 到 PowerShell Get-Secret, 但
#     keyring 体验更好 (1 个调用 vs 子进程).
# hermes-agent 不在 dependencies 里 —— 我们通过 sys.path 引用员工本机
# 装好的 hermes-agent，不重复安装；catfish-tool-bridge 跑在 hermes-agent 的
# 同一个 venv 里，所有 tool 依赖（markitdown / browser / mcp / ...）天然解决
dependencies = [
    "keyring >= 24; sys_platform == 'win32'",
    # 5/25 BL-RECMODE-MIGRATE-TO-EDGE: aggregator.call_llm / selector_repair 调
    # gateway /v1/chat/completions 走 httpx async client. 5/14 v0 在 central
    # 跑的时候 gateway venv 自带, 5/25 搬到 edge tool-bridge 后这个进程需要自己装.
    # 注意: 生产部署 tool-bridge 跟 hermes 共 venv, hermes 那个 venv 多半也装了
    # httpx (litellm 依赖), 那时这条是冗余安全配置. 单独建 venv 跑测试时必装.
    "httpx >= 0.27",
    # 5/26 BL-RECMODE-MIGRATE-TO-EDGE batch 1: cdp_listener 搬到 edge 后, tool-bridge
    # 进程需要 websockets 连 Chrome ws://localhost:9222. central venv 之前装过, 这里
    # 单独建 venv 跑测试时必装. 跟 httpx 同性质 (生产部署跟 hermes 共 venv 通常已有).
    "websockets >= 12.0",
]

[project.scripts]
catfish-tool-bridge = "catfish_tool_bridge.__main__:main"

# 5/8: dev 依赖 — 测试套件 import skill 内部 (department/*/script.py),
# 这些 skill 用 python-docx / openpyxl / pypdfium2.
# 生产部署 tool-bridge 跟 hermes 共 venv (hermes 已装这些), 不需要 deps.
# 但**单独建 tool-bridge/venv** 跑测试时, 需要 pip install -e '.[dev]'.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "python-docx>=1.0",  # leadership-briefing / weekly-report skill 用
    "openpyxl>=3.0",     # excel skill 用
    "pypdfium2>=4.0",    # pdf 解析用
]
# BL-SANDBOX-PPTX (5/15 鸿波撞 PPT 退化成 markdown): execute_code 沙箱里 LLM
# 生成 PPT / 数据图 / 报表用的 lib. 跟 sandbox.py 改用 sys.executable 配合 —
# sys.executable = tool-bridge venv 的 python, 装这里 LLM 立刻能 import. 之前
# 写死 /usr/bin/python3 系统 python 啥都没装, LLM 生成 PPT 自动退化成 markdown.
#
# 装法: pip install -e '.[execute]' (在 tool-bridge venv 里)
# 没装的话 LLM execute_code 调 import pptx 仍会失败, 但会清晰报 ModuleNotFoundError
# 而不是退化, agent 知道这事 → 跟员工说"还没装这个库, 让 IT 装一下".
execute = [
    "python-pptx>=1.0",   # LLM 生成 .pptx (周报 / 立项 / 汇报场景)
    "Pillow>=10.0",       # PPT 嵌图 / 处理截图
    "matplotlib>=3.7",    # PPT/Excel 嵌数据图
    "pandas>=2.0",        # 数据分析 + 生成报表
    "python-docx>=1.0",   # 也补 .docx (跟 dev 段重复 — execute 不应依赖 dev)
    "openpyxl>=3.0",      # 同上, .xlsx 表格
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
