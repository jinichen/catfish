[project]
name = "catfish-tool-bridge"
version = "0.1.0"
description = "Bridge for Catfish Companion to call hermes-agent tools via unix socket JSON-RPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

# 运行时依赖:
#   - 主路径: stdlib only (asyncio unix socket / TCP localhost on Win, json 协议)
#   - BL-WIN2 (5/8): Windows 平台条件依赖 keyring (Win Credential Manager
#     wrapper). mac/Linux 用不到, 通过 sys_platform marker 只 Win 装. 没
#     keyring 时 secret_resolver 会 fallback 到 PowerShell Get-Secret, 但
#     keyring 体验更好 (1 个调用 vs 子进程).
# hermes-agent 不在 dependencies 里 —— 我们通过 sys.path 引用员工本机
# 装好的 hermes-agent，不重复安装；catfish-tool-bridge 跑在 hermes-agent 的
# 同一个 venv 里，所有 tool 依赖（markitdown / browser / mcp / ...）天然解决
dependencies = [
    "keyring >= 24; sys_platform == 'win32'",
]

[project.scripts]
catfish-tool-bridge = "catfish_tool_bridge.__main__:main"

# 5/8: dev 依赖 — 测试套件 import skill 内部 (department/*/script.py),
# 这些 skill 用 python-docx / openpyxl / pypdfium2.
# 生产部署 tool-bridge 跟 hermes 共 venv (hermes 已装这些), 不需要 deps.
# 但**单独建 tool-bridge/venv** 跑测试时, 需要 pip install -e '.[dev]'.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "python-docx>=1.0",  # leadership-briefing / weekly-report skill 用
    "openpyxl>=3.0",     # excel skill 用
    "pypdfium2>=4.0",    # pdf 解析用
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
