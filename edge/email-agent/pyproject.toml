[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catfish-email"
version = "0.1.0"
description = "Catfish Email Agent — 让小鲶替员工读邮件 + 起草回复 (Outlook/Foxmail 桌面客户端集成)"
authors = [{name = "Catfish Team"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # 标准库够用; pywin32 仅 Windows Outlook adapter 需要, 平台条件依赖
]

[project.optional-dependencies]
windows = [
    "pywin32 >= 306; sys_platform == 'win32'",
]
dev = [
    "pytest >= 7",
    "pytest-mock >= 3",
]

[project.scripts]
catfish-email = "catfish_email.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/test_box_parser.py"
# box_parser.py 是给 Foxmail Win 7 老格式用的, Mac 1.5+ 走 SQLite (foxmail_db.py)
# 跳过 box_parser 测试 直到 Foxmail Win adapter 真做时再启用
