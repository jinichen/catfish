[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catfish-journal"
version = "0.1.0"
description = "Catfish Journal Agent — 让小鲶通过对话改 ~/.catfish/employee_journal.md (mark done / delete / add TODO)"
authors = [{name = "Catfish Team"}]
license = {text = "MIT"}
requires-python = ">=3.10"
# 全标准库, 无外部依赖
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest >= 7",
]

[project.scripts]
catfish-journal = "catfish_journal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# 5/21 加: 让 pytest 不用先 `pip install -e .` 也能跑 tests
# (沙箱 / CI / 新员工刚 clone repo 时友好). 跟 editable install 同效,
# 但不污染 site-packages.
[tool.pytest.ini_options]
pythonpath = ["src"]
