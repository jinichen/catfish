[package]
name = "catfish-companion-app"
version = "0.1.0"
description = "Catfish Companion App - desktop sidekick for the Catfish platform"
authors = ["Catfish Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "catfish_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
# SQLite，bundled 自带 sqlite3，免装 libsqlite3-dev
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
# YAML 解析（读 ~/.hermes/config.yaml 和 SKILL.md frontmatter）
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
