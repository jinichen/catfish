[package]
name = "catfish-companion-app"
# BL-COMPANION-VERSION-SYNC: Companion 自身三处版本必须同步。
# Hermes 是独立发布物，由 .hermes-target-version / tag / commit 单独固定。
# 改时记得同步 src-tauri/tauri.conf.json + ../package.json + package-lock.json。
# CI lint: scripts/check_version_sync.sh
version = "1.0.0"
description = "Catfish Companion App - desktop sidekick for the Catfish platform"
authors = ["Catfish Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "catfish_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2.0"
# 五一 sprint 5/5: 全局快捷键 (Cmd+Shift+Space 召唤浮窗)
tauri-plugin-global-shortcut = "2.0"
# 7/15 BL-COMPANION-LOG-FILE: log::info!/warn!/error! → ~/Library/Logs/com.catfish.companion/*.log
# 替代裸 env_logger (GUI app 无 stdout, warn 级默认吞掉 info)
tauri-plugin-log = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "brotli", "blocking"] }  # P3.3.8 (6/10) fix: wttr.in 默认 gzip 压缩. P3.5.15 (6/16): 加 blocking — embedding provider Auto 启动 probe sync ping remote /v1/models
urlencoding = "2.1"  # P3.3.8 (6/10): weather command 拉 wttr.in 时 encode 中文城市名
# SQLite，bundled 自带 sqlite3，免装 libsqlite3-dev
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
# YAML 解析（读 ~/.hermes/config.yaml 和 SKILL.md frontmatter）
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
# Hermes 首启引导跨进程 single-flight。文件锁在进程退出/崩溃时由 OS 自动释放。
fs2 = "0.4"
# env_logger 5/x 起被 tauri-plugin-log 替代 (7/15 BL-COMPANION-LOG-FILE)
# Phase 1C SSO: keyring (macOS Keychain / Win Credential Manager / Linux Secret Service)
#
# ⚠ 平台后端**必须显式开 feature**, 见下面的 [target.*] 段。
#
# 8/18 实撞: 这里原来是光秃秃的 `keyring = "3"`。keyring **v3 起**取消了默认
# 平台后端 (v2 是自带的), 什么 feature 都不开时它 `pub use mock as default`
# —— crate 文档原话 "this crate will use the (platform-independent) _mock_
# credential store"。
#
# 后果: set_password 返 Ok(()), 界面显示"已保存", 而密码只进了一个**进程内
# 的假存储**, 退出就没。教学时 `security find-generic-password` 当然找不到:
#
#     keychain 里没有 service 'catfish-teaching:neis.ffcs.cn'
#
# 8/17 那次"存了也白存"也是它。当时查到的方向是引用串套娃 / 名字对不上 ——
# 那些是真问题也修了, 但底下还压着这一条: **UI 存的密码从来没进过钥匙串**。
# 手工 `security add-generic-password` 建的 (例 eis_password) 一直能读, 正是
# 因为它绕开了这个 crate。
#
# 只声明当前平台需要的那个 —— feature 是 additive 的, 三个都开会把 Linux 的
# dbus / secret-service 依赖拉进 macOS 构建。
keyring = "3"
# OAuth flow: 生成 state / code_challenge (Phase 2 PKCE 用)
rand = "0.8"
# base64url 编 state
base64 = "0.22"
# url 解析 query params
url = "2"
# BL-JOURNAL-TODO-EXTRACT (5/20): journal markdown TODO 抽取 regex
regex = "1"
# P38 (6/5 鸿波): 本机 ONNX embedding (BGE-M3) — wiki 语义搜索, 完全离线.
# ort 2.0 用 onnxruntime native runtime, Apple Silicon CPU backend 默认.
# CoreML provider 留 P38.3 (要 feature flag + extra link). CPU INT8 已 ~300ms / query.
# default features `含 download-binaries + tls-rustls, 不要 default-features=false.
#
# 7/16 BL-INTEL-DMG: ort 官方**不发** x86_64-apple-darwin prebuilt binary
# (build 时报 "does not provide prebuilt binaries for the target x86_64-apple-darwin").
# Intel Mac dmg 走 Remote embedding (gateway /v1/embeddings → 内网 BGE-M3),
# 不 depend ort/tokenizers. Cargo.toml target.aarch64 只让 arm64 编时下 ort.
# 见 services/embedding.rs 的 #[cfg(target_arch = "aarch64")] guard.
# tokenizers 是 pure Rust 支持 x86_64, 但只 Local provider 用, 跟 ort 一起 guard 保持 clean.
# ort = "2.0.0-rc.12"           # 移到下面 target-specific
# tokenizers = "0.20"           # 同上
# 不显式依赖 ndarray — ort 内部用 0.17, 我们走 tuple syntax (shape, Vec<T>) 避免 version 冲突
# P3.3.23 (6/11): 装外部 skill zip 解压. 默认 features 含 deflate / bzip2 不需要,
#   bzip2 需要 C 依赖 — 关 default-features 只留 deflate. 50MB 上限防 bomb.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# P3.3.51 (6/12): audit hash chain — sha256 + hex 编. decisions / political_scan
#   等审计相关 jsonl 走 chain_append 加 prev_sha256+sha256 字段, chain_verify
#   能现场 detect 被篡改的行. 跟 ~/.catfish/<file>.chain.json 配对.
sha2 = "0.10"
hex = "0.4"
# P3.3.54 (6/12): 审计员看的 xlsx 多 sheet 导出 (decisions + tool_call + outbound +
#   校验报告). pure Rust write-only, MIT, <2MB. 写本机 ~/.catfish/exports/.
rust_xlsxwriter = "0.79"
# 本机聊天导出文件选择。只返回员工显式选择的路径，不扫描微信目录。
rfd = "0.15"

[dev-dependencies]
# tempfile: 给单测建临时 ~/.hermes 目录用 (session_write / learning / endpoints)
tempfile = "3"
# P3.5.143 (6/30 鸿波): cargo test 默认并行, dedup_* 4 个测试共享 static
#   push_history 触发 race. #[serial(push_history)] 串行 4 个测试.
# P3.5.144: hermes_api_config 4 个测试共享 env vars + yaml 文件, 同款 #[serial(env)].
serial_test = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# 8/18: keyring v3 的平台后端。不开 feature = mock store (存了等于没存),
# 见上面 keyring 那段。分平台声明, 免得把别的平台的依赖拉进来。
#
# 只有 macOS / Windows —— resources/ 里就这三个包 (mac-aarch64 / mac-x64 /
# windows), 不发 Linux。加上 linux 那段会为一个不构建的平台往 Cargo.lock 里
# 塞 51 个包 (secret-service / dbus / aes / async-io 一整串)。
# 真要支持 Linux 时加 `sync-secret-service` —— 别让它静默掉回 mock,
# commands/teaching_credentials/mod.rs 顶上有 compile_error! 守着。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# 8/19: 这里一度还有 core-foundation / -sys / security-framework-sys / libc 四个,
# 给 mac_acl.rs 手写 FFI 用 —— 目的是把 `/usr/bin/security` 写进钥匙串条目的
# 信任名单, 好让 tool-bridge 读得到。
#
# 那条路作废了: `security` 是谁都能 exec 的通用工具, 把它放进信任名单跟
# `add-generic-password -A`(对所有程序开放) 没有实质区别 —— 等于自己把墙拆了。
# 现在改成"谁有权限谁去读": 名单保持只有 Companion, tool-bridge 走
# ~/.catfish/companion-secrets.sock 问我们要 (teaching_credentials/socket.rs)。
#
# 于是 5 个手写 extern 和这 4 个依赖一起删掉, keyring 一个就够。

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# 7/16 BL-INTEL-DMG: ort 官方不发 x86_64-apple-darwin prebuilt binary → Intel
# Mac dmg build 时挂. Fix: ort + tokenizers 只在 aarch64 (Apple Silicon + Linux
# arm) 依赖. x86_64-apple-darwin 走 embedding Remote provider (纯 reqwest, gateway
# /v1/embeddings → 内网 BGE-M3 GPU). Windows msi 也是 x86_64 但 target_arch 检查用
# 同样 cfg, msi 也不 depend ort → 之前 Windows Companion 里 wiki 语义搜索一直挂,
# 现在也 fallback Remote → 顺带修好.
#
# 影响面:
#   - x86_64-apple-darwin (Intel Mac dmg) — 用 Remote embedding, chat 全功能
#   - x86_64-pc-windows-msvc (Windows msi) — 同上, wiki 搜索走 gateway
#   - aarch64-apple-darwin (Apple Silicon dmg) — Local ONNX 完全保留
#   - aarch64-unknown-linux-* (若未来支持 Linux mac client) — Local ONNX 保留
[target.'cfg(target_arch = "aarch64")'.dependencies]
# ONNX Runtime Rust binding. 只 aarch64 有 prebuilt.
ort = "2.0.0-rc.12"
# tokenizers: BGE-M3 XLM-R BPE. 纯 Rust 也支持 x86_64, 但只 Local provider 用,
# 跟 ort 一起 guard 免 x86_64 dmg 额外无用依赖.
tokenizers = "0.20"
