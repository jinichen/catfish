<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鲶鱼桌宠</title>
    <style>
      /* 5/5 BL-E27 spike: 全透明背景, 让窗口跟桌面无缝.
         html/body 都得 transparent + 0 padding/margin. */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 默认整个 body 不抢鼠标 (让点击穿透到桌面),
           只在 mascot 区域恢复, 防整个窗口拦鼠标. */
        pointer-events: none;
      }
      #pet-root {
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: transparent !important;
      }
      /* 防 React DevStrictMode wrapper / 任何中间层加 bg.
         注: 不影响 bubble 的内部 background (那是嵌套子元素 inline style). */
      #pet-root {
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="pet-root"></div>
    <script type="module" src="/src/pet.tsx"></script>
  </body>
</html>
