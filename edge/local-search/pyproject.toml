[project]
name = "catfish-local-search"
version = "0.1.0"
description = "员工 Mac 本地文件全文搜索，供小鲶调用"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# 只索引 md/txt 的超轻量装法
lite = []

# 全文档类型支持（md/pdf/docx/xlsx/pptx）
all = [
    "markitdown[all]>=0.0.1",
    "watchdog>=4.0",
    "mcp>=1.0",
]

# 只要增量监听，不要 markitdown
watch = [
    "watchdog>=4.0",
]

# 暴露成 MCP tool 给 Hermes / Claude Desktop / 其他 MCP client 用
mcp = [
    "mcp>=1.0",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.7.0",
    "watchdog>=4.0",
]

# 打 PyInstaller 单文件二进制
build = [
    "pyinstaller>=6.0",
    "watchdog>=4.0",
    "markitdown[all]>=0.0.1; python_version >= '3.10'",
]

[project.scripts]
catfish-search = "catfish_search.cli:main"
catfish-search-mcp = "catfish_search.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PL", "C90", "N", "UP", "B"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 12
max-returns = 6
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR2004", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
