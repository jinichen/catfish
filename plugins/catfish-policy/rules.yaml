# ============================================================
# 鲶鱼红线策略 · 默认规则
# ============================================================
# 原则：
#   • 只定义"禁止做什么"，不审查对话内容
#   • 每条规则命中时返回给 agent 一段可解释的说明，让它能告诉员工
#   • 规则应该少而准 —— 宁可漏一条，不可误杀
# ============================================================

version: 1

rules:

  # ---------- R1: 系统级破坏命令 ----------
  # 用正则, 不用子串: 子串 "rm -rf /" 会把 "rm -rf /tmp/xxx"、"rm -rf ~/Downloads/x"
  # 这种正常清理也拦掉。只拦目标恰好是根 / 家目录本身的。
  - id: no-recursive-root-delete
    kind: shell_command
    match:
      - ":(){ :|:& };:"        # fork bomb
      - "dd if=/dev/zero of=/dev/"
    match_regex:
      - '(?:^|[;&|(`\s"\x27])rm\s+-[a-zA-Z]*[rR][a-zA-Z]*\s+(?:--no-preserve-root\s+)?(?:/|/\*|~|~/|~/\*|\$HOME|\$HOME/|\$HOME/\*)(?=$|[\s;&|)`"\x27])'
      - '(?:^|[;&|(`\s])mkfs\.'                # 格式化
    reason: |
      系统级破坏命令被策略拦截。如果你需要清理文件，请限定具体目录
      （例如 rm -rf ./some-specific-dir）。

  # ---------- R2: 敏感凭据文件读取 ----------
  - id: no-credential-file-read
    kind: file_read
    paths:
      - "~/.ssh/id_*"
      - "~/.ssh/*_rsa"
      - "~/.ssh/*_ed25519"
      - "~/.aws/credentials"
      - "~/.gnupg/**"
      - "~/Library/Keychains/**"
      - "~/.config/gcloud/**"
    reason: |
      敏感凭据路径被策略拦截。如果你确实需要访问公钥或配置，请明确
      指定非密钥文件（如 ~/.ssh/config）。

  # ---------- R3: 绕过网关直接调公共 LLM ----------
  - id: no-rogue-llm
    kind: network_request
    deny_hosts:
      - "api.openai.com"
      - "api.anthropic.com"
      - "generativelanguage.googleapis.com"
      - "api.deepseek.com"
      - "api.x.ai"
    reason: |
      检测到直接调用公共 LLM 端点。请通过鲶鱼网关
      (CATFISH_GATEWAY_URL，默认 http://127.0.0.1:8999) 访问模型，
      以保证数据主权与用量可见。

  # ---------- R4: 本机钥匙串 / Credential Manager ----------
  - id: no-keychain-access
    kind: shell_command
    match:
      - "security find-generic-password"
      - "security find-internet-password"
      - "security export"
    reason: |
      禁止通过 shell 读取本机钥匙串。如果 agent 需要某个凭据，请
      通过鲶鱼 Secret Broker 获取（即将在 P1 上线）。

  # ---------- R5: 无确认安装 cron ----------
  # TODO(P1): 等 Hermes cronjob 工具的 pre_tool_call 钩子稳定后再接
  # - id: cron-requires-confirm
  #   kind: tool_name
  #   match: ["cronjob"]
  #   require_user_confirm: true
  #   reason: "新的定时任务需要员工明确确认"

  # ---------- R6: 防 LLM 误删 catfish-* skill ----------
  # 历史踩坑 (2026-04-26): Qwen3.6-Flash 在 catfish-email skill 命令调用失败时
  # 自作主张调 skill_manage(action=delete, name=catfish-email) "试图 reinstall",
  # 把员工的 catfish skill 软链给 rm 了, 导致后续工具一直找不到。
  # 红线: 任何 catfish-* skill 由员工 / install.sh 管理, LLM 不准动。
  #
  # 10/21: 原来写成 kind: tool_name + deny_args_pattern, 但匹配器忽略了
  # deny_args_pattern —— 真装上会把**所有** skill_manage 调用都拦掉 (近 30 天回放
  # 141/141 次误拦)。改成按单个技能操作匹配, v0.22 的批量 operations 格式也认。
  - id: no-delete-catfish-skill
    kind: skill_op
    actions: [delete]
    name_regex: '^catfish-'
    reason: |
      绝不允许 LLM 删除 catfish 自家 skill (catfish-email / catfish-browser-* 等)。
      如果 skill 命令跑不通, 让员工重新跑 install.sh, 不是删 skill。

  # ---------- R7: 技能正文里不准存明文凭据 ----------
  # 配套 SOUL.md "Skill 生成纪律" 章: 只存"步骤模板", 真实凭据让员工每次输入。
  # 只看写进去的正文 (create/patch 的 content、patch 的 new_string、write_file 的
  # file_content), 不看 old_string。
  #
  # 只拦"后面跟着真值"的写法: `password: xxx` / `api_key=sk-...` / `Bearer eyJ...`。
  # 占位符 (<password> / ${TOKEN} / xxx / ***) 和"密码由员工输入"这种说明不拦。
  # 邮箱地址不拦: 技能里写收件人 / 示例地址是正常的 (原规则看到 @ 就拦, 误杀面太大)。
  - id: skill-create-no-secrets
    kind: skill_op
    actions: [create, patch, edit, write_file]
    content_regex:
      - '(?i)\b(?:password|passwd|pwd|密码)\s*[:=：]\s*["\x27]?(?![<{$*（(]|x{3}|\.{3}|…|无|空|员工|用户|your|待)[^\s"\x27<>{}`]{6,}'
      - '(?i)\b(?:api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token)\s*[:=：]\s*["\x27]?(?![<{$*（(]|x{3}|\.{3}|…|your)[A-Za-z0-9_\-]{16,}'
      - '(?i)Authorization:\s*Bearer\s+(?![<{$*]|x{3}|\.{3}|…|your|TOKEN)[A-Za-z0-9._\-]{20,}'
      - '\b(?:sk-(?![xX*.]{6})[A-Za-z0-9_\-]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9\-]{10,})'
    reason: |
      skill 内容里检测到明文凭据 (密码 / API key / token)。
      这些不能存进 skill 文件 (skill 会被读 + 共享, 凭据会泄漏)。
      只存"步骤模板", 真实凭据让员工每次输入或从系统钥匙串拿。
      详见 SOUL.md 'Skill 生成纪律' 章。

  # ---------- R10: (已删除) skill_manage update/delete 必须带 review 关键词 ----------
  # 10/21 删除。原规则要求参数里出现"已 backup / 员工已确认"之类关键词, 但:
  #   - v0.22 的动作叫 patch/edit, 不叫 update, 规则其实拦不到改动;
  #     回放里命中的 13 次全是正文里恰好出现 "update" 这个词的正常 patch
  #   - 关键词是模型自己写的, 拦不住真想偷偷改的模型, 只会逼它学会念咒
  # 改动可回滚这件事 hermes v0.22 自己已经做了: 每次技能改动 (含后台 review /
  # curator) 都写进 ~/.hermes/skills/.curator_ledger.jsonl, 改前内容按 sha256 存
  # ~/.hermes/.curator_backups/blobs/, `hermes curator ledger` 看、
  # `hermes curator rollback <id>` 回滚单次改动; 后台删除走可恢复的 .archive/。
  # 编号保留作为踩坑标记, 不要复用。

  # ---------- R8: (已删除) screenshot active_window 模式约束 ----------
  # 历史: 2026-04-27 因 macOS Automation 权限对 hermes venv unsigned python3.11
  # 不持久化, active_window 模式被彻底从 catfish_screenshot 删除. 代码层面已没
  # 这个分支, policy 不再需要此规则. 编号保留作为踩坑标记, 不要复用.

  # ---------- R9: 禁止 LLM 自作主张改员工的 hermes config / SOUL ----------
  # 历史踩坑 (2026-04-27): LLM 调了不存在的 memory tool 拿到 "tool 不可用" 错误,
  # 不去查 tool list, 反而**幻觉成"是 config 坏了"**, 用 patch 工具改员工
  # ~/.hermes/config.yaml 加了一个未经验证的 provider:auto 值. 员工没同意, 改完
  # 还要重启 hermes —— 这是典型的"工具 error 一脚踩进配置 cargo cult".
  #
  # 这两个文件由员工 / install.sh / catfish 平台管理:
  #   ~/.hermes/config.yaml   - hermes 主配置, 改错可能让 hermes 启动失败
  #   ~/.hermes/SOUL.md       - 鲶鱼人格定义, 改了影响所有后续对话
  #   ~/.hermes/USER.md       - 顶层 memory, 改了 LLM 后续行为变化
  - id: no-touch-hermes-control-files
    kind: file_write
    paths:
      - "~/.hermes/config.yaml"
      - "~/.hermes/SOUL.md"
      - "~/.hermes/USER.md"
    reason: |
      你不能擅自改员工的 hermes 控制文件 (config.yaml / SOUL.md / USER.md)。
      这些是平台 / 员工管理的, LLM 自动改容易引入未经验证的配置导致服务挂掉。

      正确做法:
        - 工具调用报"不可用" → 去查 tool list 看真实工具名是什么 (`memory_save` / `memory_recall`),
          不是假设是 config 坏了去改 config
        - 真有 config 问题 → 跟员工说"你的 config 里 X 字段为空, 我建议改成 Y, 你确认改吗?"
          得到员工"对, 改" 才动
        - 想给员工记新 memory → 写 ~/.hermes/memories/*.md (不是 USER.md), 详见 SOUL "Memory 写入纪律"
