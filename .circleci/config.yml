# CircleCI Windows msi build (W2.20 7/13, GH Actions billing 爆 + AppVeyor
# private 收费, 切 CircleCI free tier: 30k credits/月, private OK).
#
# 复用 .github/workflows/build-windows-msi.yml 全部逻辑 (W2.10-W2.18 fix)
# 翻译到 CircleCI 2.1 语法.
#
# Free tier 用量:
#   Windows VM Medium (4 CPU / 16 GB) = 40 credits/min
#   一次 build ~40 min = 1600 credits
#   30000 / 1600 ≈ 18 次 build/月 (够 iter 出 msi + 后续偶尔重编)
#
# 装法:
#   1. https://app.circleci.com/signup → GitHub 账号登录 (private repo 授权)
#   2. Projects → jinichen/catfish → Set Up Project → 选 "Fastest" (fast setup)
#   3. push main 触发 build, 或页面 Trigger Pipeline
#   4. 完成后 Job 页面 Artifacts tab 下 msi

version: 2.1

orbs:
  win: circleci/windows@5.1.0

jobs:
  build-msi:
    executor:
      name: win/default          # Windows Server 2022 image
      size: medium                # 4 CPU / 16 GB RAM, 40 credits/min
      shell: powershell.exe -ExecutionPolicy Bypass -NoProfile

    environment:
      RUST_LOG: info
      # W2.10 patch_install_ps1_offline.py Windows Python cp1252 stdout 挂
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      # W2.14 esaxx-rs (tokenizers C++) cc-rs 默认 /MT static CRT 跟 ort-sys
      # /MD dynamic CRT 撞 LNK2038. force /MD 全局对齐.
      CFLAGS_x86_64_pc_windows_msvc: /MD
      CXXFLAGS_x86_64_pc_windows_msvc: /MD
      # W2.23 (CircleCI run #2 铁证): W2.21 rustup default 没生效, 因为
      # rustup 支持 RUSTUP_TOOLCHAIN env var override, 无论 default 设啥,
      # 强制 rustup shim (rustc/cargo) 走这个 toolchain. 全局设定所有 step
      # 都用 MSVC host, 避免 CircleCI image preinstalled GNU host 或
      # rustup default 未生效等边界.
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc

    steps:
      - checkout

      # ─── 装 toolchain (Windows Server 2022 image 有 git/pwsh/choco/node/python,
      #      需自装 Rust MSVC target) ───

      - run:
          name: Verify preinstalled tools
          command: |
            node --version
            npm --version
            python --version
            git --version

      - restore_cache:
          keys:
            - rust-cargo-v1-{{ checksum "edge/companion-app/src-tauri/Cargo.lock" }}
            - rust-cargo-v1-

      - run:
          name: Install Rust MSVC toolchain + target (W2.21+W2.23 加大诊断)
          command: |
            $ErrorActionPreference = 'Stop'
            $cargoBin = "$env:USERPROFILE\.cargo\bin"
            $rustupExe = "$cargoBin\rustup.exe"

            Write-Host "===== CircleCI preinstalled Rust state ====="
            Write-Host "USERPROFILE = $env:USERPROFILE"
            Write-Host "cargo bin exists: $(Test-Path $cargoBin)"
            Write-Host "rustup.exe exists: $(Test-Path $rustupExe)"
            Get-Command rustup -ErrorAction SilentlyContinue | Format-List
            Get-Command rustc -ErrorAction SilentlyContinue | Format-List
            Get-Command cargo -ErrorAction SilentlyContinue | Format-List

            if (-not (Test-Path $rustupExe)) {
              Write-Host "===== Installing rustup fresh ====="
              $init = "$env:TEMP\rustup-init.exe"
              Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile $init
              & $init --default-toolchain none -y --profile minimal
              if ($LASTEXITCODE -ne 0) { throw "rustup-init failed: $LASTEXITCODE" }
            }

            Write-Host "===== Installing stable-x86_64-pc-windows-msvc ====="
            & $rustupExe toolchain install stable-x86_64-pc-windows-msvc --profile minimal --force
            if ($LASTEXITCODE -ne 0) { throw "toolchain install failed: $LASTEXITCODE" }

            Write-Host "===== rustup default stable-x86_64-pc-windows-msvc ====="
            & $rustupExe default stable-x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "rustup default failed: $LASTEXITCODE" }

            # 幂等 target add
            & $rustupExe target add x86_64-pc-windows-msvc

            # W2.23 关键诊断: 确认 rustup shim 会 dispatch 到 MSVC
            # RUSTUP_TOOLCHAIN env 也设了 (job env), 双保险.
            Write-Host "===== rustup show ====="
            & $rustupExe show
            Write-Host "===== rustup which cargo ====="
            & $rustupExe which cargo
            Write-Host "===== rustup which rustc ====="
            & $rustupExe which rustc
            Write-Host "===== rustc --version -v ====="
            & "$cargoBin\rustc.exe" --version --verbose
            Write-Host "===== rustc --print sysroot ====="
            & "$cargoBin\rustc.exe" --print sysroot
            Write-Host "===== target list --installed ====="
            & $rustupExe target list --installed
            Write-Host "===== ~/.rustup/settings.toml ====="
            Get-Content "$env:USERPROFILE\.rustup\settings.toml" -ErrorAction SilentlyContinue
            Write-Host "===== RUSTUP_TOOLCHAIN env ====="
            Write-Host "RUSTUP_TOOLCHAIN = '$env:RUSTUP_TOOLCHAIN'"

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "edge/companion-app/package-lock.json" }}
            - npm-v1-

      # ─── Prepare Windows resources (patched install.ps1 + uv + cpython + hermes tar) ───

      - run:
          name: Clone hermes-agent pinned tag
          command: |
            $ErrorActionPreference = 'Stop'
            $HERMES_TAG = (Get-Content edge\companion-app\.hermes-git-tag -Raw).Trim()
            $HERMES_VER = (Get-Content edge\companion-app\.hermes-target-version -Raw).Trim()
            Write-Host "Cloning hermes-agent GitHub tag=$HERMES_TAG (pyproject version=$HERMES_VER)"
            $hermesDir = "$env:TEMP\hermes-agent-src"
            if (Test-Path $hermesDir) { Remove-Item -Recurse -Force $hermesDir }
            git clone --depth 1 --branch $HERMES_TAG `
              https://github.com/NousResearch/hermes-agent.git $hermesDir
            # verify pyproject version 匹配
            $verLine = Select-String -Path "$hermesDir\pyproject.toml" -Pattern '^version'
            $actualVer = ($verLine.Line -replace '^version\s*=\s*"([^"]+)".*', '$1').Trim()
            if ($actualVer -ne $HERMES_VER) {
              throw ".hermes-git-tag ($HERMES_TAG) => pyproject $actualVer, expected $HERMES_VER"
            }
            Write-Host "OK version match: $HERMES_VER"

      - run:
          name: Copy catfish plugins into hermes-agent-src
          command: |
            $ErrorActionPreference = 'Stop'
            $hermesDir = "$env:TEMP\hermes-agent-src"
            New-Item -ItemType Directory -Force -Path "$hermesDir\plugins\memory" | Out-Null
            foreach ($plugin in @('catfish-memory', 'catfish-todo-sync')) {
              $src = "edge\hermes-plugins\$plugin"
              if (Test-Path $src) {
                Copy-Item -Recurse -Force $src "$hermesDir\plugins\memory\$plugin"
                Write-Host "OK copied $plugin"
              } else {
                Write-Host "WARN: $src missing"
              }
            }

      # BL-WIN-INSTALL-NPM-OFFLINE (7/17): 达华员工机完全无公网, install.ps1 里的
      # npm install 步骤会挂. CircleCI Windows executor 有公网, 我们在这里先跑
      # npm install 生成 node_modules/, 打进 tar.gz. 员工装完 msi 就有完整
      # node_modules, install.ps1 里 npm install 步骤命中 lockfile + node_modules
      # 已存在 → 秒过 (不用网络).
      #
      # 覆盖范围: hermes-agent-src/ 下**所有** package.json (Depth 4 内, 排 node_modules 内嵌).
      # 常见位置: hermes-agent-src/gateway/browser/, hermes-agent-src/tools/*/, 顶级/scripts/.
      #
      # Playwright chromium 不装 (它会另下 ~350MB 到 %LOCALAPPDATA%\ms-playwright\).
      # 员工用浏览器工具时若真需要 chromium, 那次会挂, 之后再补 (阶段 2 增强).
      - run:
          name: Pre-install Node.js deps + pack global .tgz (BL-WIN-INSTALL-NPM-OFFLINE)
          command: |
            $ErrorActionPreference = 'Stop'
            $hermesDir = "$env:TEMP\hermes-agent-src"
            # 跳过 Playwright browser download (装完 npm 就 350MB 再 chromium 就爆 msi).
            # 员工用 Playwright 时若真需要 chromium, 那次会挂 → 后续阶段单独打包.
            $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
            $env:PLAYWRIGHT_BROWSERS_PATH = '0'

            # ==== A. 本地 npm install (处理 _Run-NpmInstall Browser tools + TUI) ====
            # Depth 4 内找 package.json, 排 node_modules 内嵌 (避免递归重复装)
            $pkgFiles = Get-ChildItem -Path $hermesDir -Recurse -Filter "package.json" -Depth 4 -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -notmatch '\\node_modules\\' }
            if ($pkgFiles.Count -eq 0) {
              Write-Host "OK 无 package.json (hermes-agent 该版本无 npm 依赖), skip"
            } else {
              foreach ($pkg in $pkgFiles) {
                $pkgDir = $pkg.DirectoryName
                Write-Host "===== npm install in $pkgDir ====="
                Push-Location $pkgDir
                try {
                  # 优先 npm ci (严格 lockfile), fallback npm install (无 lockfile 的场景)
                  if (Test-Path "$pkgDir\package-lock.json") {
                    npm ci --no-audit --no-fund --loglevel=error 2>&1
                  } else {
                    npm install --no-audit --no-fund --loglevel=error 2>&1
                  }
                  if ($LASTEXITCODE -ne 0) {
                    throw "npm install failed in $pkgDir (exit=$LASTEXITCODE)"
                  }
                } finally {
                  Pop-Location
                }
              }
              Write-Host "OK all npm deps pre-installed ($($pkgFiles.Count) package.json 处)"
            }

            # ==== B. npm pack 全局包 .tgz (处理 Install-AgentBrowser line ~371) ====
            # install.ps1 里全局装 agent-browser + @askjo/camofox-browser · 员工无公网必挂.
            # 这里 npm pack 生成 .tgz 到 hermes-agent-src/node-globals/, 打进 tar.gz,
            # 员工 install.ps1 patch 5 会从本地 .tgz 装 (跳 registry).
            $globalsDir = "$hermesDir\node-globals"
            New-Item -ItemType Directory -Force -Path $globalsDir | Out-Null
            Push-Location $globalsDir
            try {
              # npm pack 会下载 tarball 到当前目录, 不需要真装
              npm pack "agent-browser@^0.26.0" "@askjo/camofox-browser@^1.5.2" --loglevel=error 2>&1
              if ($LASTEXITCODE -ne 0) {
                throw "npm pack global 挂 (exit=$LASTEXITCODE)"
              }
              $tgzList = Get-ChildItem -Filter "*.tgz"
              Write-Host "OK npm pack global .tgz ready: $($tgzList.Count) 个"
              $tgzList | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length/1KB,1)) KB)" }
              if ($tgzList.Count -lt 2) {
                throw "expected >=2 .tgz (agent-browser + camofox-browser), got $($tgzList.Count)"
              }
            } finally {
              Pop-Location
            }

      - run:
          name: Patch install.ps1 offline mode
          command: |
            $ErrorActionPreference = 'Stop'
            python edge\hermes-fork\patch_install_ps1_offline.py `
              --input "$env:TEMP\hermes-agent-src\scripts\install.ps1" `
              --output edge\companion-app\src-tauri\resources\windows\install.ps1
            if ($LASTEXITCODE -ne 0) { throw "patch failed" }
            $marker = Select-String -Path edge\companion-app\src-tauri\resources\windows\install.ps1 -Pattern 'CATFISH-OFFLINE-PATCH-v1'
            if (-not $marker) { throw "patch marker missing" }
            Write-Host "install.ps1 patched OK"

      - run:
          name: Download uv Windows x86_64
          command: |
            $ErrorActionPreference = 'Stop'
            $UV_VERSION = '0.4.30'
            $url = "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
            $zip = "$env:TEMP\uv.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            $extractDir = "$env:TEMP\uv-extract"
            if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
            Expand-Archive -Path $zip -DestinationPath $extractDir -Force
            Copy-Item "$extractDir\uv.exe" edge\companion-app\src-tauri\resources\windows\uv.exe -Force

      - run:
          name: Download + repack cpython 3.11.15 Windows x86_64
          command: |
            $ErrorActionPreference = 'Stop'
            $PYTHON_VER = '3.11.15'
            $BUILD_TAG = '20260623'
            $FNAME = "cpython-${PYTHON_VER}+${BUILD_TAG}-x86_64-pc-windows-msvc-install_only.tar.gz"
            $URL = "https://github.com/astral-sh/python-build-standalone/releases/download/${BUILD_TAG}/${FNAME}"
            $tarPath = "$env:TEMP\cpython.tar.gz"
            $extractDir = "$env:TEMP\cpython-extract"
            Invoke-WebRequest -Uri $URL -OutFile $tarPath
            if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
            New-Item -ItemType Directory -Path $extractDir | Out-Null
            tar -xzf $tarPath -C $extractDir
            if ($LASTEXITCODE -ne 0) { throw "tar extract failed" }
            $expectedName = "cpython-${PYTHON_VER}-windows-x86_64-none"
            Rename-Item -Path "$extractDir\python" -NewName $expectedName
            $outZip = "$PWD\edge\companion-app\src-tauri\resources\windows\cpython-${PYTHON_VER}-embed.zip"
            if (Test-Path $outZip) { Remove-Item -Force $outZip }
            Compress-Archive -Path "$extractDir\$expectedName" -DestinationPath $outZip -Force

      - run:
          name: Pack hermes-agent bundle (dereference symlink)
          command: |
            $ErrorActionPreference = 'Stop'
            $outTar = "$PWD\edge\companion-app\src-tauri\resources\windows\hermes-agent-bundle.tar.gz"
            Push-Location $env:TEMP
            try {
              tar czhf $outTar `
                --exclude=hermes-agent-src/.git `
                --exclude=hermes-agent-src/venv `
                --exclude=hermes-agent-src/venv.bak `
                --exclude=hermes-agent-src/.venv `
                --exclude=hermes-agent-src/target `
                hermes-agent-src
              if ($LASTEXITCODE -ne 0) { throw "tar pack failed" }
            } finally { Pop-Location }

      # ─── W2.26 (7/15 BL-CATFISH-MAC-OFFLINE-INSTALL): tauri.conf.json bundle.resources
      #      加了 4 个 resources/mac/* path (mac dmg 用), Tauri v2 build 时**跨平台**
      #      validate 每个 resource path 存在. Windows CI 只跑 build-windows-resources.sh
      #      生成 windows/*, mac/* 不存在 → tauri build 挂 (CircleCI #13/#14/#15 全红).
      #      Fix: 建 4 空 placeholder, Windows msi 会带上 (总 < 1KB 无害), macOS 端不用.
      - run:
          name: Create mac resources placeholders (W2.26 fix CircleCI #13/#14/#15 挂)
          command: |
            $ErrorActionPreference = 'Stop'
            $macDir = "edge\companion-app\src-tauri\resources\mac"
            New-Item -ItemType Directory -Force -Path $macDir | Out-Null
            foreach ($f in @('install.sh', 'uv', 'cpython-3.11.15-embed.tar.gz', 'hermes-agent-bundle.tar.gz')) {
              $p = "$macDir\$f"
              if (-not (Test-Path $p)) {
                Set-Content -Path $p -Value ''
                Write-Host "  create $p (0 byte placeholder)"
              } else {
                Write-Host "  skip $p (already exists)"
              }
            }
            Write-Host "OK 4 mac placeholders ready (Windows msi 用不到, 只为满足 tauri validate)"

      # ─── frontend build ───

      - run:
          name: npm install
          command: |
            Push-Location edge\companion-app
            try {
              npm ci --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
            } finally { Pop-Location }

      # ─── W2.18 Pre-download WiX + wrap light.exe (ICE38/ICE64 suppression) ───

      - run:
          name: Pre-download WiX + wrap light.exe
          command: |
            $ErrorActionPreference = 'Stop'
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
            $wixDir = "$env:LOCALAPPDATA\tauri\WixTools314"
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            $wixZip = "$env:TEMP\wix314-binaries.zip"
            Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $wixZip
            Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
            if (-not (Test-Path "$wixDir\light.exe")) { throw "light.exe 缺失" }
            Move-Item "$wixDir\light.exe" "$wixDir\light-real.exe" -Force
            $wrapSrc = "$PWD\edge\companion-app\scripts\light_wrapper.rs"
            if (-not (Test-Path $wrapSrc)) { throw "wrapper source missing" }
            rustc $wrapSrc -o "$wixDir\light.exe" --edition 2021 -C opt-level=0
            if ($LASTEXITCODE -ne 0) { throw "rustc failed" }
            Write-Host "wrapped light.exe OK"

      # ─── Tauri build msi ───

      - run:
          name: Tauri build msi (W2.24 全内联 toolchain 装+切+验)
          no_output_timeout: 45m
          command: |
            $ErrorActionPreference = 'Stop'
            Write-Host "############################################"
            Write-Host "### W2.24 INLINE TOOLCHAIN SETUP ###"
            Write-Host "### 若看不到这段, CircleCI 用了旧 config ###"
            Write-Host "############################################"

            # W2.24: 把 rustup toolchain 装+切+验证全塞进 Tauri build 同一 shell.
            # 不依赖 Install Rust step 是否真跑成功, 或跨 step state 是否持久化.
            # rustup toolchain install 已装是 no-op 极快, 幂等 safe.
            $cargoBin = "$env:USERPROFILE\.cargo\bin"
            $env:PATH = "$cargoBin;$env:PATH"

            # 1. 装 rustup 若缺
            if (-not (Test-Path "$cargoBin\rustup.exe")) {
              Write-Host "===== 装 rustup fresh ====="
              $init = "$env:TEMP\rustup-init.exe"
              Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile $init
              & $init --default-toolchain none -y --profile minimal
              if ($LASTEXITCODE -ne 0) { throw "rustup-init failed" }
            }

            # 2. 装 MSVC toolchain (幂等, 已装秒过)
            Write-Host "===== rustup toolchain install stable-x86_64-pc-windows-msvc ====="
            & "$cargoBin\rustup.exe" toolchain install stable-x86_64-pc-windows-msvc --profile minimal --force
            if ($LASTEXITCODE -ne 0) { throw "toolchain install failed: $LASTEXITCODE" }

            # 3. 切 default (幂等)
            Write-Host "===== rustup default stable-x86_64-pc-windows-msvc ====="
            & "$cargoBin\rustup.exe" default stable-x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "default failed: $LASTEXITCODE" }

            # 4. 加 target (幂等, MSVC host toolchain 已 self-included)
            & "$cargoBin\rustup.exe" target add x86_64-pc-windows-msvc

            # 5. Verify (全面打印)
            Write-Host "===== VERIFY ====="
            Write-Host "RUSTUP_TOOLCHAIN env: '$env:RUSTUP_TOOLCHAIN'"
            Get-Command cargo | Format-List Name, Source, Version
            Get-Command rustc | Format-List Name, Source, Version
            & "$cargoBin\rustup.exe" show
            & "$cargoBin\rustc.exe" --version --verbose
            & "$cargoBin\rustc.exe" --print sysroot
            & "$cargoBin\rustup.exe" target list --installed
            Write-Host "===== target sysroot 检查 (msvc core 是否存在) ====="
            $sysroot = & "$cargoBin\rustc.exe" --print sysroot
            $msvcCoreDir = Join-Path $sysroot "lib\rustlib\x86_64-pc-windows-msvc\lib"
            Write-Host "expected core.rlib dir: $msvcCoreDir"
            if (Test-Path $msvcCoreDir) {
              Write-Host "OK dir exists"
              Get-ChildItem $msvcCoreDir -Filter 'libcore*' | Format-Table Name
            } else {
              Write-Host "!!! MSVC target sysroot dir 不存在: $msvcCoreDir"
              Write-Host "!!! 说明 target add 没真装 std"
            }

            # 6. 强制 env: cargo / rustc 全指向 rustup shim
            $env:CARGO = "$cargoBin\cargo.exe"
            $env:RUSTC = "$cargoBin\rustc.exe"

            # 7. Now build
            Write-Host "===== Tauri build msi ====="
            Push-Location edge\companion-app
            try {
              npx tauri build --target x86_64-pc-windows-msvc --bundles msi --verbose
              if ($LASTEXITCODE -ne 0) {
                # W2.25: build 失败时 print 诊断 (放 error 附近, 用户 copy error 时自动带上)
                Write-Host ""
                Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                Write-Host "!!! TAURI BUILD FAILED - POST DIAGNOSTIC !!!"
                Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                Write-Host "RUSTUP_TOOLCHAIN env: '$env:RUSTUP_TOOLCHAIN'"
                Write-Host "CARGO env: '$env:CARGO'"
                Write-Host "RUSTC env: '$env:RUSTC'"
                Write-Host "PATH first 3:"
                $env:PATH -split ';' | Select-Object -First 3
                Write-Host ""
                Write-Host "=== rustup show ==="
                & "$env:USERPROFILE\.cargo\bin\rustup.exe" show 2>&1
                Write-Host ""
                Write-Host "=== rustc --version -v ==="
                & "$env:USERPROFILE\.cargo\bin\rustc.exe" --version --verbose 2>&1
                Write-Host ""
                Write-Host "=== rustc --print sysroot ==="
                $sr = & "$env:USERPROFILE\.cargo\bin\rustc.exe" --print sysroot 2>&1
                Write-Host $sr
                Write-Host ""
                Write-Host "=== target list --installed ==="
                & "$env:USERPROFILE\.cargo\bin\rustup.exe" target list --installed 2>&1
                Write-Host ""
                Write-Host "=== ls sysroot/lib/rustlib/ ==="
                $rustlibDir = Join-Path $sr "lib\rustlib"
                if (Test-Path $rustlibDir) {
                  Get-ChildItem $rustlibDir | Format-Table Name
                } else {
                  Write-Host "!!! $rustlibDir 不存在"
                }
                Write-Host ""
                Write-Host "=== ls sysroot/lib/rustlib/x86_64-pc-windows-msvc/lib/ ==="
                $msvcLibDir = Join-Path $sr "lib\rustlib\x86_64-pc-windows-msvc\lib"
                if (Test-Path $msvcLibDir) {
                  Get-ChildItem $msvcLibDir -Filter 'libcore*' | Format-Table Name, Length
                } else {
                  Write-Host "!!! $msvcLibDir 不存在 -- MSVC target std 没装!"
                }
                Write-Host ""
                Write-Host "=== which cargo/rustc (Tauri 内部实际用的) ==="
                & "$env:USERPROFILE\.cargo\bin\rustup.exe" which cargo 2>&1
                & "$env:USERPROFILE\.cargo\bin\rustup.exe" which rustc 2>&1
                Write-Host ""
                throw "tauri build failed with $LASTEXITCODE"
              }
            } finally { Pop-Location }

      - run:
          name: Dump wix on failure
          when: on_fail
          command: |
            $wixDir = "edge\companion-app\src-tauri\target\x86_64-pc-windows-msvc\release\wix"
            if (Test-Path $wixDir) {
              Get-ChildItem $wixDir -Recurse | Format-Table FullName, Length
              $mainExpanded = "$wixDir\x64\main.wxs"
              if (Test-Path $mainExpanded) {
                Write-Host "===== main.wxs expanded ====="
                Get-Content $mainExpanded
              }
            }

      - run:
          name: List msi output
          command: |
            $bundleDir = "edge\companion-app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi"
            if (Test-Path $bundleDir) {
              Get-ChildItem $bundleDir | Format-Table Name, Length
            }

      # ─── save cache + upload artifact ───

      - save_cache:
          key: rust-cargo-v1-{{ checksum "edge/companion-app/src-tauri/Cargo.lock" }}
          paths:
            - C:\Users\circleci\.cargo\registry
            - C:\Users\circleci\.cargo\git

      - save_cache:
          key: npm-v1-{{ checksum "edge/companion-app/package-lock.json" }}
          paths:
            - edge\companion-app\node_modules

      - store_artifacts:
          path: edge\companion-app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi
          destination: msi

