[project]
name = "catfish-secret-broker"
version = "0.1.0"
description = "Catfish Secret Broker — token / 凭据集中存储, 给 mcp-registry / a2a 等服务用"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # mac/Win keychain dev backend (docker 起不来 — prod 走下面 pg backend)
    "keyring>=24",
    # 6/9 BL-BROKER-DEPLOY: prod PG 加密后端 (AES-256-GCM, 跨 worker 共享)
    "psycopg[binary]>=3.1",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
