[project]
name = "catfish-mcp-registry"
version = "0.1.0"
description = "Catfish MCP Connector Registry — 企业 MCP 服务器注册表 / 订阅 / OAuth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.9.0",
    "python-dotenv>=1.0.0",
    # Phase 2 (5/9 改): PG 主存储, 跟 catfish-gateway / identity 统一. sqlite
    # fallback (stdlib) 给 dev / 单测 / 单机部署.
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anyio>=4.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
