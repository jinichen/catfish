[project]
name = "catfish-gateway"
version = "0.1.0"
description = "Catfish LLM Gateway — company LLM routing with SSO auth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

dependencies = [
    "fastapi>=0.115.0",
    # facts_router.py 用 File() + Form() 接 fact-patch 上传 (BL-Q3-FACT P0).
    # fastapi 不显式带这依赖, startup 报 WARNING "Form data requires python-multipart",
    # 实际 POST /api/facts/upload 路径会 500. 6/9 BL-F10 1000 user bench 撞.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    # P3.5.62 (6/22 鸿波 catch CVE-2026-49468): bump >=1.84.0 修 LiteLLM Proxy
    # Host header injection 鉴权绕过. catfish 用 SDK 模式不跑 litellm.proxy, 漏洞
    # 代码路径 (litellm/proxy/auth/auth_utils.py::get_request_route) 实际跑不到,
    # 但纵深防御 + 清 SBOM 警告 + 防 future 误引 litellm.proxy 仍升级. 加 <2.0
    # upper bound 防 2.x breaking 时 CI 静默炸. docs/SECURITY-CVE-LOG.md 有详评.
    "litellm>=1.84.0,<2.0.0",
    # P3.6.X (7/18 鸿波 catch Task #68): litellm.responses.mcp.chat_completions_handler
    # lazy import orjson (litellm 未显式 declare · 缺就 502 APIConnectionError).
    # 强制显式 pull · 达华 POC image force-recreate 后 chat 走 mcp code path 也稳.
    "orjson>=3.10",
    "pyyaml>=6.0.2",
    # P3.5.93 (6/23 鸿波): quota.yaml 编辑 UI 写回需保留 yaml comments.
    # pyyaml.safe_dump 会吹掉所有 comments (BL-FIX38 / BL-CHENHONGBO-DEV-QUOTA 等
    # 历史注释 6 周来每改一次部门 quota 就消失一些). ruamel.yaml round_trip
    # 模式保 comments. 仅 quota.py 用, 其他配置仍走 pyyaml (不必要改动).
    "ruamel.yaml>=0.18.6",
    "pydantic>=2.9.0",
    "PyJWT[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # 五一 sprint 5/2 BL-L28: ALLOW.md 关键词匹配的中文分词
    "jieba>=0.42.0",
    # 五一 sprint 5/2 收尾: gateway 自己的 PG 池 (跟 identity-server 共享 PG 实例)
    "asyncpg>=0.29.0",
    # quota / audit 走 sync sqlite OR sync PG. 用 psycopg3 替代 psycopg2 (现代 + 性能好).
    "psycopg[binary]>=3.1",
    # alembic migration (替代 idempotent CREATE TABLE)
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    # 5/6 文件上传 parse_file.py 依赖 (Companion src-tauri/scripts 调用 gateway venv 跑).
    # PDF / Excel / Word 三件套, weekly-report skill 也用.
    "pypdfium2>=4.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "PL",   # pylint (含复杂度检查)
    "C90",  # mccabe 环复杂度
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "PLR0913",  # 允许参数多的函数（FastAPI 路由很常见）
    "PLR2004",  # 允许 magic numbers（HTTP 状态码等）
    "B008",     # FastAPI 惯用法：Depends() 在参数默认值里；B008 是通用规则不适合 FastAPI
]

[tool.ruff.lint.pylint]
max-statements = 50          # 单函数最多 50 条语句
max-branches = 12            # 嵌套分支 ≤ 12
max-returns = 6              # return 次数 ≤ 6
max-args = 8                 # 位置参数 ≤ 8

[tool.ruff.lint.mccabe]
max-complexity = 10          # 环复杂度 ≤ 10

[tool.ruff.lint.per-file-ignores]
# 测试文件宽松点
"tests/**/*.py" = ["PLR0913", "PLR2004", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
