  # ---------- 公共 · Gemini 2.5 Flash（快速/便宜） ----------
  # 5/23 鸿波: 历史漂移修. 5/19 weekly batch 把 model 从 2.5-flash 升 3.1-pro-preview
  # 又改 3.1-flash-lite-preview, 实测 lite-preview function calling 几乎不工作.
  # 5/22 23:57 改回 gemini-3.5-flash. 这次同步 display_name + comment 不再漂移.
  - name: catfish-public-gemini-flash
    tier: public
    display_name: "Gemini 3.5 Flash · 快速响应（公共付费）"
    mode: chat

    upstream:
      # 5/23 鸿波: gemini-3.5-flash 真存在 (Google 2026-05 后发的, 我训练 cutoff 没赶上).
      # 实测 function calling 真能调 tool (跟 lite-preview 完全不同). 用 3.5-flash.
      model: gemini/gemini-3.5-flash
      api_key_env: GEMINI_API_KEY
      # 跟其它 gemini 系列统一 temperature=1.0; 想 function calling 更稳可改 0.7 实测.
      param_overrides:
        temperature: 1.0
      timeout: 60

    context_window: 1000000
    # BL-MAX-OUTPUT-TOKENS (5/15): Gemini Flash context 1M, output 65536 (跟 Pro 同代).
    max_output_tokens: 65536
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    # Gemini Flash 是免费层, 配额最容易耗尽, 必须有 fallback
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
    # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # 8/8: 链尾的 catfish-private-main 已从本部署删除, 摘掉。
      # 不擅自补新的一跳 —— 补哪个是产品决策, 不是修 bug。
      chain: [catfish-public-qwen-flash]
      max_hops: 2
    recommended_for: [fast, cheap, general, bulk]
    cost_tier: paid
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.00067   # 元 / 1000 token
    color: "#ef4444"
    dot_emoji: "🔴"

