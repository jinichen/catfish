# ============================================================
# 鲶鱼网关 · 模型清单
# ============================================================
# tier:           private | public
# mode:           chat | embedding
# upstream.model: LiteLLM 完整名（必须带 provider 前缀）
#                 e.g. openai/xxx  gemini/gemini-2.5-pro  bedrock/xxx
#
# fallback（P1 实现，字段先预留）：
#   fallback:
#     on_errors: [502, 503, 504, 429, timeout]  # 触发切换的错误码
#     chain: [备用模型 A, 备用模型 B]          # 按顺序尝试
#     max_hops: 2                              # 最多切几次
#
# env-var 插值:
#   字符串值里写 ${VAR} 或 ${VAR:-default}, 加载时从 os.environ 替换。
#   敏感信息 (内网 hostname / UUID / base URL) 不直接写进 yaml,
#   而是通过 .env 注入。详见 .env.example。
# ============================================================

version: 1

models:

  # ---------- 内部 · 主力通用 ----------
  - name: catfish-private-main
    tier: private
    display_name: "qwen_v3_5_122b_a10b· 主力"
    mode: chat
    default: true

    upstream:
      model: openai/qwen_v3_5_122b_a10b
      # api_base 完整 URL 走 env 注入,避免 hostname/UUID 进版本库
      api_base: ${INTERNAL_LLM_BASE_QWEN_MAIN}
      api_key_env: INTERNAL_LLM_KEY
      # BL-FIX24-config (5/9): 180 → 300. 鸿波 5/9 demo 流水显示 14:28→14:31
      # 撞 180s timeout 触发 fallback 切公网 deepseek (公网保密性破坏 +
      # ttft 187s 比 private 慢). 真根因 — Qwen3.5 122B MoE active 10B
      # 在 79 messages + 5 万字 journal 长 context 推理 ≥ 180s 是真的需要,
      # 不是上游挂. 调 300s 给 5 分钟裕量, 让 private-main 在保密链路完成
      # 推理, 不动不动就 fallback 到公网.
      # 踩过坑历史:
      #   2026-04-28 demo: 反复 ReadTimeout (60s→180s 修)
      #   2026-05-09 demo: 长 context docx 撞 180s 切 DS (180s→300s 修)
      timeout: 300

    # 上游管理员确认实际支持 250K tokens。
    # 我们对员工承诺 128K（官方主流 Qwen 3.5 心智 + 一倍以上安全余量）。
    # 长上下文（>128K）场景推荐员工切 catfish-public-gemini-pro（2M）。
    context_window: 128000
    supports_tool_use: true
    supports_streaming: true
    # Qwen3.5 122B MoE 实测**支持视觉** (5/8 鸿波真上传 EIS 截图验证, 识别准确).
    # 不要再误改成 false — 我之前 5/8 凌晨踩过坑.
    supports_vision: true
    # 5/4 BL-F14 内部用例 tag (pick_internal_model 按 tag + private 优先选).
    # 内网首选 = 数据不出公司. 内网挂了才用 public 兜底:
    #   summarizer        — 跨 session 总结 journal
    #   proactive_starter — BL-E13 主动闲聊起话题
    #   a2a_aux           — A2A federation 辅助任务
    recommended_for: [general, chat, tool_use, code,
                      summarizer, proactive_starter, a2a_aux]
    cost_tier: free

    # 内网 LLM 平台偶发 502 / endpoint 维护 / UUID 重启失效时,
    # 主力模型不能直接挂死员工 — 落到公共模型保业务。
    # 顺序: 内网公共备份 (qwen-flash) → 外网 (gemini-flash) → 不再降级。
    # 注: 公共模型在 .env 里没配 key 时会自动跳过, 不会傻等。
    fallback:
      on_errors: [429, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50 鸿波 'NVIDIA 还是不行'):
      # 实盘 NVIDIA NIM 公网 Qwen 122B 连 2 次 latency 39s/19s 但 tokens=0 — free tier
      # 排队等推理资源, 把整个 fallback 链拖死 20-40s. 从 chain 摘掉, 不当兜底.
      # catalog 里 model 定义仍保留 (客户基建调研故事 / 手选还能用), 只是不自动落到它.
      chain: [catfish-public-qwen-flash, catfish-public-deepseek-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 内部 · 多模态 ----------
  - name: catfish-private-vision
    tier: private
    display_name: "Qwen3-VL 30B (A3B MoE) · 多模态"
    mode: chat

    upstream:
      model: openai/qwen_v3_vl_moe_30b_a3b
      api_base: ${INTERNAL_LLM_BASE_QWEN_VISION}
      api_key_env: INTERNAL_LLM_KEY
      # 多模态模型图像/视频处理偏慢, MoE active 3B 也比稳定模型 TTFT 长.
      # 给 180s 跟 main 对齐, 跟公共多模态 (timeout: 90) 区分 (公共更快).
      timeout: 180

    # 多模态模型相比主力模型 context 略窄些，留 64K 员工承诺。
    # 真实支持大概率也是 128K+ 量级，视后续压测调整。
    context_window: 64000
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    recommended_for: [vision, ocr, image_analysis]
    cost_tier: free

    # 内网 vision endpoint 不可达时 (10.10.40.x VPN 抖动 / 平台维护) 直接落到
    # 公共多模态. qwen-flash 256K 也支持视觉, gemini-flash 是兜底。
    # 视觉模型必须有 chain — 没有的话员工传图就直接挂, 没有体面降级。
    fallback:
      on_errors: [429, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      chain: [catfish-private-main, catfish-public-qwen-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 内部 · Embedding ----------
  # ⚠️ TODO: 替换为 bge-m3 在平台上的实际部署 UUID
  - name: catfish-private-embed
    tier: private
    display_name: "BGE-M3 · Embedding"
    mode: embedding

    upstream:
      model: openai/bge-m3
      api_base: ${INTERNAL_LLM_BASE_BGE_M3}
      api_key_env: INTERNAL_LLM_KEY

    cost_tier: free

  # ---------- 公共 · 阿里云百炼 Qwen3.6-Flash ----------
  # DashScope OpenAI 兼容端点。没配 DASHSCOPE_API_KEY 时不出现在 catalog。
  # 模型详情: https://bailian.console.aliyun.com/model-market/detail/qwen3.6-flash
  #   - 256K 上下文
  #   - 多模态: 文本 + 图像 + 视频 + 音频输入
  #   - function calling
  #   - 重点提升 agentic coding 能力
  #   - 价格: 输入 ¥1.2/M tok, 输出 ¥7.2/M tok
  # 用途:
  #   - 内网 Qwen (catfish-private-main) 不可达时的公共备份
  #   - Gemini 免费配额耗尽时的 fallback
  #   - 出差 / 公司外网络场景
  - name: catfish-public-qwen-flash
    # 历史: 一度改成 catfish-public-ds4-pro, 但 fallback chain (line 53/81/157/182)
    # 都引用 catfish-public-qwen-flash, 改名导致 gateway 启动 warn
    # "fallback chain refers to unknown model: catfish-public-qwen-flash" — 整个
    # fallback 系统失效. 2026-04-28 修回, 不要再改 name (除非同步改 4 条 chain).
    tier: public
    display_name: "Qwen3.6-Flash · 通义千问快速多模态（公共付费）"
    mode: chat

    upstream:
      # ⚠️ TODO 鸿波验证: 这个 model 名 'qwen3.6-max-preview' 在 dashscope
      # 真实存在吗? 实际 dashscope 多模态 Qwen 系列常见命名:
      #   qwen-vl-max-latest / qwen-vl-plus-latest (Qwen-VL 视觉系列)
      #   qwen-max-latest / qwen-plus-latest / qwen-turbo-latest (Qwen 文本)
      # 如果 'qwen3.6-max-preview' 不存在, fallback 真触发时会撞 404.
      # 验证方法: 拿 DASHSCOPE_API_KEY 用 curl 测一下:
      #   curl https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions \
      #     -H "Authorization: Bearer $DASHSCOPE_API_KEY" \
      #     -d '{"model":"qwen3.6-max-preview","messages":[{"role":"user","content":"hi"}]}'
      model: openai/qwen3.6-35b-a3b
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      timeout: 90  # 多模态请求图像/视频处理偏慢, 给宽裕

    context_window: 262144  # 256K
    # max_output_tokens: 待查实 — 22:50 鸿波撞 fallback 全失效 audit 发现我刚加的
    # 32768 是凭印象编的没查 DashScope 文档. revert 留 null, 走 cw 老行为.
    # TODO: 等真撞 DashScope 400 拿到 error 里 valid range 再补回真值.
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    # BL-F14: 公网 qwen-flash 是内部用例的 public fallback (内网挂了才用)
    recommended_for: [general, chat, tool_use, vision, code, fast, fallback,
                      summarizer, proactive_starter, a2a_aux]
    cost_tier: paid

    # 5/4 BL-F14 加: qwen-flash 自己也得有 chain.
    # 之前没配, picker 选 qwen-flash 时撞错就死. 现在: qwen 挂 → deepseek → gemini.
    # 内部用例 (summarizer/proactive) 走 picker 时, 内网不可达就选这条, 必须再有兜底.
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 鸿波撞 deepseek 500 没自动切, 排查
    # 发现 trigger 历史漏 500. 公网到公网切没保密问题, 内网链不加 500 (防泄密).
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
      chain: [catfish-public-deepseek-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 公共 · DEEPSEEK V4 ----------
  # DEEKSEEK OpenAI 兼容端点。没配 DEEPSEEK_API_KEY 时不出现在 catalog。
  # 模型详情: 
  #   - 256K 上下文
  #   - function calling
  #   - 重点提升 agentic coding 能力
  #   - 价格: 输入 ¥1/M tok, 输出 ¥2/M tok
  # 用途:
  #   - 内网 Qwen (catfish-private-main) 不可达时的公共备份
  #   - Gemini 免费配额耗尽时的 fallback
  #   - 出差 / 公司外网络场景
  - name: catfish-public-deepseek-flash
    tier: public
    display_name: "Deepseek-v4-flash · Deepseek V4 flash（公共付费）"
    mode: chat

    upstream:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      timeout: 90
      # 5/5 BL-D11+ 鸿波报: deepseek thinking mode 多轮对话 (含 tool call) 时
      # 要求 client 把上轮 assistant 的 reasoning_content 也传回去,
      # catfish gateway 没透传 → 第二轮 400 BadRequest
      # "reasoning_content must be passed back". 见 5/5 20:01 log.
      # 真修法 = gateway streaming 时保留 + messages 透传 reasoning_content,
      # 工作量 ~半天 (跟 BL-MM3 一起 5/15+ hermes 升级窗口做).
      # 短期: 关 thinking, deepseek 当普通 chat. 没 reasoning_content 字段就不
      # 触发兼容 bug. 影响: 失去 deepseek 推理能力, 但是它是 fallback (主力 qwen-private),
      # 实际损失不大.
      param_overrides:
        extra_body:
          thinking:
            type: disabled

    context_window: 1000000  # 1M
    # BL-MAX-OUTPUT-TOKENS (5/15 22:31 鸿波撞 400 'Invalid max_tokens [1, 393216]'):
    # DeepSeek V4 context 1M, 但单次 output 上限 393216. dyn 算法默认拿 cw 当上限,
    # 实盘 cw - prompt - safety 算出 ~990K, 远超 393K, 撞 400. 这是 model 真实属性,
    # 不是 gateway bug — 直接配字段, dyn 自动 clip 到 min(cw, max_output_tokens).
    max_output_tokens: 393216
    supports_tool_use: true
    supports_streaming: true
    supports_vision: false
    # BL-F14: deepseek 也作为 public 内部用例 fallback (qwen 挂了用这)
    recommended_for: [general, chat, tool_use, code, fast, fallback,
                      summarizer, proactive_starter, a2a_aux]
    cost_tier: paid

    # 5/4 BL-F14 加: deepseek 自己也得有 chain.
    # picker 用 env override 强制选 deepseek 时, 撞错有兜底 (qwen-flash → gemini-flash).
    fallback:
      # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
      # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      chain: [catfish-public-qwen-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 公共 · Gemini 3.1 Pro（长上下文） ----------
  # 200 万 token 上下文，适合长文档分析、跨会话回溯、复杂推理
  # 如果 GEMINI_API_KEY 未设置，此模型不会出现在员工 catalog 中
  - name: catfish-public-gemini-pro
    tier: public
    display_name: "Gemini 3.1 Pro Preview · 长上下文（公共付费）"
    mode: chat

    upstream:
      model: gemini/gemini-2.5-pro
      api_key_env: GEMINI_API_KEY
      # Gemini 3 系列在 temperature < 1.0 时可能陷入循环或推理质量下降
      # 官方建议固定 1.0，不管客户端传什么
      param_overrides:
        temperature: 1.0
      # Preview 模型冷启动偏慢，给足时间
      timeout: 180

    context_window: 2000000
    # BL-MAX-OUTPUT-TOKENS (5/15): Gemini 2.5 Pro context 2M, 但单次 output 上限 65536.
    # 不配的话 dyn 会算出 ~2M, 撞 Gemini 400 "max_output_tokens too large".
    # 参考: https://ai.google.dev/gemini-api/docs/models#gemini-2.5-pro
    max_output_tokens: 65536
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    recommended_for: [long_context, complex_reasoning, vision, research]
    cost_tier: paid

    # 撞 429 / 503 / timeout 时自动落回 Qwen3.6-Flash
    # (Qwen 没配 key 时自动跳过, 直接返回错误给客户端)
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
    # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      chain: [catfish-public-qwen-flash, catfish-private-main]
      max_hops: 2

  # ---------- 公共 · 智谱 GLM 5.1 (NVIDIA NIM 托管, 国产模型) ----------
  # NVIDIA NIM OpenAI 兼容端点 (build.nvidia.com)
  # 没配 NVIDIA_API_KEY 时不出现在 catalog
  # 模型详情:
  #   - 智谱 GLM-5.1, NVIDIA NIM 平台托管
  #   - 128K context
  #   - 中文 instruction-following 比 Llama 强一档
  #   - function calling 支持
  #   - 不支持 vision (GLM-5.1 纯文本)
  # 5/15 鸿波拍板用 GLM 替代原计划的 Llama 3.3 70B —
  #   理由: 国产模型, 国央企接受度高于 Llama; 中文场景体验更稳;
  #         即便走公网, 客户合规审查也比美国系模型友好.
  # 用途 (5/15 鸿波 'deepseek 抽风 + qwen flash 配额用完 + gemini pro 偶发抖动'):
  #   - 当 DashScope qwen-flash 配额用完 / DeepSeek streaming 异常时的第 4 兜底
  #   - 跟 catfish-private-main 一档的 instruction-following 能力
  #   - 客户基建调研: NVIDIA NIM + 国产模型组合是国央企可接受路径
  #
  # 注: catalog 内部 name 保留 'nvidia-llama' 不改 — 避免动 5 处 fallback chain
  # 引用导致 startup warn. display_name 用真实模型名 (GLM-5.1).
  # 长期: 如果要新加真 Llama, 用 catfish-public-nvidia-llama-real 或类似新 name.
  - name: catfish-public-nvidia-llama
    tier: public
    display_name: "Qwen3.5 122B (NVIDIA NIM, 国产) · 内网同款备胎（公共付费）"
    mode: chat

    upstream:
      # 5/15 22:10-22:25 鸿波实测演进:
      #   v1 glm-5.1                            → 63K prompt TTFT 145s, 太慢
      #   v2 meta/llama-3.3-70b-instruct        → "太老的模型不能用"
      #   v3 qwen3-235b-a22b-instruct-2507      → 404 不存在 (我编的 ID)
      #   v4 qwen3.5-397b-a17b                  → "一点反应都没有",
      #     NVIDIA 免费 tier 可能排队等很久 / 资源不够
      #   v5 (现在) qwen/qwen3.5-122b-a10b
      #     ✓ **跟客户内网 catfish-private-main 完全同一个模型**
      #     ✓ 备胎语义最干净: "内网挂了, 公网同型号接管"
      #     ✓ 客户用户感知不到差别 (同 instruction-following, 同输出风格)
      #     ✓ 国产模型, 国央企接受度高
      #     ✓ NVIDIA NIM 上 122B 比 397B 资源充足, 不容易排队
      #
      # 设计思路: 备胎 = 同型号公网托管, 不是"更强的兜底". 体验一致最重要,
      # demo 故事: "客户内网挂了, 公网 NVIDIA NIM 上有同款 Qwen3.5 122B 接管,
      # 业务不中断". 比"切 Llama / 切 Gemini" 卖点强 — 客户 IT 听得懂同型号备胎.
      #
      # catalog 内部 name 仍叫 'nvidia-llama' — 保留, 防 5 处 fallback chain 引用要全改.
      model: nvidia_nim/minimaxai/minimax-m2.7
      api_base: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      # 122B 比 397B 快很多, 给 90s 够用 (跟客户内网 timeout=300s 区别: 公网较快)
      timeout: 90

    context_window: 128000
    # max_output_tokens: 待查实 — 22:50 同样, 我编的 16384 没核实文档. revert.
    # NVIDIA NIM 各 model output cap 不公开统一, 等撞 400 看 error message.
    supports_tool_use: true
    supports_streaming: true
    supports_vision: false
    # BL-NVIDIA-NIM-MANUAL-ONLY (5/15 22:55 鸿波): 'fallback' 标签也去掉 — NVIDIA 不
     # 当任何用例的兜底, 也不被 picker / fallback 选, 只能员工/客户在 companion 模型
     # 选择器手选. 推理 / 长指令场景从这清单挪走, 实际由内网 main + gemini-pro 兜.
    recommended_for: [client_demo_optional]
    cost_tier: paid

    # BL-NVIDIA-NIM-MANUAL-ONLY (5/15 22:55 鸿波 'NVIDIA 都不要 fallback, 只手选'):
    # 删 fallback 块 — NVIDIA 跪了直接报客户端, 不绕弯到其他公网. 语义:
    #   - 这是"客户基建调研路径", 跪了让员工自己换 model, 不要 gateway 暗中切走
    #   - 当 demo 时 NVIDIA 真的不出字, 客户看见的应该是"NVIDIA 失败", 不是
    #     "gateway 静默切到 DashScope 看起来一切正常" — 那等于骗自己
    # 历史 fallback chain (qwen-flash → deepseek → gemini) 完全删掉, 不再绕.

  # ---------- 公共 · NVIDIA Nemotron Super 49B（推理 + 长指令跟随） ----------
  # NVIDIA 在 Llama 3.3 基础上自己微调的 reasoning 模型
  # 用途: 复合任务 plan-execute / 长指令跟随 (花叔 60KB SKILL.md 这种)
  - name: catfish-public-nvidia-nemotron
    tier: public
    display_name: "Nemotron Super 49B v1.5 (NVIDIA NIM) · 推理增强（公共付费）"
    mode: chat

    upstream:
      # 5/15 22:14: 升 v1 → v1.5 (NVIDIA list 里两个都有), NVIDIA 在 Llama 3.3
      # 上加推理的更新版. Nemotron 系列负责"推理强"场景, Qwen3.5 397B 负责
      # "国产 + 通用主力" 场景.
      model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
      api_base: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      # reasoning 模型偏慢, 给宽裕 timeout
      timeout: 180

    context_window: 128000
    # max_output_tokens: 待查实 — 同 nvidia-llama 段同因. revert.
    supports_tool_use: true
    supports_streaming: true
    supports_vision: false
    # BL-NVIDIA-NIM-MANUAL-ONLY (5/15 22:55 鸿波): 'fallback' 标签去掉, 只手选.
    recommended_for: [client_demo_optional]
    cost_tier: paid

    # BL-NVIDIA-NIM-MANUAL-ONLY (5/15 22:55 鸿波 'NVIDIA 都不要 fallback, 只手选'):
    # 删 fallback 块 — 跪了直接报客户端. 同 nvidia-llama 同段注释.

  # ---------- 公共 · Gemini 2.5 Flash（快速/便宜） ----------
  - name: catfish-public-gemini-flash
    tier: public
    display_name: "Gemini 3.1 Flash-Lite Preview · 快速响应（公共付费）"
    mode: chat

    upstream:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key_env: GEMINI_API_KEY
      # Gemini 3 系列必须 temperature = 1.0，详见 pro 配置
      param_overrides:
        temperature: 1.0
      # Preview 模型冷启动偏慢，给足时间
      timeout: 180

    context_window: 1000000
    # BL-MAX-OUTPUT-TOKENS (5/15): Gemini Flash context 1M, output 65536 (跟 Pro 同代).
    max_output_tokens: 65536
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    # Gemini Flash 是免费层, 配额最容易耗尽, 必须有 fallback
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
    # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      chain: [catfish-public-qwen-flash, catfish-private-main]
      max_hops: 2
    recommended_for: [fast, cheap, general, bulk]
    cost_tier: paid

