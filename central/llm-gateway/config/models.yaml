# ============================================================
# 鲶鱼网关 · 模型清单
# ============================================================
# tier:           private | public
# mode:           chat | embedding
# upstream.model: LiteLLM 完整名（必须带 provider 前缀）
#                 e.g. openai/xxx  gemini/gemini-2.5-pro  bedrock/xxx
#
# fallback（P1 实现，字段先预留）：
#   fallback:
#     on_errors: [502, 503, 504, 429, timeout]  # 触发切换的错误码
#     chain: [备用模型 A, 备用模型 B]          # 按顺序尝试
#     max_hops: 2                              # 最多切几次
#
# env-var 插值:
#   字符串值里写 ${VAR} 或 ${VAR:-default}, 加载时从 os.environ 替换。
#   敏感信息 (内网 hostname / UUID / base URL) 不直接写进 yaml,
#   而是通过 .env 注入。详见 .env.example。
# ============================================================

version: 1

# ── 工具循环保护 ───────────────────────────────────────────────────
# Hermes 每轮会重新请求网关。超过任一上限时，网关返回结构化 409，不再继续
# 调模型；这里是部署策略，不绑定具体模型。按任务复杂度调整，不能写进代码。
tool_loop:
  max_tool_messages: 64
  max_tool_calls: 128

# ── 失败切换总开关 (8/8 鸿波拍板: false → true) ──────────────────────────
#
# 语义澄清: **打开它不等于"允许乱切"**。fallback.py:441-454 是四道门, 依次:
#
#   1. auto_fallback        ← 就是这一行
#   2. primary.fallback     没显式配 chain 的模型, 直接抛, 不切
#   3. on_errors            错误码不在这个模型自己勾的触发条件里, 直接抛
#   4. max_hops             最多切几次
#
# 第 2、3 道本来就实现了"显式配了才切"。第 1 道是 5/16 BL-FALLBACK-TOGGLE
# 加的**全局一刀切**, 它挡在前面, 把 2、3 两道全废了 —— 于是所有 chain 都
# 成了摆设, 配了也永不执行。
#
# 8/8 实盘代价: qwen-flash 连续两次 60s 超时直抛给客户端, 而它 chain 里
# 配着 deepseek + gemini 两个备用, 一个都没试。管理员在 /admin/models
# 上认真配的链, 平时看不出对不对, 只在出错那一刻才发现从来没生效过。
#
# 关掉它之后仍然成立的保证:
#   · 没配 chain 的模型 = 出错直接报错 (库里现在大部分模型就是这样)
#   · 内网模型的 on_errors 不含 500 → 内网 500 不会流到公网链
#     (SOUL_FFCS 保密原则, 由 tests/test_fallback_500_policy.py 结构性守护)
#   · 大 prompt 时 resolve_chain 会过滤掉公网候选 (BL-FALLBACK-PROMPT-CAP)
#
# 这是**顶层字段, 只从 yaml 读, 不进库** (见 model_store.py 文件头) ——
# 跟模型列表不同, 改这里是真生效的, 但要重启网关。
# 临时开关: env CATFISH_AUTO_FALLBACK=1 (优先级高于本行)。
auto_fallback: true

models:

  # ---------- 内部 · 多模态 ----------
  - name: catfish-private-vision
    tier: private
    display_name: "Qwen3-VL 30B (A3B MoE) · 多模态"
    mode: chat

    upstream:
      model: openai/qwen_v3_6_35b_a3b
      api_base: ${INTERNAL_LLM_BASE_QWEN_VISION}
      api_key_env: INTERNAL_LLM_KEY
      # 多模态模型图像/视频处理偏慢, MoE active 3B 也比稳定模型 TTFT 长.
      # 给 180s 跟 main 对齐, 跟公共多模态 (timeout: 90) 区分 (公共更快).
      timeout: 180

    # 多模态模型相比主力模型 context 略窄些，留 64K 员工承诺。
    # 真实支持大概率也是 128K+ 量级，视后续压测调整。
    context_window: 128000
    # ⚠ 7/22 (P3.5.79+): 同 catfish-private-main 血案 · 上游 vLLM 部署 max-model-len
    # 未 audit 前保守配 · 留 4K prompt 余量. IT 确认 max-model-len 后可调.
    max_output_tokens: 122880
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    recommended_for: [vision, ocr, image_analysis]
    cost_tier: free
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.0001   # 元 / 1000 token
    color: "#4b5563"
    dot_emoji: "⚫"

    # 内网 vision endpoint 不可达时 (10.10.40.x VPN 抖动 / 平台维护) 直接落到
    # 公共多模态. qwen-flash 256K 也支持视觉, gemini-flash 是兜底。
    # 视觉模型必须有 chain — 没有的话员工传图就直接挂, 没有体面降级。
    fallback:
      on_errors: [429, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # 8/8: 摘掉链首的 catfish-private-main —— 那个模型已从本部署删除, 留着
      # 会被 resolve_chain 静默跳过 (只 warning, 员工无感), 白占一个 max_hops。
      # 摘掉后本链全是公网, 但这是这条链**原本就有的**形态 (上面注释: qwen-flash
      # 也支持视觉, gemini-flash 兜底), 且本模型 on_errors 不含 500,
      # 内网 500 仍然不会外流。
      chain: [catfish-public-qwen-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 内部 · Embedding ----------
  # ⚠️ TODO: 替换为 bge-m3 在平台上的实际部署 UUID
  - name: catfish-private-embed
    tier: private
    display_name: "BGE-M3 · Embedding"
    mode: embedding

    upstream:
      model: openai/bge-m3
      api_base: ${INTERNAL_LLM_BASE_BGE_M3}
      api_key_env: INTERNAL_LLM_KEY

    cost_tier: free
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.00005   # 元 / 1000 token
    color: "#9ca3af"
    dot_emoji: "⚪"

  # ---------- 公共 · 阿里云百炼 Qwen3.6-Flash ----------
  # DashScope OpenAI 兼容端点。没配 DASHSCOPE_API_KEY 时不出现在 catalog。
  # 模型详情: https://bailian.console.aliyun.com/model-market/detail/qwen3.6-flash
  #   - 256K 上下文
  #   - 多模态: 文本 + 图像 + 视频 + 音频输入
  #   - function calling
  #   - 重点提升 agentic coding 能力
  #   - 价格: 输入 ¥1.2/M tok, 输出 ¥7.2/M tok
  # 用途:
  #   - 内网 Qwen (catfish-private-main) 不可达时的公共备份
  #   - Gemini 免费配额耗尽时的 fallback
  #   - 出差 / 公司外网络场景
  - name: catfish-public-qwen-flash
    # ⚠ 这个 name 被**仓库里 13 处**引用, 改名前先全仓 grep。已经栽过两次:
    #
    #   2026-04-28  一度改成 catfish-public-ds4-pro → fallback chain 全部
    #               指向不存在的模型, gateway 启动 warn
    #               "fallback chain refers to unknown model" → 当天修回。
    #
    #   2026-06-24  又被改成 catfish-public-qwen (夹在 commit 08917b8
    #               "中央门户配额web编辑 + perf筛选下拉 + dept proxy 透传补全"
    #               里, 跟那个提交的主题毫无关系, 所以没人注意)。
    #               7/30 发现并改回。
    #
    # 第二次那 5 周里实际发生了什么 (都是静默的):
    #   · 5 条 fallback chain 的首选备用模型永远解析不到, 被 resolve_chain
    #     跳过 —— 只留一行 warning 日志, 员工侧毫无感知, 请求默默落到下一跳
    #   · 前端 modelDisplay.ts 查不到它 → 审计页显示"未知模型 ⚪"
    #   · 计价表查不到它 → 按兜底价 0.001 算, 而真实单价是 0.00045,
    #     **成本被高估 2.22 倍**
    #
    # 引用它的地方 (7/30 grep):
    #   central/llm-gateway/config/models.yaml   5 条 fallback chain
    #   central/web/src/lib/modelDisplay.ts      显示名 + 单价
    #   edge/companion-app/src/lib/chat.test.ts  idle timeout
    #   edge/tool-bridge/tests/                  role 解析
    #   edge/hermes-plugins/                     summarize 模型
    #
    # tests/test_fallback_500_policy.py 现在会检查所有 chain 引用的模型是否
    # 真实存在 —— 再改名会当场红, 不用靠人记得 grep。
    tier: public
    display_name: "Qwen3.6-Flash · 通义千问快速多模态（公共付费）"
    mode: chat

    upstream:
      # ⚠️ TODO 鸿波验证: 这个 model 名 'qwen3.6-max-preview' 在 dashscope
      # 真实存在吗? 实际 dashscope 多模态 Qwen 系列常见命名:
      #   qwen-vl-max-latest / qwen-vl-plus-latest (Qwen-VL 视觉系列)
      #   qwen-max-latest / qwen-plus-latest / qwen-turbo-latest (Qwen 文本)
      # 如果 'qwen3.6-max-preview' 不存在, fallback 真触发时会撞 404.
      # 验证方法: 拿 DASHSCOPE_API_KEY 用 curl 测一下:
      #   curl https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions \
      #     -H "Authorization: Bearer $DASHSCOPE_API_KEY" \
      #     -d '{"model":"qwen3.6-max-preview","messages":[{"role":"user","content":"hi"}]}'
      model: openai/qwen3.7-max-2026-05-20
      api_base: https://llm-88ut4os6z3cmlgru.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key_env: DASHSCOPE_API_KEY
      timeout: 90  # 多模态请求图像/视频处理偏慢, 给宽裕

    context_window: 1000000  # 1000K
    # BL-MAX-OUTPUT-TOKENS (5/24 鸿波实盘补): DashScope qwen3.7-max 单次 output 上限
    # **65536** (跟 Gemini / Groq 同档). 第一次 picker 选 Qwen 时撞 400:
    #   "<400> InternalError.Algo.InvalidParameter:
    #    Range of max_tokens should be [1, 65536]"
    # cw=1M, dyn 算法默认取接近 cw 的值, 远超 DashScope 单次 output cap → 400.
    # 直接配 65536, dyn 自动 clip 到 min(cw, max_output_tokens).
    # 历史踩坑: 5/15 22:50 我凭印象编了个 32768 没查文档, 后来 revert 留 null;
    # 现在拿到 server 真实 error 给的 range, 落地 65536 是有据可查.
    max_output_tokens: 65536
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    # BL-F14: 公网 qwen-flash 是内部用例的 public fallback (内网挂了才用)
    recommended_for: [general, chat, tool_use, vision, code, fast, fallback,
                      summarizer, proactive_starter, a2a_aux]
    cost_tier: paid
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.00045   # 元 / 1000 token
    color: "#f59e0b"
    dot_emoji: "🟠"

    # 5/4 BL-F14 加: qwen-flash 自己也得有 chain.
    # 之前没配, picker 选 qwen-flash 时撞错就死. 现在: qwen 挂 → deepseek → gemini.
    # 内部用例 (summarizer/proactive) 走 picker 时, 内网不可达就选这条, 必须再有兜底.
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 鸿波撞 deepseek 500 没自动切, 排查
    # 发现 trigger 历史漏 500. 公网到公网切没保密问题, 内网链不加 500 (防泄密).
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
      chain: [catfish-public-deepseek-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 公共 · DEEPSEEK V4 ----------
  # DEEKSEEK OpenAI 兼容端点。没配 DEEPSEEK_API_KEY 时不出现在 catalog。
  # 模型详情: 
  #   - 256K 上下文
  #   - function calling
  #   - 重点提升 agentic coding 能力
  #   - 价格: 输入 ¥1/M tok, 输出 ¥2/M tok
  # 用途:
  #   - 内网 Qwen (catfish-private-main) 不可达时的公共备份
  #   - Gemini 免费配额耗尽时的 fallback
  #   - 出差 / 公司外网络场景
  - name: catfish-public-deepseek-flash
    tier: public
    display_name: "Deepseek-v4-flash · Deepseek V4 flash（公共付费）"
    mode: chat

    upstream:
      model: deepseek/deepseek-v4-flash
      # P3.5.148 (6/30 鸿波 audit 切回 /v1): /beta → /v1
      #
      #   背景: P3.4.E (6/15) 把 endpoint 从 /v1 切到 /beta, 论据是当时实测 /v1 对
      #   specific-function tool_choice 支持弱, /beta 完整支持. 但 6/29 ttft 异常
      #   实盘 (631 秒 stuck) 暴露 /beta 真 SLA 不稳.
      #
      #   6/30 鸿波实跑 curl 实测两条:
      #   1. POST /v1 + thinking 不带 (默认开) + tool_choice={type:function,function:submit}
      #      → 报错 "Thinking mode does not support this tool_choice"
      #   2. POST /v1 + thinking={type:disabled} + 同款 tool_choice
      #      → 返 choices[0].message.tool_calls 含 submit 调用, finish_reason=tool_calls,
      #        content 空 (严格 tool_choice 完整工作)
      #
      #   也就是说 /v1 不是不支持 strict tool_choice, 而是跟 thinking 互斥. catfish
      #   一直在下面 param_overrides 关 thinking, /v1 + thinking_disabled 完美工作.
      #   P3.4.E 当时实测可能漏传 thinking_disabled, 解读成 "/v1 不支持" 切了 /beta.
      #
      #   收益: /v1 是 deepseek production stable channel, SLA 优于 /beta. 6/29 那条
      #   10.5 分钟 stuck 不能保证消失 (网络抖动也会), 但概率应该降低.
      #
      #   advisor.ts Call 2 single-shot + tool_choice={type:function,function:submit_advisor_result}
      #   strict tool_calls 路径不变, /v1 完整支持.
      #
      #   风险: 5/5 BL-D11+ thinking mode reasoning_content 透传 bug 仍未根治, 但下面
      #   param_overrides 显式 thinking.type=disabled, 即使 /v1 也不触发 thinking 路径,
      #   reasoning_content bug 不复现. 跟切 /beta 同款.
      api_base: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      timeout: 90
      # 5/5 BL-D11+ 鸿波报: deepseek thinking mode 多轮对话 (含 tool call) 时
      # 要求 client 把上轮 assistant 的 reasoning_content 也传回去,
      # catfish gateway 没透传 → 第二轮 400 BadRequest
      # "reasoning_content must be passed back". 见 5/5 20:01 log.
      # 真修法 = gateway streaming 时保留 + messages 透传 reasoning_content,
      # 工作量 ~半天 (跟 BL-MM3 一起 5/15+ hermes 升级窗口做).
      # 短期: 关 thinking, deepseek 当普通 chat. 没 reasoning_content 字段就不
      # 触发兼容 bug. 影响: 失去 deepseek 推理能力, 但是它是 fallback (主力 qwen-private),
      # 实际损失不大.
      param_overrides:
        extra_body:
          thinking:
            type: disabled
      # 明确声明这是 DeepSeek 的通用兼容要求；Qwen/DashScope 的思考开关不要照抄。
      param_overrides_scope: all

    context_window: 1000000  # 1M
    # BL-MAX-OUTPUT-TOKENS (5/15 22:31 鸿波撞 400 'Invalid max_tokens [1, 393216]'):
    # DeepSeek V4 context 1M, 但单次 output 上限 393216. dyn 算法默认拿 cw 当上限,
    # 实盘 cw - prompt - safety 算出 ~990K, 远超 393K, 撞 400. 这是 model 真实属性,
    # 不是 gateway bug — 直接配字段, dyn 自动 clip 到 min(cw, max_output_tokens).
    max_output_tokens: 393216
    supports_tool_use: true
    supports_streaming: true
    supports_vision: false
    # BL-F14: deepseek 也作为 public 内部用例 fallback (qwen 挂了用这)
    recommended_for: [general, chat, tool_use, code, fast, fallback,
                      summarizer, proactive_starter, a2a_aux]
    cost_tier: paid
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.0015   # 元 / 1000 token
    color: "#7c3aed"
    dot_emoji: "🟣"

    # 5/4 BL-F14 加: deepseek 自己也得有 chain.
    # picker 用 env override 强制选 deepseek 时, 撞错有兜底 (qwen-flash → gemini-flash).
    fallback:
      # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
      # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      chain: [catfish-public-qwen-flash, catfish-public-gemini-flash]
      max_hops: 2

  # ---------- 公共 · Gemini 3.1 Pro（长上下文） ----------
  # 200 万 token 上下文，适合长文档分析、跨会话回溯、复杂推理
  # 如果 GEMINI_API_KEY 未设置，此模型不会出现在员工 catalog 中
  - name: catfish-public-gemini-pro
    tier: public
    display_name: "Gemini 3.1 Pro Preview · 长上下文（公共付费）"
    mode: chat

    upstream:
      model: gemini/gemini-3.1-pro
      api_key_env: GEMINI_API_KEY
      # Gemini 3 系列在 temperature < 1.0 时可能陷入循环或推理质量下降
      # 官方建议固定 1.0，不管客户端传什么
      param_overrides:
        temperature: 1.0
      # Preview 模型冷启动偏慢，给足时间
      timeout: 180

    context_window: 2000000
    # BL-MAX-OUTPUT-TOKENS (5/15): Gemini 2.5 Pro context 2M, 但单次 output 上限 65536.
    # 不配的话 dyn 会算出 ~2M, 撞 Gemini 400 "max_output_tokens too large".
    # 参考: https://ai.google.dev/gemini-api/docs/models#gemini-2.5-pro
    max_output_tokens: 65536
    supports_tool_use: true
    supports_streaming: true
    supports_vision: true
    recommended_for: [long_context, complex_reasoning, vision, research]
    cost_tier: paid
    # 展示与计价 (7/30 从前端 modelDisplay.ts 迁过来)。
    # 模型可在 /admin/models 界面上增删改之后, 这些必须跟着模型走 ——
    # 硬编码在前端的话, 客户新加的模型会显示"未知模型"、按兜底价计费。
    price_per_1k_tokens: 0.0218   # 元 / 1000 token
    color: "#dc2626"
    dot_emoji: "🔴"

    # 撞 429 / 503 / timeout 时自动落回 Qwen3.6-Flash
    # (Qwen 没配 key 时自动跳过, 直接返回错误给客户端)
    # BL-FALLBACK-500 (5/14 凌晨): 公网链加 500 — 见 qwen-flash 同段注释.
    # BL-NVIDIA-NIM-DROP-FALLBACK (5/15 22:50): 摘 nvidia-llama — 见 private-main 注释
    fallback:
      on_errors: [429, 500, 502, 503, 504, "timeout", "connection error", "connection refused", "rate limit", "free tier", "upstream error"]
      # 8/8: 链尾的 catfish-private-main 已从本部署删除, 摘掉。
      # 不擅自补新的一跳 —— 补哪个是产品决策, 不是修 bug。
