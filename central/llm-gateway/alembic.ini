; alembic.ini · catfish-gateway 数据库迁移
;
; 五一 sprint 5/2 收尾: 替代 db.py 老的 idempotent CREATE TABLE.
;
; 用法:
;   $ cd central/llm-gateway
;   $ alembic upgrade head        # 跑所有未应用 migration
;   $ alembic current              # 看当前 schema 版本
;   $ alembic history              # 看所有 migration
;   $ alembic revision -m "add x"  # 生成新 migration
;
; URL: 从 env CATFISH_DB_URL 读 (env.py 里设). 没 env 就跑不了, fallback 走 sqlite 不需要 alembic.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
