services:
  gateway:
    build: .
    image: catfish-gateway:0.1.0
    container_name: catfish-gateway
    ports:
      # 从 .env 读，未设则默认 8000
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      CATFISH_ENV: ${CATFISH_ENV:-dev}
      CATFISH_CONFIG: /app/config/models.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,httpx; httpx.get(f'http://localhost:{os.environ.get(\"PORT\",\"8000\")}/health', timeout=2).raise_for_status()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
