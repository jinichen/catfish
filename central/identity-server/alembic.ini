; alembic.ini · catfish-identity 数据库迁移
;
; 五一 sprint 5/2 收尾: 替代 db.py 老 idempotent CREATE TABLE.
; 跟 catfish-gateway alembic 对齐 (各服务独立 alembic 历史).
;
; 用法:
;   $ cd central/identity-server
;   $ alembic upgrade head
;   $ alembic current
;   $ alembic history
;   $ alembic revision -m "add column X"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
