# BL-F11 identity-server bench client registry — 不污染 prod config/clients.yaml.
#
# 5 个虚拟 service client, 共享同一个 secret (bench-secret-2026).
# locust 随机选一个 client_id + 一个 scope, POST /token grant_type=client_credentials.
# 每请求 server 跑一次 bcrypt verify (12 rounds, 真 prod 速度).
#
# bcrypt hash 来源 (rounds=12):
#   python3 -c "import bcrypt; print(bcrypt.hashpw(b'bench-secret-2026', bcrypt.gensalt(rounds=12)).decode())"
#
# 6/9 改: 5 client 都允许全部 3 scope (跟 locustfile.py SAMPLE_SCOPES 对齐).
# 之前 client 2-5 只允许 chat.completions, locust 随机 75% scope 不匹配返 400.

clients:
  - client_id: bench-client-1
    client_secret_hash: $2b$12$Yx7pHssvZNtTxHZXYU92iOo1c0RF.52F5Fq.NRygTh0E6uU0oT0gG
    name: Bench Client 1
    description: BL-F11 bench client_credentials grant 压测
    allowed_grant_types:
      - client_credentials
    allowed_scopes:
      - chat.completions
      - audit.write
      - tools.invoke
    department: bench-infra
    role: service
    enabled: true

