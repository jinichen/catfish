# OAuth client 注册表 · 装机模板 (P3.5.80 · 7/28 鸿波达华测试机实撞后补)
#
# ── 为什么必须有这个文件 ──────────────────────────────────────────
#
# Companion 启动时会用 client_credentials 向 identity 换一个 30 天 service
# token 塞给本机 hermes (hermes_jwt_sync.rs · client_id=hermes-cli). identity
# 从本文件认 client —— **没有这个文件 = 没有任何 client 注册**, 所有
# client_credentials 一律返:
#     401 invalid_client (client 认证失败 client_id / secret 错或 client 已禁用)
#
# 7/28 实测就是这样翻的车: 交付包里只有 users.yaml.example, clients.yaml
# 整个被漏了 (打包脚本 --exclude='clients.yaml' 防真 secret 进包是对的,
# 但没有配套的 example + 生成步骤). setup.sh 现在会把本文件 cp 成 clients.yaml.
#
# ── secret 说明 ───────────────────────────────────────────────────
#
# 下面的 hash 对应 demo secret: hermes-dev-secret-2026-please-change
# 这个明文**硬编码在 Companion 二进制里** (hermes_jwt_sync.rs:16 ·
# BL-P26-DEMO-SECRET), 所以它的 hash 放进交付包不构成额外泄露 ——
# secret 本身已经随 Companion 装到每台员工机器上了.
#
# POC 期直接用. 生产要换的话, **两侧必须一起换**:
#   1. 生成新 hash:
#      python3 -c 'import bcrypt; print(bcrypt.hashpw(b"新secret", bcrypt.gensalt()).decode())'
#   2. 替换下面的 client_secret_hash, 重启 identity
#   3. Companion 侧改 hermes_jwt_sync.rs 里的明文并重发客户端
#      (目前是硬编码, 只改服务端会让所有 Companion 的 service token 同步全挂)

clients:
  - client_id: hermes-cli
    client_secret_hash: $2b$12$5LdhU49ZtK7EpYFYdTn4m.48yzoBrU0CasSHmpuY/CGjUKQsYpBcG
    service_token_ttl_seconds: 2592000
    name: Hermes CLI
    description: 鲶鱼 hermes CLI — 跑 skill / 跑批 / agent loop (Companion 同步的 service token 用)
    allowed_grant_types:
      - authorization_code
      - client_credentials
    allowed_scopes:
      - openid
      - email
      - profile
      - chat.completions
      - audit.write
      - tools.invoke
      - skills.run
      - background.tasks
    department: infra
    role: service
    enabled: true
