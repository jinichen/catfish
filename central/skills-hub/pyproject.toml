[project]
name = "catfish-skills-hub"
version = "0.1.0"
description = "Catfish 中央 Skills Hub — 员工发布 / 拉取 skill 的 FastAPI 服务"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Catfish Platform Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.20",
    # BL-D2 Phase 2 (5/10): PG 元数据存储, 跟 mcp-registry / gateway 同套.
    # psycopg 3 (libpq), 跟 alembic 走 SQLAlchemy + psycopg dialect.
    # 没配 CATFISH_DB_URL 时 storage.py 自动 fallback FS, 不强依赖 PG.
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    # BL-D2 Phase 2 (5/10): app 启动自动 load .env, 跟 gateway / mcp-registry 同
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
