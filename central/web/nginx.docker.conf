# catfish-web nginx 配置 — docker-compose 集成模式.
#
# ── 架构 (P3.5.80 · 7/28 鸿波定) ──────────────────────────────────
#
# web 容器是员工浏览器的**唯一入口**, 自己扛反代与 SSL, 不需要"中央 nginx":
#
#     浏览器 ──┬─ /                → SPA (本容器静态文件)
#              ├─ /api/* /v1/*     → gateway:8999
#              └─ OIDC 6 条精确路径 → identity:8998
#
# 为啥砍掉 central/nginx.conf.example 那个中央 nginx:
#   1. 它是上一代 standalone 架构遗留, 与现状三处硬冲突 ——
#      证书名 fullchain/privkey (Let's Encrypt) vs setup.sh 生成的 cert/key;
#      identity 挂 /sso/ 但 setup.sh 的 ISSUER_URL 无路径前缀;
#      server_name 是 catfish.example.com 占位符.
#   2. delivery/dahua-poc/ 里**根本没有 nginx.conf 这个文件**. 客户一旦
#      ENABLE_HTTPS=1 全量 up, Docker 会把 ./nginx.conf 造成空目录 →
#      nginx 挂载后起不来. 这条路径从来没在客户环境跑通过.
#   3. 本容器已经在反代 /api /v1 (7/23 达华血案的修复), 再套一层没意义.
#
# ── HTTP / HTTPS 两种模式 ────────────────────────────────────────
#
#   HTTP  (默认):      compose 映射 5173:80,  员工打 http://IP:5173
#   HTTPS (ENABLE_HTTPS=1): compose 映射 443:443, 员工打 https://IP
#
# 两个 server block 共用 catfish-locations.conf, 免得反代规则写两遍走岔.
#
# HTTPS 的意义: oidc-client 走 PKCE 要用 crypto.subtle, 而它只在**安全上下文**
# 里可用 —— https 或 localhost/127.0.0.1. 裸 IP 走 HTTP 时前端会卡在
# "加载中…" 且无报错. 走 HTTPS 后员工机器不再需要 chrome://flags 的
# unsafely-treat-insecure-origin-as-secure (Safari 也没有那个 flag).
#
# 证书由 setup.sh 现场生成 (SAN 含服务器 IP), 不预打进镜像 ——
# 打包时不知道客户 IP, 预生成的证书到现场是废的.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大小 (fact / image / doc 上传通过 /v1/facts/upload · 20MB 应对 excel/pdf)
    client_max_body_size 20M;

    # gzip (Vite 产物 react + bundle 通常 500KB+)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/catfish-locations.conf;
}

# ── HTTPS (P3.5.80) ──────────────────────────────────────────────
# 证书不存在时本 block 会让 nginx 启动失败, 所以**默认不启用**:
# Dockerfile 把它放在 /etc/nginx/catfish-ssl.conf.disabled,
# docker-entrypoint 的 41-catfish-ssl.sh 检测到 CATFISH_ENABLE_HTTPS=1
# **且**证书文件真实存在时, 才拷进 conf.d/ 生效.
# 这样 HTTP 模式下不带证书也能正常起, 不会因为多写了个 443 就崩.
