# catfish-web nginx 配置 — docker-compose 集成模式 (6/9 BL-WEB-DEPLOY).
#
# 这文件用于 docker-compose stack 里跑 web service. 区别于 nginx.conf.example
# (standalone 部署给客户当参考):
#
# - 不反代 gateway / identity / skills-hub — 中央 nginx 服务负责所有反代 + SSL.
# - 只服 SPA 静态文件 (vite build 出的 dist/).
# - 不暴露 ports 给外网, 中央 nginx 内网调 web:80.
#
# 中央 nginx 反代 / → web:80 → 这里. 员工浏览器看到的 URL 是
# https://catfish.client.com/ , 跟 web service 没直接关系.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传大小 (fact / image / doc 上传通过 /v1/facts/upload · 20MB 应对 excel/pdf)
    client_max_body_size 20M;

    # gzip (Vite 产物 react + bundle 通常 500KB+)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── P3.5.79+ (7/23 达华 POC 血案) API 反代 · 单端口部署 ──
    # 老架构假设有"中央 nginx"反代 /api /v1 到 gateway. 达华 POC 装机没起中央
    # nginx · 员工浏览器直连 5173 · /api/me 走 SPA fallback 返 index.html · 前端
    # 拿到 HTML cast 成 MeInfo · me.email=undefined · HomePage.tsx:35 .split() 崩.
    #
    # 修 · web nginx 内反代:
    #   /api/*    → gateway:8999 (docker network 内 service 名解析 · 无跨域)
    #   /v1/*     → gateway:8999 (chat completions / catalog / hub 反代)
    # identity 员工浏览器可直连 8998 (端口已暴露 + CORS 已配) · 不需反代.
    #
    # 好处: 员工浏览器只跟 5173 打交道 · 无 CORS · 无浏览器 mixed content · 单
    # 端口 SSL 好上. 不需中央 nginx.
    location /api/ {
        proxy_pass http://gateway:8999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # 长连接 (chat streaming / long-poll)
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location /v1/ {
        proxy_pass http://gateway:8999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # chat completions SSE streaming · buffering off + 长 timeout
        proxy_read_timeout 300s;
        proxy_buffering off;
        # SSE 需要
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # SPA fallback — 所有 client-side route (/skills/x, /admin/users 等)
    # 都返 index.html, 让 react-router 接管路由.
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源 (含 hash 文件名) 缓存 1 年
        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # index.html 永远拉新版 (防员工卡老 HTML)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # healthz: 中央 nginx 起 web 前 docker compose 用这个验
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
