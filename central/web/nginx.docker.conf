# catfish-web nginx 配置 — docker-compose 集成模式 (6/9 BL-WEB-DEPLOY).
#
# 这文件用于 docker-compose stack 里跑 web service. 区别于 nginx.conf.example
# (standalone 部署给客户当参考):
#
# - 不反代 gateway / identity / skills-hub — 中央 nginx 服务负责所有反代 + SSL.
# - 只服 SPA 静态文件 (vite build 出的 dist/).
# - 不暴露 ports 给外网, 中央 nginx 内网调 web:80.
#
# 中央 nginx 反代 / → web:80 → 这里. 员工浏览器看到的 URL 是
# https://catfish.client.com/ , 跟 web service 没直接关系.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip (Vite 产物 react + bundle 通常 500KB+)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — 所有 client-side route (/skills/x, /admin/users 等)
    # 都返 index.html, 让 react-router 接管路由.
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源 (含 hash 文件名) 缓存 1 年
        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # index.html 永远拉新版 (防员工卡老 HTML)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # healthz: 中央 nginx 起 web 前 docker compose 用这个验
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
