<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- BL-ARCH1 P3 (5/10): favicon 跨端统一 — 跟 Companion / Dock 同 catfish-logo.svg.
         之前指 /catfish.svg (不存在 → 404 + 浏览器 tab 显示默认图). -->
    <link rel="icon" type="image/svg+xml" href="/catfish-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鲶鱼 · 中央门户</title>
    <style>
      :root {
        --bg: #fafaf7;
        --bg-elev: #ffffff;
        --bg-secondary: #f5f5f0;
        --border: #e3e3dc;
        /* 表格行分隔线 —— 比 --border 更淡, 密集表格里用 --border 会显得脏。
           7/30: 这个变量之前被 QuotaConfigPage / AccessPage 引用了 3 处却
           从没定义过。CSS 里未定义变量又没兜底值时, **整条声明失效** ——
           所以那几张表的行分隔线一直不存在, 而且不会有任何报错。 */
        --border-soft: #efefe9;
        /* 表格里"当前选中"那一行的底色 (8/1)。
           原来在 DataTable 里裸写 `color-mix(in srgb, var(--accent) 12%, transparent)`
           —— color-mix 要 Chrome 111+ / Safari 16.2+, 不支持的浏览器上整条
           声明作废, **高亮静默消失**, 而下钻之后看不出是从哪一行点进来的。
           客户机房里的浏览器版本我们说了不算, 所以退回成一个定值。
           #2d8a87 (--accent) 12% 叠在 #ffffff (--bg-elev) 上就是这个色。 */
        --row-active: #eaf3f2;
        --text: #1f1f1f;
        --text-muted: #6b6b66;
        --accent: #2d8a87;
        /* 7/30: 原来 --status-ok 跟 --accent 是同一个色值 #2d8a87 ——
           于是"服务正常""已订阅""已采纳"这些成功态, 跟满屏的链接和主按钮
           同色, 根本区分不出来是状态还是可点的东西。
           换成真正的绿, 明度/饱和度跟 --status-warn #c97e1c、
           --status-err #c43f3f 对齐, 三个状态色是一套。 */
        --status-ok: #4e8a3f;
        --status-warn: #c97e1c;
        --status-err: #c43f3f;
        --radius-sm: 4px;
        --radius-md: 8px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
          Consolas, "Liberation Mono", monospace;
      }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- P3.5.79+ (7/22 达华 POC 血案): runtime config 注入 · docker entrypoint 生成.
         必须在 main bundle 前加载 · lib/env.ts 优先读 window.__CATFISH_CONFIG__.
         dev 模式 (vite dev server) 若无 config.js · 前端 fallback 走 VITE_* build-time env.
         用 onerror="void 0" · 让 dev/preview 无 config.js 时不报 console 错. -->
    <script src="/config.js" onerror="void 0"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
