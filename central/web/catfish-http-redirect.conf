# HTTP → HTTPS 跳转 (11/08, 鸿波「80 端口也做个跳转到 HTTPS」)
#
# 员工在浏览器里直接敲 IP, 走的是 80 端口; 原来 80 没映射, 看到「连不上」以为服务挂了。
# HTTPS 模式下宿主机 80 映射到容器 8080 (delivery/catfish-poc/docker-compose.http-redirect.yml), 这里一律 301 跳到 https。
#
# 不复用容器的 :80 —— 那个是 HTTP 模式的门户 + 接入页 (员工接入链接 http://<ip>:5173/connect.html 走它), 不能跳。
# __HTTPS_PORT__ 由 41-catfish-ssl.sh 按 CATFISH_HTTPS_PORT 填: 443 留空, 改过端口就是 ":8443"。
# 只有 HTTPS 真启用了 (证书在) 才放进 conf.d —— 证书缺了跳过去也打不开, 不如不跳。
server {
    listen 8080;
    server_name _;
    location / {
        return 301 https://$host__HTTPS_PORT__$request_uri;
    }
}
