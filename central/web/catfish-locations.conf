# catfish-web · 公共 location 片段 (P3.5.80 · 7/28 鸿波)
#
# 被 nginx.docker.conf 的 :80 与 :443 两个 server block 各 include 一次,
# 避免同一套反代规则写两遍走岔.
#
# 反代目标一律写字面 service 名, 不用变量 —— proxy_pass 里出现变量会从
# "启动时解析一次" 变成 "请求时解析", 那必须显式配 resolver, 否则 nginx
# 启动直接报 "no resolver defined to resolve identity".

# ── /api/* /v1/* → gateway ────────────────────────────────────────
# P3.5.79+ (7/23 达华 POC 血案) API 反代 · 单端口部署.
# 老架构假设有"中央 nginx"反代 /api /v1 到 gateway. 达华 POC 装机没起中央
# nginx · 员工浏览器直连 5173 · /api/me 走 SPA fallback 返 index.html · 前端
# 拿到 HTML cast 成 MeInfo · me.email=undefined · HomePage.tsx:35 .split() 崩.
location /api/ {
    proxy_pass http://gateway:8999;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    # 长连接 (chat streaming / long-poll)
    proxy_read_timeout 300s;
    proxy_buffering off;
}

location /v1/ {
    proxy_pass http://gateway:8999;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    # chat completions SSE streaming · buffering off + 长 timeout
    proxy_read_timeout 300s;
    proxy_buffering off;
    # SSE 需要
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
}

# ── identity (OIDC) 反代 · 精确路径 ───────────────────────────────
#
# 为啥用精确路径而不是 /sso/ 前缀:
#   identity 登录页表单是 `<form method="POST" action="/authorize">`
#   (identity-server routes.py:512) —— **根相对绝对路径且硬编码**.
#   挂在 /sso/ 前缀下时浏览器会 POST 到 /authorize 而非 /sso/authorize,
#   落到 SPA fallback → 登录提交必挂.
#   精确路径反代到根 · issuer 保持 https://IP 无前缀 · 表单 action 天然正确 ·
#   identity 一行代码不用改.
#
# 已核实与 SPA 路由零冲突 (SPA: / /admin/* /audit /auth/callback /kanban
# /manager/* /mcp /mcp/* /me /sessions /sessions/* /skills /skills/*).
# 尤其 /me 是 SPA 路由而 /me/password 是 identity 的 —— `location =` 精确匹配
# 优先级高于前缀匹配, 不会误吞 /me.
#
# identity 的 /admin/* 与 /registry/* 有 prefix, 走 gateway 内网转发,
# 浏览器不直连, 不反代.

location = /.well-known/openid-configuration {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/jwks.json {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# GET 显示登录页 · POST 提交账号密码 (form action="/authorize")
location = /authorize {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /token {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /userinfo {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

# 员工首次登录后强制改密 (identity POST /me/password)
location = /me/password {
    proxy_pass http://identity:8998;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

# ── SPA ───────────────────────────────────────────────────────────
location / {
    try_files $uri $uri/ /index.html;

    # 静态资源 (含 hash 文件名) 缓存 1 年
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# index.html 永远拉新版 (防员工卡老 HTML)
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}

# config.js 是启动时按 env 生成的 runtime config, 同样不能缓存 ——
# 客户改 CATFISH_OIDC_ISSUER + restart web 后必须立刻生效.
location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}

# healthz: compose healthcheck 用
location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}
