# catfish-web · 正式证书的 443 server block (11/08, IP + 域名同时用)
#
# ⚠ 模板, 默认不生效。Dockerfile 放在 /etc/nginx/catfish-ssl-official.conf.disabled,
# 41-catfish-ssl.sh 在下面三条都满足时才生成到 conf.d/:
#   1. HTTPS 已启用 (catfish-ssl.conf 那块起来了)
#   2. certs/official/fullchain.pem + privkey.pem 都在 (setup.sh 用 TLS_CERT / TLS_KEY
#      装机时校验过再拷进来的; renew-cert 从不碰它)
#   3. CATFISH_PUBLIC_HOSTS 里有域名 —— __SERVER_NAMES__ 换成这些域名
#
# 按 SNI 分流: 浏览器打的是这些域名 → 这块, 正式证书; 打 IP / 公网 IP → catfish-ssl.conf
# 那块 (default_server), 内部证书。公网 CA 不给 IP 签证书, 所以 IP 永远走内部证书。
server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAMES__;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    ssl_certificate     /etc/nginx/certs/official/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/official/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 接入码照样能用: Companion 用域名 + 接入码接入时会来取内部 CA (导入了也无害,
    # 正式证书本来就被系统信任); 不留这条的话带接入码的链接在域名上会报「中央不支持接入码」。
    location = /catfish-ca.pem {
        alias /etc/nginx/certs/ca.pem;
        default_type application/x-pem-file;
        add_header Cache-Control "no-store";
    }

    location = /catfish-cert-info.json {
        alias /etc/nginx/certs/cert-info.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    include /etc/nginx/catfish-locations.conf;
}
