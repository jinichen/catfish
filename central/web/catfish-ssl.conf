# catfish-web · HTTPS server block (P3.5.80 · 7/28 鸿波)
#
# ⚠ 本文件**默认不生效**. Dockerfile 把它放在
# /etc/nginx/catfish-ssl.conf.disabled, 由 docker-entrypoint.d 的
# 41-catfish-ssl.sh 在满足两个条件时才拷进 conf.d/:
#   1. env CATFISH_ENABLE_HTTPS=1
#   2. /etc/nginx/certs/cert.pem 与 key.pem 都真实存在
#
# 为啥要条件启用: 若无条件写死 443 block, 而证书不存在,
# nginx 启动会直接失败 (`cannot load certificate`), 连 HTTP 模式都起不来 ——
# 等于为了没启用的 HTTPS 把默认路径搞坏.
#
# 证书文件名对齐 setup.sh 的 openssl 生成 (cert.pem / key.pem),
# **不是** Let's Encrypt 的 fullchain.pem / privkey.pem —— 老的
# central/nginx.conf.example 用的是后者, 那是它跑不通的原因之一.

# 11/08 (IP + 域名同时用): 这一块是 443 的**默认** server —— IP 访问、没配正式证书的域名、
# 公网 IP 映射都落在这里, 用内部 CA 签的证书 (SAN 含 IP + 全部 PUBLIC_HOST)。
# 配了正式证书时 41-catfish-ssl.sh 另外生成 catfish-ssl-official.conf, 按 server_name
# (SNI) 只接那几个域名。default_server 必须显式写: conf.d 按文件名排, catfish-ssl-official.conf
# 排在本文件前面, 不写的话第一个 443 块 (正式证书那块) 会变成默认, IP 访问拿到域名证书。
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;  # 10/14 上传上限统一 200M

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # setup.sh 生成: openssl req -x509 ... -keyout certs/key.pem -out certs/cert.pem
    #                -addext "subjectAltName=IP:$SERVER_IP,DNS:catfish.local"
    # SAN 里带 IP 是必须的 —— 现代 Chrome 不认 CN, 没 SAN 的自签证书会报
    # ERR_CERT_COMMON_NAME_INVALID, 连"继续前往"都点不了.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Mozilla intermediate · 兼容大部分企业环境
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 10/14: 员工「接入码」导入内部 CA —— Companion 取这张公开证书, 指纹跟管理员发的接入码对上
    # 才信任 (edge/companion-app/src-tauri/src/commands/server_pairing.rs)。只给 ca.pem 这一个文件;
    # 同目录的 ca-key.pem / key.pem 是私钥, 绝不能用目录方式暴露。只在 443 上有: 证书目录
    # 只在 HTTPS 模式挂载, HTTP 部署也不需要装证书。
    location = /catfish-ca.pem {
        alias /etc/nginx/certs/ca.pem;
        default_type application/x-pem-file;
        add_header Cache-Control "no-store";
    }

    # 11/08: 门户「服务状态」读证书到期日 (内部证书 + 正式证书), certgen.py 写的。
    # 只有公开信息 (到期日 / 域名), TLS 握手时本来就看得到。
    location = /catfish-cert-info.json {
        alias /etc/nginx/certs/cert-info.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 与 :80 共用同一套反代规则
    include /etc/nginx/catfish-locations.conf;
}
