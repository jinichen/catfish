# catfish-web · HTTPS server block (P3.5.80 · 7/28 鸿波)
#
# ⚠ 本文件**默认不生效**. Dockerfile 把它放在
# /etc/nginx/catfish-ssl.conf.disabled, 由 docker-entrypoint.d 的
# 41-catfish-ssl.sh 在满足两个条件时才拷进 conf.d/:
#   1. env CATFISH_ENABLE_HTTPS=1
#   2. /etc/nginx/certs/cert.pem 与 key.pem 都真实存在
#
# 为啥要条件启用: 若无条件写死 443 block, 而证书不存在,
# nginx 启动会直接失败 (`cannot load certificate`), 连 HTTP 模式都起不来 ——
# 等于为了没启用的 HTTPS 把默认路径搞坏.
#
# 证书文件名对齐 setup.sh 的 openssl 生成 (cert.pem / key.pem),
# **不是** Let's Encrypt 的 fullchain.pem / privkey.pem —— 老的
# central/nginx.conf.example 用的是后者, 那是它跑不通的原因之一.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # setup.sh 生成: openssl req -x509 ... -keyout certs/key.pem -out certs/cert.pem
    #                -addext "subjectAltName=IP:$SERVER_IP,DNS:catfish.local"
    # SAN 里带 IP 是必须的 —— 现代 Chrome 不认 CN, 没 SAN 的自签证书会报
    # ERR_CERT_COMMON_NAME_INVALID, 连"继续前往"都点不了.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Mozilla intermediate · 兼容大部分企业环境
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 与 :80 共用同一套反代规则
    include /etc/nginx/catfish-locations.conf;
}
