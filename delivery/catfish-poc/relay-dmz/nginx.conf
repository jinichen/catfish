# DMZ 手机中转站的对外入口 (docker-compose.relay.yml; 挂进 catfish-web 镜像替换它的站点配置)
#
# 只开放手机要用的几样, 别的一律 404:
#   /relay/          → 本机 relay (WebSocket, 端到端密文)
#   /m 和它的静态资源 → 内网中央门户 (就是一个网页, 不带数据)
#   登录页几个精确路径 → 内网中央门户 (它再转给 identity)
# 把 <中央内网地址> 换成中央服务器的内网 IP; 中央门户是 https 自签证书时保持 proxy_ssl_verify off,
# 或者把中央 CA 配进 proxy_ssl_trusted_certificate。

upstream catfish_central { server <中央内网地址>:443; }

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /relay/ {
        proxy_pass http://relay:8999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 手机网页和它要的静态文件
    location = /m                       { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location ^~ /m/                     { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location ^~ /assets/                { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /config.js               { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /m-manifest.webmanifest  { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /catfish-mascot.svg      { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /catfish-logo.svg        { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }

    # 登录 (OIDC): 登录页、换令牌、公钥; 登录完回到 /auth/callback (也是网页)
    location = /auth/callback           { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /.well-known/openid-configuration { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /.well-known/jwks.json   { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /authorize               { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /token                   { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host; }
    location = /userinfo                { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host;
                                          proxy_set_header Authorization $http_authorization; }
    location = /me/password             { proxy_pass https://catfish_central; proxy_ssl_verify off; proxy_set_header Host $host;
                                          proxy_set_header Authorization $http_authorization; }

    location / { return 404; }
}
