# ============================================================
# llm-gateway roles overlay —— 每个客户一份, 默认空
# ============================================================
#
# 空 = 用 central/llm-gateway/config/roles.yaml 的通用角色划分。
# 只有这家客户要改角色能用哪些 model 时才写。
#
# 9/22 之前这里是某一家客户的「单 model 版」—— 四个角色全指向同一个
# model。那是他们 POC 期的选择, 不该成为下一家的默认。
#
# ⚠ 跟 models.yaml 的联动: chat_default 指向的名字, 必须在 models.yaml
#    (baseline 或 overlay) 里真的存在。指向一个不存在的 model 时,
#    gateway 起得来但员工一发消息就报错, 而错误信息不会告诉你是这里配错了。
#
# ── 写法示例 (需要时取消注释) ────────────────────────────────
#
# roles:
#   chat_default: <models.yaml 里某个 model 的 name>
#
# default_allowed_models_per_role:
#   employee: [chat_default]
#   manager:  [chat_default]
#   admin:    [chat_default]
#   sysadmin: [chat_default]
# ============================================================
