# 鲶鱼中央服务全栈 docker-compose (五一 sprint 5/2 收尾 BL-F7).
#
# 一句话起 全套中央 server: postgres + identity + gateway + skills-hub.
#
# 用法 (客户 IT 部署):
#   1. cp .env.production.example .env
#   2. 改 .env 里的密码 / OIDC issuer / API key
#   3. docker compose up -d
#   4. tail -f logs:  docker compose logs -f gateway
#
# 健康检查:
#   curl http://localhost:8999/healthz       # gateway
#   curl http://localhost:8998/.well-known/openid-configuration  # identity
#   curl http://localhost:8997/healthz       # skills-hub
#
# 升级:
#   docker compose pull && docker compose up -d
#   alembic 自动跑 migration (Dockerfile CMD 已串)

services:
  postgres:
    image: postgres:16-alpine
    container_name: catfish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-catfish}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-catfish}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 只本机暴露, 防外网直接连 PG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-catfish} -d ${PG_DB:-catfish}"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity:
    build:
      context: ./identity-server
      dockerfile: Dockerfile
    image: catfish-identity:0.1.0
    container_name: catfish-identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATFISH_DB_URL: postgresql://${PG_USER:-catfish}:${PG_PASSWORD}@postgres:5432/${PG_DB:-catfish}
      CATFISH_ENV: prod
      CATFISH_IDENTITY_PORT: 8998
      # 6/9 BL-DOCKER-HOST 真坑 fix: app.py 默认 host=127.0.0.1, 容器内 lo only.
      # docker network 其他 service / port mapping 都进不去. 必须 0.0.0.0.
      CATFISH_IDENTITY_HOST: 0.0.0.0
      # 6/9 BL-F11.P2 ship: identity 真支持 multi-worker (code_store 从 in-memory
      # 移到 sqlite + module-level lazy app 单例, uvicorn 走 import string 不走
      # factory). 默认 2 worker, 重负载机房 4. 单 worker bcrypt 12 round 极限
      # 5-7 verify/s, 1000 employee 早高峰 SSO 一般够; 5000+ employee 客户改 4.
      UVICORN_WORKERS: ${IDENTITY_WORKERS:-2}
      # 7/15 BL-OIDC-ISSUER fix: identity 用 CATFISH_IDENTITY_ISSUER 构造
      # openid-configuration 返回的 issuer/authorize_endpoint. 不设 fallback
      # 到 CATFISH_IDENTITY_HOST (=0.0.0.0) → 浏览器 ERR_ADDRESS_INVALID.
      # 值必须是浏览器 + gateway container 都能访问的 URL.
      # host.docker.internal: Docker Desktop 特殊 DNS, host 侧 127.0.0.1,
      # container 侧指向 Docker host, 双向可达.
      CATFISH_IDENTITY_ISSUER: ${CATFISH_IDENTITY_ISSUER:-http://host.docker.internal:8998}
      # OIDC 配置 (跟 gateway 共享, 必须跟 CATFISH_IDENTITY_ISSUER 一致 - JWT iss claim)
      CATFISH_OIDC_ISSUER: ${CATFISH_OIDC_ISSUER:-http://host.docker.internal:8998}
      # P3.5.79+ (7/22 达华 POC 血案): web 前端跨域调 identity discovery/token 必设.
      # 默认 CORS 只 allow localhost/127.0.0.1/tauri:// · 客户内网 IP 需显式加.
      # 多 origin 逗号分隔: http://<server-ip>:5173,https://catfish.company.com
      CATFISH_IDENTITY_CORS_ORIGINS: ${CATFISH_IDENTITY_CORS_ORIGINS:-}
    ports:
      # 7/15 BL-OIDC-ISSUER: 员工浏览器需 access identity /authorize.
      # 生产走 nginx 反代 /sso/, 内部部署改回 "127.0.0.1:8998:8998".
      - "8998:8998"
    volumes:
      - ./identity-server/config:/app/config:ro
      # P3.5.80 (7/28 鸿波达华现场): identity 的 RSA 签名密钥写在
      # /home/catfish/.catfish/identity-server/keys, 之前**没有持久卷** ——
      # 容器一重建密钥就没, 已签发的 JWT 全部作废(员工要重登),
      # 且两个 worker 每次都要重新抢一次生成(见 jwt_signer 竞态修复).
      # 对齐 gateway 的 gateway_data 做法, 单独给一个卷.
      - identity_data:/home/catfish/.catfish
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8998/.well-known/openid-configuration"]
      interval: 30s
      timeout: 3s
      retries: 3

  gateway:
    build:
      context: ./llm-gateway
      dockerfile: Dockerfile
    # BL-DAHUA-POC-IMAGE (7/18): 0.1.1 加 orjson (Task #68) · Companion audience 双值兼容 (Task #66) ·
    # 及 pyproject.toml orjson>=3.10 依赖. rebuild + docker save 分发达华 IT.
    image: catfish-gateway:0.1.1
    container_name: catfish-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      CATFISH_DB_URL: postgresql://${PG_USER:-catfish}:${PG_PASSWORD}@postgres:5432/${PG_DB:-catfish}
      CATFISH_ENV: prod
      # 6/9 BL-DOCKER-HOST: app.py 默认 127.0.0.1 (安全 P0 G1 dev 兜底), prod docker 必须 0.0.0.0
      HOST: 0.0.0.0
      PORT: 8999
      CATFISH_CONFIG: /app/config/models.yaml
      # P3.5.84 (7/29 达华现场): /api/admin/* 反代到 identity 的上游地址。
      #
      # admin_proxy.py 的默认值是 http://127.0.0.1:8998 —— 开发机上四个服务
      # 同机, 这个默认恰好对; 但容器里 127.0.0.1 是 gateway 自己, 连不上 →
      # 「系统管理」页 Identity (admin) 显示"不可达"。
      #
      # 另外三个反代 (mcp / hub / wiki) 只能从 yaml 读, 见
      # llm-gateway/config/models.yaml 末尾。
      #
      # 7/30 更正: 这里原本写的是 config-overlay/models.yaml —— **那个目录
      # 没有任何东西读它**。本 compose 里挂进 gateway 的是
      #     ./llm-gateway/config:/app/config:ro
      # 且 CATFISH_CONFIG=/app/config/models.yaml, setup.sh 也不会把 overlay
      # 拷进 config/。照着老注释去改 overlay 的人, 会改完、重启、然后发现
      # 502 一点没变, 而且找不到原因 —— 因为改的那份文件从头到尾没被加载。
      CATFISH_IDENTITY_URL: http://identity:8998
      # 6/9 BL-F10 真实测: 单 worker GIL 卡死, 1000 user P99=34s; 4 worker P99=15s
      # (2.2× 吞吐, 56% latency 降). 默认 4, 4 vCPU 客户机房刚好用满. 8 vCPU 改 8.
      UVICORN_WORKERS: ${GATEWAY_WORKERS:-4}
      # OIDC: 验真 SSO token, 不走 dev_token
      # 7/15 BL-OIDC-ISSUER fix: 跟 identity CATFISH_IDENTITY_ISSUER 一致.
      # 用 host.docker.internal 让浏览器 + gateway container 双向可达.
      CATFISH_OIDC_ISSUER: ${CATFISH_OIDC_ISSUER:-http://host.docker.internal:8998}
      # BL-COMPANION-AUTH (7/18 鸿波 catch Task #66): Companion Rust auth_get_access_token
      # 实际返 id_token (aud=catfish-companion, OIDC 惯例), 不是 access_token. gateway 需
      # 双 audience 才接. 默认单值 catfish-gateway 会拒 Companion id_token · 员工 chat 401.
      CATFISH_OIDC_AUDIENCE: ${CATFISH_OIDC_AUDIENCE:-catfish-companion,catfish-gateway}
      # P3.5.80 (7/28): HTTPS 模式下 issuer=https://IP, 而 oidc.py:80 默认
      # jwks_uri = f"{issuer}/.well-known/jwks.json" —— gateway 在**容器内**
      # 去拉这个 https 地址会撞自签证书验证失败 (Python urllib 不认自签).
      # 走容器内网 HTTP 直连 identity 绕开; iss claim 仍按 https://IP 字符串
      # 比对, 不受影响. auth/__init__.py:217 已支持该 env.
      CATFISH_OIDC_JWKS_URI: ${CATFISH_OIDC_JWKS_URI:-http://identity:8998/.well-known/jwks.json}
      # facts_router 文件落地 (BL-Q3-FACT-PG-MIGRATE 之前的临时方案)
      CATFISH_FACTS_DIR: ${CATFISH_FACTS_DIR:-/home/catfish/.catfish/facts}
      # API keys (公网 LLM)
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 私网 LLM (客户内网部署的 Qwen / embedding, base_url + key)
      INTERNAL_LLM_KEY: ${INTERNAL_LLM_KEY:-}
      INTERNAL_LLM_BASE_QWEN_MAIN: ${INTERNAL_LLM_BASE_QWEN_MAIN:-http://127.0.0.1:9998/v1}
      INTERNAL_LLM_BASE_QWEN_VISION: ${INTERNAL_LLM_BASE_QWEN_VISION:-http://127.0.0.1:9998/v1}
      INTERNAL_LLM_BASE_BGE_M3: ${INTERNAL_LLM_BASE_BGE_M3:-http://127.0.0.1:9998/v1}
    ports:
      - "8999:8999"  # gateway 对员工 Companion 暴露, 反代 nginx 处理 SSL
    volumes:
      - ./llm-gateway/config:/app/config:ro
      - gateway_data:/home/catfish/.catfish  # quota.db (sqlite fallback) / audit jsonl / facts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8999/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    # 6/9 BL-F10: 4 worker × Python = 内存 4×. 1024MB 实测够 (峰值 1014). 客户
    # 机房按 4 vCPU / 2-4GB 规划. 超过 1000 user 横向扩多机, 不是单机加 worker.
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  skills-hub:
    build:
      context: ./skills-hub
      dockerfile: Dockerfile
    image: catfish-skills-hub:0.1.0
    container_name: catfish-skills-hub
    restart: unless-stopped
    environment:
      CATFISH_HUB_DEV_TOKEN: ${SKILLS_HUB_TOKEN:-}
      CATFISH_HUB_ROOT: /data/hub
      # 6/9 BL-DOCKER-HOST: 跟 gateway/identity 同坑, 必须 0.0.0.0
      HOST: 0.0.0.0
      PORT: 8997
    ports:
      - "127.0.0.1:8997:8997"   # 只内网, 走 nginx 暴露
    volumes:
      - hubdata:/data/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8997/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 6/9 BL-WEB-DEPLOY: web SPA (vite + nginx) 集成进 prod stack.
  # 只服静态 dist/, 不直接暴露 ports — 中央 nginx 反代 / → web:80.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: catfish-web:0.1.0
    container_name: catfish-web
    restart: unless-stopped
    # P3.5.79+ (7/22 达华 POC 血案): runtime config 注入 · 一份 image 到处装.
    # docker-entrypoint 从容器 env 生成 /config.js · 换 IP 只改 .env 后 restart 秒生效.
    environment:
      CATFISH_OIDC_ISSUER: ${CATFISH_OIDC_ISSUER:-http://127.0.0.1:8998}
      CATFISH_OIDC_CLIENT_ID: ${CATFISH_OIDC_CLIENT_ID:-catfish-companion}
      CATFISH_OIDC_SCOPE: ${CATFISH_OIDC_SCOPE:-openid email profile}
    # P3.5.79+ (7/23 达华 POC catch): 直接暴露 5173 · 员工浏览器不需走中央 nginx
    # 也能访 http://<server-ip>:5173. 达华 M mac 单机场景 127.0.0.1:5173 是 secure
    # context · crypto.subtle 天然 OK · 无需 chrome flag / HTTPS. 若客户上生产
    # 需 HTTPS · 起 nginx (443) 反代 · 5173 走内网访问不暴露.
    ports:
      - "5173:80"
    healthcheck:
      # P3.5.79+ (7/22): 127.0.0.1 强制 IPv4 · alpine wget 里 'localhost' 优先解
      # 到 ::1 (IPv6) · nginx.docker.conf 只 listen 80 (v4) · IPv6 refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 6/9 BL-MCP-DEPLOY: mcp-registry 企业 MCP 连接器仓库.
  # 员工通过 web UI 订阅 Jira/GitLab/filesystem 等 MCP, OAuth flow 走这.
  mcp-registry:
    build:
      context: ./mcp-registry
      dockerfile: Dockerfile
    image: catfish-mcp-registry:0.1.0
    container_name: catfish-mcp-registry
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATFISH_DB_URL: postgresql://${PG_USER:-catfish}:${PG_PASSWORD}@postgres:5432/${PG_DB:-catfish}
      CATFISH_ENV: prod
      # 6/9 BL-DOCKER-HOST: 必须 0.0.0.0 否则 nginx 反代 /mcp/ 进不去
      HOST: 0.0.0.0
      PORT: 8996
      # OIDC: 验员工 JWT (跟 gateway 共享 issuer)
      # 7/15 BL-OIDC-ISSUER fix: 跟 identity/gateway 一致
      CATFISH_OIDC_ISSUER: ${CATFISH_OIDC_ISSUER:-http://host.docker.internal:8998}
      # P3.4.1 (6/13) 砍 secret-broker: OAuth token 改 Companion 本机存,
      # mcp-registry oauth_callback 直接返 access_token, 不再中央存.
      # (manifesto 数据本地化红线 — 中央存员工 token 政企不合规.)
    ports:
      - "127.0.0.1:8996:8996"   # 只内网, 走 nginx /mcp/ 暴露
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8996/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # P3.3.18-cleanup (7/14): wiki-hub 补上, ship 时 (6ab02a6 6/10) 加了服务本身
  # + gateway 反代 /v1/wiki/*, 但忘加中央 stack 部署段. 员工用 wiki publish 会挂.
  # port 8994, 跟 skills-hub 同模式.
  wiki-hub:
    build:
      context: ./wiki-hub
      dockerfile: Dockerfile
    image: catfish-wiki-hub:0.1.0
    container_name: catfish-wiki-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATFISH_DB_URL: postgresql://${PG_USER:-catfish}:${PG_PASSWORD}@postgres:5432/${PG_DB:-catfish}
      CATFISH_ENV: prod
      # 6/9 BL-DOCKER-HOST: gateway 内网名解析 wiki-hub:8994, 必须 0.0.0.0
      HOST: 0.0.0.0
      PORT: 8994
      CATFISH_WIKI_ROOT: /data/wiki
      # OIDC: 验员工 JWT (跟 gateway / skills-hub 共享 issuer)
      # 7/15 BL-OIDC-ISSUER fix: 跟 identity/gateway 一致
      CATFISH_OIDC_ISSUER: ${CATFISH_OIDC_ISSUER:-http://host.docker.internal:8998}
    ports:
      - "127.0.0.1:8994:8994"   # 只内网, 走 gateway 反代 /v1/wiki/*
    volumes:
      - wikidata:/data/wiki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8994/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # P3.4.1-cleanup2 (7/14): secret-broker service 段删.
  # P3.4.1 (56403d0, 6/13 hb) 已砍 secret-broker 中央存储, 目录+代码+docstring
  # 都清干净了, 但当时忘删 docker-compose.yml + deploy.sh + .env 里的定义.
  # 7 服务栈现在是: postgres / identity / gateway / skills-hub / wiki-hub /
  # web / mcp-registry / nginx (8 个, 加 wiki-hub 补 P3.3.18 漏, 减 broker 一个).

  # nginx 反代: SSL 卸载 + 路由
  #   / → web (SPA)
  #   /v1/ /api/ /healthz → gateway
  #   /sso/ → identity
  #   /hub/ → skills-hub
  #   /mcp/ → mcp-registry  (6/9 BL-MCP-DEPLOY 新加)
  # 客户改 nginx.conf.example → nginx.conf 配域名 + Let's Encrypt cert
  # ── nginx 服务已删除 (P3.5.80 · 7/28 鸿波) ────────────────────────
  #
  # 原因:
  #   1. 它挂载 ./nginx.conf, 但**这个文件在本目录里根本不存在** ——
  #      central/nginx.conf.example 从没被打包脚本拷过来. 客户一旦
  #      ENABLE_HTTPS=1 全量 up, Docker 会把 ./nginx.conf 造成空目录,
  #      nginx 挂载后启动失败. 这条路径从未在客户环境跑通过.
  #   2. 就算把那份 example 补进来也跑不通, 三处硬冲突:
  #      · 证书名 fullchain.pem/privkey.pem (Let's Encrypt) vs
  #        setup.sh 生成的 cert.pem/key.pem
  #      · identity 挂在 /sso/ 前缀下, 但 setup.sh 的 ISSUER_URL 无前缀,
  #        且 identity 登录表单 action="/authorize" 是硬编码根相对路径,
  #        挂前缀后 POST 会落到 SPA → 登录必挂
  #      · server_name 是 catfish.example.com 占位符
  #   3. web 容器本来就在反代 /api /v1 (7/23 达华血案的修复), 现在
  #      443 + OIDC 反代也一并收进 web (见 web/catfish-ssl.conf),
  #      单端口单证书, 不需要再套一层.
  #
  # central/docker-compose.yml 保留 nginx 服务 —— 那是另一套"中央 nginx"
  # 架构的参考部署, 与达华单端口方案不同, 不要混用.

volumes:
  pgdata:
  gateway_data:
  identity_data:     # P3.5.80 (7/28) identity RSA 签名密钥 · 换了会让全员重登
  hubdata:
  wikidata:          # P3.3.18-cleanup (7/14) 补 wiki-hub FS fallback
