# Catfish 中央端 WSL 发行版
[user]
# 服务以 root 跑 (dockerd 要 root); 这个发行版只给中央服务用, 不给人登录干活
default = root

[automount]
# 要能读 C:\ 下的交付包 (/mnt/c/...)
enabled = true

[interop]
# 不把 Windows 的 PATH 拼进来: 否则 setup.sh 里的 docker / curl 可能调到 Windows 那边的同名程序
appendWindowsPath = false

[boot]
# 不开 systemd: Windows Server 2022 / 老 Win10 上的 WSL 版本对它支持不一。dockerd 由 catfish-start.sh 拉起
systemd = false
