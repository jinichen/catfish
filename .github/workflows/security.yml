name: Security audit

# 5/6 BL-SEC: 依赖 CVE / secrets 扫描. 5/14 demo 前必须全绿.
# 触发: 每次 push 到 main + 每个 PR + 每天 09:00 UTC schedule.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 9 * * *'

jobs:
  python-audit:
    name: pip-audit (4 components)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - central/llm-gateway
          - central/skills-hub
          - edge/tool-bridge
          - edge/local-search
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: install pip-audit
        run: pip install pip-audit tomli
      - name: pyproject → requirements
        run: |
          python -c "
          import tomli
          d = tomli.load(open('${{ matrix.project }}/pyproject.toml','rb'))
          for x in d['project']['dependencies']:
              print(x.split(';')[0].strip())
          " > /tmp/req.txt
      - name: pip-audit
        run: pip-audit -r /tmp/req.txt --no-deps --strict

  npm-audit:
    name: npm audit (companion-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: '20' }
      - name: install
        working-directory: edge/companion-app
        run: npm ci
      - name: audit
        working-directory: edge/companion-app
        # 仅 prod deps, audit-level=high 阻断 high/critical CVE
        run: npm audit --omit=dev --audit-level=high

  cargo-audit:
    name: cargo audit (Tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # 10/17: 原来用 rustsec/audit-check@v2, 它不读任何 audit.toml (CI 输出里 settings.ignore 一直是 [])。
      # 直接跑 cargo audit, 在 src-tauri 里它读 .cargo/audit.toml —— 跟本机跑的是同一条命令、同一份忽略清单,
      # 忽略的每一条和理由都在 edge/companion-app/src-tauri/.cargo/audit.toml。
      # 只有漏洞 (vulnerability) 会让它非零退出; unmaintained / unsound 只是警告。
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: edge/companion-app/src-tauri
        run: cargo audit

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # 9/29: 失效的豁免是静默的 —— 9/22 改目录名时把 .gitleaksignore 里的历史路径
      # 也改了, 两条豁免从此匹配不上, 每晚全历史扫描天天红, push 扫描却一直绿
      # (只看新提交)。先核对每条豁免都指得到当时的文件, push 时就能发现。
      - name: .gitleaksignore 豁免没有失效
        run: python3 scripts/check_gitleaksignore.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
