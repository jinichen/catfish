name: Build Windows msi

# 何时跑:
#   - 仅手动触发 (Actions 页面 Run workflow 按钮)
#   - 在手动选择 tag 运行时, 上传 GitHub Release asset
#
# Windows 编译资源和 runner 成本较高, 不跟随每次 main push 自动编译。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Build Catfish Companion msi
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout catfish
        uses: actions/checkout@v5
        with:
          # 9/20: 1 → 0。check_version_sync.sh 要沿历史找"当前版本号是哪个
          # commit 引入的", 浅克隆里 git log -S 会把 HEAD 自己算成引入者,
          # 那道检查就静默放行 —— 而这个 workflow 正是产出 MSI 的地方,
          # 版本号没 bump 的后果(装了等于没装)全部由它承担。
          # 代价: 全量 fetch 几十秒, 对一个 39 分钟的 job 可以忽略。
          fetch-depth: 0

      # 先拦版本漂移，再开始下载/打包几百 MB 的离线资源。Companion 与 Hermes
      # 各自版本独立；脚本只检查 Companion 三处一致和 Hermes pins 自洽。
      - name: Validate Companion and Hermes versions
        shell: bash
        working-directory: edge/companion-app
        run: bash scripts/check_version_sync.sh

      - name: Verify Windows lifecycle cleanup with isolated fixtures
        shell: powershell
        run: '& "edge/companion-app/scripts/test-windows-maintenance.ps1"'

      - name: Setup Node.js 26.8.1 (Companion 前端构建)
        uses: actions/setup-node@v6
        with:
          node-version: '26.8.1'

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust stable-msvc
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/companion-app/src-tauri

      - name: Install Companion frontend dependencies
        working-directory: edge/companion-app
        run: npm ci --no-audit --no-fund

      # generate_context! 在 Rust 编译期读取 frontendDist；前置编译之前必须
      # 先产出 dist，不能依赖后面的 Tauri beforeBuildCommand。
      - name: Build Companion frontend for Rust preflight
        working-directory: edge/companion-app
        run: npm run build

      # ─── Windows hermes 运行时 (10/14, hermes v0.22.0 起) ───
      # 原来这里是一串: clone 上游 → 拷插件 → 给 install.ps1 打离线补丁 → 下 cpython 3.11 zip → npx 下
      # Chromium → 取额外依赖 → 打 hermes 归档 → 测离线 uv 缓存。v0.22 上游安装器整个换成 hermes pm
      # (只认 Python 3.14、联网装), 补丁锚点全部对不上。现在 Companion 自己装 (hermes_install_native.rs),
      # 资源统一由下面这个脚本出 (mac 上也能交叉打, 跟本地打包同一份): uv.exe / cpython-3.14.7 /
      # hermes 归档 (含 win_amd64 wheelhouse + 安装戳) / Chromium (wheelhouse 里同版 playwright 下的)。
      - name: Build Windows Hermes runtime resources
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: bash edge/companion-app/scripts/build-windows-hermes-resources.sh







      # 10/9: 删掉了 "npm ci in hermes-agent-src" 这一步 —— node_modules 不再进包。
      # 员工机上 hermes 只跑 Python 网关 + 鲶鱼工具, 不需要 Node: 10/9 在 mac 上用
      # 发布中的 hermes (v2026.8.31) 去掉 node_modules、PATH 里也没有 node/npx/npm,
      # 聊天 / 浏览器 / 知识库 / 邮件 / 文件 40 次工具调用全过。鲶鱼的浏览器是
      # catfish_browser_* (Python Playwright + chromium-embed); hermes 自带的 browser_*
      # 网关会在它们在场时丢掉 (BL-FIX4)。详见 edge/companion-app/scripts/build-mac-resources.sh 文件头。

      - name: Build offline WeChat reader resource
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "${{ github.workspace }}\edge\companion-app\scripts\build-wechat-reader-resource.ps1"
          if ($LASTEXITCODE -ne 0) { throw "catfish-wechat-reader resource build failed" }
          $archive = "${{ github.workspace }}\edge\companion-app\src-tauri\resources\windows\catfish-wechat-reader-dist.tar.gz"
          if (-not (Test-Path $archive)) { throw "reader resource was not generated: $archive" }
          Write-Host "✓ $archive"


      - name: Build offline email and edge runtime resources
        shell: pwsh
        env:
          # Windows 上 Python stdout 默认 cp1252, 脚本里的中文输出会直接崩
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $resourceDir = "${{ github.workspace }}\edge\companion-app\src-tauri\resources\windows"
          $emailSource = "${{ github.workspace }}\edge\email-agent"
          $emailStage = Join-Path $env:RUNNER_TEMP 'catfish-email-dist'
          foreach ($dir in @($emailStage)) {
              if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }

          # catfish-email 是 py3-none-any wheel，安装时用 uv --no-deps，完全离线。
          python -m pip wheel --no-deps --wheel-dir $emailStage $emailSource
          if ($LASTEXITCODE -ne 0) { throw 'email wheel build failed' }
          python edge/companion-app/scripts/verify-email-wheel.py $emailStage $emailSource
          if ($LASTEXITCODE -ne 0) { throw 'email wheel source verification failed' }
          # Outlook COM 适配器需要 pywin32；一起放入 Windows 离线归档。
          # 10/14: 邮件环境用 hermes venv 的解释器建 (install-catfish-email.ps1), hermes v0.22 起是 3.14。
          python -m pip download --only-binary=:all: --dest $emailStage `
              --python-version 3.14 --platform win_amd64 --implementation cp --abi cp314 pywin32
          if ($LASTEXITCODE -ne 0) { throw 'pywin32 wheel 下载失败' }
          $wheels = @(Get-ChildItem $emailStage -Filter '*.whl')
          if (-not ($wheels | Where-Object { $_.Name -like 'catfish_email-*.whl' })) {
              throw 'email archive 缺少 catfish-email wheel'
          }
          if (-not ($wheels | Where-Object { $_.Name -like 'pywin32-*.whl' })) {
              throw 'email archive 缺少 pywin32 wheel'
          }
          $skillDest = Join-Path $emailStage 'hermes-skill'
          New-Item -ItemType Directory -Force -Path $skillDest | Out-Null
          Copy-Item -Recurse "$emailSource\hermes-skill\*" $skillDest
          $emailTar = Join-Path $resourceDir 'catfish-email-dist.tar.gz'
          if (Test-Path $emailTar) { Remove-Item -Force $emailTar }
          tar -czf $emailTar -C $emailStage .
          if ($LASTEXITCODE -ne 0) { throw 'catfish-email-dist.tar.gz 构建失败' }

          # 10/14: hermes 额外依赖 (hermes-deps-dist) 已并进 hermes 归档的 wheelhouse, 见上一步。

          # 9/23: tool-bridge / local-search 源码; 9/28 加上传文件解析脚本 (见 src-tauri/src/services/edge_runtime.rs)
          $edgeTar = Join-Path $resourceDir 'catfish-edge-runtime.tar.gz'
          python edge/companion-app/scripts/build_edge_runtime.py $edgeTar
          if ($LASTEXITCODE -ne 0) { throw 'catfish-edge-runtime.tar.gz 构建失败' }
          foreach ($archive in @($emailTar, $edgeTar)) {
              $file = Get-Item $archive
              if ($file.Length -le 1024) { throw "资源文件过小: $archive" }
              Write-Host "✓ $($file.Name) · $([math]::Round($file.Length/1KB,1)) KB"
          }


      # 9/18: 量"随包分发 uv 缓存"到底多大, 并在 Windows 上证明离线重放可行。
      #
      # 背景: 现场能上网但受国内防火墙限制。**国内镜像救不了这件事** —— uv.lock 把
      # 2058 个包的下载地址钉死在 files.pythonhosted.org, `uv sync --locked` 就照那些
      # URL 下载, 镜像压根不会被访问 (实测 -v 日志直接打出 pythonhosted 的请求)。
      # 把镜像设成默认索引反而让锁失效:
      #   "Resolving despite existing lockfile due to missing remote index:
      #    `certifi` from `https://pypi.org/simple`"
      # 那等于回到不校验哈希的 PyPI 重解析 —— 正是 b4bd403 刚修掉的那个退化。
      # `--find-links` 也不行: 离线时 uv 只查缓存, 不看 find-links。
      #
      # 唯一可行的机制: 构建期预热 UV_CACHE_DIR → 随包发 → 装机期 --offline 重放。
      # 已在 Linux 上端到端验过, 这一步是拿真 Windows wheel 复核 + 量体积。
      #
      # ⚠ 不要对缓存跑 `uv cache prune --ci`: 它名字像是为这个场景设计的, 但删掉的
      #    正是离线要用的归档 —— 实测瘦身后离线 sync 立刻失败。
      #
      # 先只测量, 不改产物。拿到数字再决定整包发还是先砍 [all] 里用不到的 extra。
      - name: Verify packaged Windows runtime startup and email upgrade
        shell: pwsh
        timeout-minutes: 20
        run: |
          & edge/companion-app/scripts/smoke-windows-runtime.ps1 -Resources edge/companion-app/src-tauri/resources/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime smoke failed' }


      # 必须放在所有 Tauri resources 生成之后：tauri.conf.json 会在 build
      # script 阶段校验每个 resources 路径。此前预编译放在资源生成之前，
      # cpython/chromium 等文件尚不存在，导致预编译失败并把后续资源步骤全部跳过。
      - name: Preflight Windows release compile (warnings are errors)
        working-directory: edge/companion-app/src-tauri
        run: >-
          cargo build --release --target x86_64-pc-windows-msvc
          --features tauri/custom-protocol

      - name: Windows service and certificate regression gate
        working-directory: edge/companion-app/src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @(
            'util::service_probe::tests',
            'util::http_client::certificate_reload_tests',
            'services::process::windows_pid_tests',
            'services::tool_bridge_rpc::windows_rpc_tests',
            'services::chrome_runtime::tests',
            'services::browser_paths::tests',
            'services::email_runtime::tests'
          )) {
            cargo test --release --lib --target x86_64-pc-windows-msvc --features tauri/custom-protocol $suite -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Windows regression failed: $suite" }
          }
          $browserRoot = Join-Path $env:RUNNER_TEMP 'catfish-chrome-lifecycle'
          New-Item -ItemType Directory -Force -Path $browserRoot | Out-Null
          tar -xzf resources/windows/chromium-embed.tar.gz -C $browserRoot
          if ($LASTEXITCODE -ne 0) { throw 'Chromium extraction failed' }
          $browser = Get-ChildItem $browserRoot -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $browser) { throw 'Packaged Chromium executable missing' }
          $env:CATFISH_TEST_CHROME_BIN = $browser.FullName
          cargo test --release --lib --target x86_64-pc-windows-msvc --features tauri/custom-protocol services::chrome_runtime::tests::packaged_browser_lifecycle -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Chromium lifecycle failed' }

      # ─── Tauri msi build (Windows MSVC, no cross-compile) ───

      # W2.18 (7/13 CI run #13 铁证): light.exe 报 8 处 ICE38 + 2 处 ICE64
      # error 挂. 根因: Tauri v2 上游 main.wxs Handlebars 生成的 Component 每
      # 个 File 加 KeyPath="yes" (per-machine 标准), 但我们走 per-user 装
      # %LOCALAPPDATA%. ICE38 严格要求 user profile Component 用 HKCU
      # RegistryValue 做 KeyPath (让 msi per-user 追踪), 不能用 File.
      #
      # Tauri auto-gen Component 改不了 (Handlebars 硬编 KeyPath=yes on File).
      # Tauri v2 wix config 不暴露 additionalLightArgs 传 ICE 抑制参数.
      #
      # 方案 A: pre-download WiX + wrap light.exe (rustc 编 shim) 拼
      # -sice:ICE38 -sice:ICE64 -sice:ICE91 参数. Tauri 检测 WixTools314
      # 已存在跳下载, 直接 call 我们的 wrapper light.exe.
      #
      # ICE 抑制的语义边界:
      # - install/uninstall 照常工作 (msi 引擎不看 ICE)
      # - ICE38 抑制: msi Feature table 用 File KeyPath 追踪 Component, 不
      #   HKCU 独立 per-user 状态. 影响: 若一台机器多用户各自装, msi 引擎
      #   会认为已装 (共享 File 状态), 第二用户装无效. 我们场景 corp 单
      #   用户机, 无冲击.
      # - ICE64 抑制: uninstall 可能残留 %LOCALAPPDATA%\Catfish Companion\
      #   子目录 (hermes 装的 python, models 等). 用户手动清即可.
      # - ICE91 抑制: warning-only, 已经不 fail.
      - name: Pre-download WiX + wrap light.exe with ICE suppression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools314"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null

          Write-Host "Downloading WiX 3.14.1 binaries..."
          $wixZip = "$env:RUNNER_TEMP\wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $wixZip

          Write-Host "Extracting to $wixDir..."
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force

          if (-not (Test-Path "$wixDir\light.exe")) { throw "light.exe 缺失, WiX zip 结构变了?" }
          if (-not (Test-Path "$wixDir\candle.exe")) { throw "candle.exe 缺失" }

          Write-Host "Renaming light.exe -> light-real.exe..."
          Move-Item "$wixDir\light.exe" "$wixDir\light-real.exe" -Force

          Write-Host "Compiling light_wrapper.rs -> light.exe (rustc single file, no deps)..."
          $wrapSrc = "$env:GITHUB_WORKSPACE\edge\companion-app\scripts\light_wrapper.rs"
          if (-not (Test-Path $wrapSrc)) { throw "wrapper source not found: $wrapSrc" }
          rustc $wrapSrc -o "$wixDir\light.exe" --edition 2021 -C opt-level=0
          if ($LASTEXITCODE -ne 0) { throw "rustc failed: $LASTEXITCODE" }

          Write-Host "WixTools314 dir now:"
          Get-ChildItem $wixDir | Where-Object { $_.Name -match '\.(exe|dll)$' } |
              Select-Object Name, Length | Format-Table

      - name: Tauri build msi
        working-directory: edge/companion-app
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles msi --verbose
        env:
          RUST_LOG: 'info'
          # 9/19: 这里原来强制 CFLAGS/CXXFLAGS = /MD (W2.14 修的
          # esaxx-rs /MT 跟 ort-sys /MD 撞 LNK2038)。**那个冲突已经不存在了**:
          # 7/16 起 ort + tokenizers 被限定成 cfg(target_arch = "aarch64"),
          # 而 Windows msi 是 x86_64-pc-windows-msvc —— 这两个 crate 在这条
          # 构建线上根本不编。
          # 10/6 起 Windows 又编这两个 crate 了 (本地向量回到 Windows), 但 ort 走
          # load-dynamic: 不链接 pyke 的 /MD 静态库, 运行时加载 onnxruntime.dll,
          # 所以 LNK2038 不会回来; tokenizers 的 onig/esaxx C++ 由 cc 跟着
          # crt-static 走 /MT。留着的 /MD 成了死代码, 而且反过来咬了一口:
          # 9/19 给主程序加 +crt-static (静态链接 MSVC 运行库, 治干净装机上
          # 的 "找不到 VCRUNTIME140.dll") 之后, Rust 用 /MT 而 C 被这两行按
          # 在 /MD 上, 直接 LNK2038。
          #
          # 删掉而不是改成 /MT: cc crate 会自己跟着 rustflags 的 crt-static
          # 走。写死 /MT 的话就有了两个真相来源, 哪天去掉 crt-static 这里
          # 又会变成新的死代码。

      # W2.15 (7/13 CI run #10): candle.exe 挂但 Tauri 只报上层"failed to run".
      # failure 时 dump Handlebars 展开后的 wxs + candle stderr 让 audit.
      - name: Dump wix on failure (audit candle error)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "===== target/wix/x64/ 目录 ====="
          $wixDir = "edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/wix"
          if (Test-Path $wixDir) {
              Get-ChildItem $wixDir -Recurse | Format-Table FullName, Length
              Write-Host ""
              Write-Host "===== main.wxs (Handlebars 展开后) ====="
              Get-ChildItem "$wixDir\x64\main.wxs" -ErrorAction SilentlyContinue | ForEach-Object {
                  Get-Content $_.FullName
              }
              Write-Host ""
              Write-Host "===== *.wixobj 大小 (若有生成) ====="
              Get-ChildItem "$wixDir\x64\*.wixobj" -ErrorAction SilentlyContinue | Format-Table FullName, Length
          } else {
              Write-Host "$wixDir 不存在"
          }
          Write-Host ""
          Write-Host "===== catfish-postinstall.wxs (源码, 不 handlebars) ====="
          Get-Content "edge/companion-app/src-tauri/wix/catfish-postinstall.wxs"

      - name: Record Windows artifact identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release'
          $msiDir = Join-Path $releaseDir 'bundle/msi'
          $exe = Join-Path $releaseDir 'catfish-companion-app.exe'
          $bundle = 'edge/companion-app/src-tauri/resources/windows/hermes-agent-bundle.tar.gz'
          $packages = @(Get-ChildItem -LiteralPath $msiDir -Filter '*.msi')
          if ($packages.Count -eq 0) { throw 'No MSI produced' }
          $files = @($exe, $bundle) + @($packages | ForEach-Object { $_.FullName })
          $manifest = [ordered]@{
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            files = @($files | ForEach-Object {
              $item = Get-Item -LiteralPath $_
              [ordered]@{
                name = $item.Name
                bytes = $item.Length
                sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
              }
            })
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $msiDir 'build-identity.json') -Encoding utf8

      - name: List msi output
        shell: bash
        run: |
          set -euo pipefail
          ls -lh edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/ || true


      - name: Upload msi artifact
      # v7 使用 Node 24，避免 GitHub Actions 的 Node 20 弃用提示。
        uses: actions/upload-artifact@v7
        with:
          name: catfish-companion-msi-${{ github.sha }}
          path: |
            edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/build-identity.json
          if-no-files-found: error
          retention-days: 30

      # ─── 上传 Release asset (手动触发也传, 走 CDN 下载快) ───
      # 员工从 Artifact 页下载 638MB 走 api.github.com 只有几十 KB/s;
      # Release asset 走 objects.githubusercontent.com CDN, 国内快一个量级.
      # tag 名 = run id + attempt + 完整 sha, 唯一且不冲突.
      - name: Upload msi to Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: "msi-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          name: "MSI build ${{ github.sha }}"
          files: |
            edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/build-identity.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          overwrite_files: true
          make_latest: false
