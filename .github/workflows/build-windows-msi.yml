name: Build Windows msi

# 何时跑:
#   - main push (companion-app 或 install.ps1 patch 改动时自动)
#   - 手动触发 (Actions 页面 Run workflow 按钮 — 任何时候强制 rebuild)
#   - 打 tag 时 build release msi (上传 GitHub Release asset)
on:
  push:
    branches: [main]
    tags: ['v*', 'p39-*']
    paths:
      - 'edge/companion-app/**'
      - 'edge/hermes-fork/patch_install_ps1_offline.py'
      - '.github/workflows/build-windows-msi.yml'
  workflow_dispatch:

concurrency:
  group: build-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Build Catfish Companion msi
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout catfish
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust stable-msvc
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/companion-app/src-tauri

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('edge/companion-app/package-lock.json') }}
          restore-keys: npm-

      # ─── Windows resources: install.ps1 patched + uv.exe + cpython zip + hermes tar ───

      - name: Clone hermes-agent 上游 pinned to .hermes-git-tag
        shell: bash
        run: |
          set -euo pipefail
          # 版本映射 audit 铁证 (7/13):
          # .hermes-target-version = 0.18.0 (pyproject 内部版本)
          # GitHub tag = v2026.7.1 (date 格式, 独立 numbering)
          # 独立记 GitHub tag 到 .hermes-git-tag, 避免混淆.
          HERMES_TAG=$(cat edge/companion-app/.hermes-git-tag | tr -d '[:space:]')
          HERMES_VER=$(cat edge/companion-app/.hermes-target-version | tr -d '[:space:]')
          echo "Cloning hermes-agent GitHub tag=${HERMES_TAG} (pyproject version=${HERMES_VER})"
          git clone --depth 1 --branch "${HERMES_TAG}" \
              https://github.com/NousResearch/hermes-agent.git \
              /tmp/hermes-agent-src
          # verify pyproject version 匹配 (defense in depth)
          ACTUAL_VER=$(grep -E '^version' /tmp/hermes-agent-src/pyproject.toml | head -1 | sed -E 's/version *= *"([^"]+)"/\1/' | tr -d '[:space:]')
          if [[ "${ACTUAL_VER}" != "${HERMES_VER}" ]]; then
            echo "ERROR: cloned hermes-agent pyproject version=${ACTUAL_VER}, expected ${HERMES_VER}"
            echo "  .hermes-git-tag (${HERMES_TAG}) 跟 .hermes-target-version (${HERMES_VER}) 映射错. audit + update."
            exit 1
          fi
          echo "OK version match: ${HERMES_VER}"
          ls /tmp/hermes-agent-src | head

      - name: Copy catfish plugins into hermes-agent-src
        shell: bash
        run: |
          set -euo pipefail
          # catfish repo edge/hermes-plugins/{catfish-memory,catfish-todo-sync}
          # 需要拷进 hermes-agent-src/plugins/memory/, hermes 启动时加载.
          # (dev 机是软链, CI clean clone 是空; 拷源码 = 展开等价)
          mkdir -p /tmp/hermes-agent-src/plugins/memory
          for plugin in catfish-memory catfish-todo-sync; do
            if [[ -d "edge/hermes-plugins/${plugin}" ]]; then
              cp -R "edge/hermes-plugins/${plugin}" \
                    "/tmp/hermes-agent-src/plugins/memory/${plugin}"
              echo "OK copied ${plugin}"
            else
              echo "WARN: edge/hermes-plugins/${plugin} 不存在, hermes 启动会缺 plugin"
            fi
          done
          ls /tmp/hermes-agent-src/plugins/memory/

      - name: Patch install.ps1 offline mode
        shell: bash
        env:
          # W2.10 Windows Python 3.12 cp1252 stdout 挂 unicode. 双保险:
          # env var + script 内 sys.stdout.reconfigure.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python3 edge/hermes-fork/patch_install_ps1_offline.py \
              --input /tmp/hermes-agent-src/scripts/install.ps1 \
              --output edge/companion-app/src-tauri/resources/windows/install.ps1
          # verify marker
          grep -q 'CATFISH-OFFLINE-PATCH-v1' \
              edge/companion-app/src-tauri/resources/windows/install.ps1

      - name: Download uv Windows x86_64
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION=0.4.30
          curl -fSL -o /tmp/uv.zip \
              "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-pc-windows-msvc.zip"
          unzip -o /tmp/uv.zip -d /tmp/uv-extract
          cp /tmp/uv-extract/uv.exe edge/companion-app/src-tauri/resources/windows/uv.exe
          ls -lh edge/companion-app/src-tauri/resources/windows/uv.exe

      - name: Download + repack cpython 3.11.15 Windows x86_64
        # W2.12 (7/13 CI run #7): 用 pwsh 全 native Windows 环境.
        # 之前 shell:bash + /tmp path 挂: PowerShell 是 native Windows 不认
        # unix /tmp (Git Bash 内部映射), 也无 unix zip. 换 pwsh 后 $env:RUNNER_TEMP
        # 走 Windows path, tar / Compress-Archive 都 native.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PYTHON_VER = '3.11.15'
          $BUILD_TAG = '20260623'
          $FNAME = "cpython-${PYTHON_VER}+${BUILD_TAG}-x86_64-pc-windows-msvc-install_only.tar.gz"
          $URL = "https://github.com/astral-sh/python-build-standalone/releases/download/${BUILD_TAG}/${FNAME}"

          $TMP = $env:RUNNER_TEMP
          $tarPath = "$TMP\cpython.tar.gz"
          $extractDir = "$TMP\cpython-extract"

          # 下 tar.gz
          Write-Host "Downloading cpython 3.11.15 Windows x86_64 ..."
          Invoke-WebRequest -Uri $URL -OutFile $tarPath

          # 展开 tar (Windows 10 build 17063+ 内置 bsd tar)
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          tar -xzf $tarPath -C $extractDir
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed: $LASTEXITCODE" }

          # rename 顶层 python\ → cpython-3.11.15-windows-x86_64-none\
          # audit uv 0.4.30 installation.rs fmt::Display InstallationKey format:
          #   {impl}-{maj}.{min}.{patch}-{os}-{arch}-{libc} = cpython-3.11.15-windows-x86_64-none
          $expectedName = "cpython-${PYTHON_VER}-windows-x86_64-none"
          Rename-Item -Path "$extractDir\python" -NewName $expectedName

          # 重打 zip (Windows native Compress-Archive)
          $outZip = "$env:GITHUB_WORKSPACE\edge\companion-app\src-tauri\resources\windows\cpython-${PYTHON_VER}-embed.zip"
          if (Test-Path $outZip) { Remove-Item -Force $outZip }
          Compress-Archive -Path "$extractDir\$expectedName" -DestinationPath $outZip -Force

          # verify
          Get-ChildItem "$env:GITHUB_WORKSPACE\edge\companion-app\src-tauri\resources\windows\" |
              Format-Table Name, Length

      - name: Pack hermes-agent bundle (follow symlink, exclude venv/cache)
        shell: bash
        run: |
          set -euo pipefail
          # -h dereference symlinks: catfish repo 里 hermes-fork 的 plugin 软链展开
          tar czhf edge/companion-app/src-tauri/resources/windows/hermes-agent-bundle.tar.gz \
              -C /tmp \
              --exclude='hermes-agent/.git' \
              --exclude='hermes-agent/**/__pycache__' \
              --exclude='hermes-agent/venv' \
              --exclude='hermes-agent/venv.bak*' \
              --exclude='hermes-agent/.venv' \
              --exclude='hermes-agent/**/.venv' \
              --exclude='hermes-agent/node_modules' \
              --exclude='hermes-agent/**/node_modules' \
              --exclude='hermes-agent/target' \
              --exclude='hermes-agent/**/target' \
              --exclude='hermes-agent/**/*.pyc' \
              hermes-agent-src
          # rename 顶层目录 hermes-agent-src → hermes-agent (install.ps1 offline 预期)
          # tar 里已经用 hermes-agent-src 作根, install.ps1 -OfflineSourceDir 传目录名
          ls -lh edge/companion-app/src-tauri/resources/windows/

      # ─── Companion frontend build ───

      - name: npm install
        working-directory: edge/companion-app
        run: npm ci --no-audit --no-fund

      # ─── Tauri msi build (Windows MSVC, no cross-compile) ───

      - name: Tauri build msi
        working-directory: edge/companion-app
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles msi --verbose
        env:
          RUST_LOG: 'info'
          # W2.14: force /MD dynamic CRT (Rust MSVC default). esaxx-rs C++ 编译
          # 用 cc-rs, 默认 /MT static CRT 跟 ort-sys /MD 撞 LNK2038.
          CFLAGS_x86_64_pc_windows_msvc: "/MD"
          CXXFLAGS_x86_64_pc_windows_msvc: "/MD"

      # W2.15 (7/13 CI run #10): candle.exe 挂但 Tauri 只报上层"failed to run".
      # failure 时 dump Handlebars 展开后的 wxs + candle stderr 让 audit.
      - name: Dump wix on failure (audit candle error)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "===== target/wix/x64/ 目录 ====="
          $wixDir = "edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/wix"
          if (Test-Path $wixDir) {
              Get-ChildItem $wixDir -Recurse | Format-Table FullName, Length
              Write-Host ""
              Write-Host "===== main.wxs (Handlebars 展开后) ====="
              Get-ChildItem "$wixDir\x64\main.wxs" -ErrorAction SilentlyContinue | ForEach-Object {
                  Get-Content $_.FullName
              }
              Write-Host ""
              Write-Host "===== *.wixobj 大小 (若有生成) ====="
              Get-ChildItem "$wixDir\x64\*.wixobj" -ErrorAction SilentlyContinue | Format-Table FullName, Length
          } else {
              Write-Host "$wixDir 不存在"
          }
          Write-Host ""
          Write-Host "===== catfish-postinstall.wxs (源码, 不 handlebars) ====="
          Get-Content "edge/companion-app/src-tauri/wix/catfish-postinstall.wxs"

      - name: List msi output
        shell: bash
        run: |
          set -euo pipefail
          ls -lh edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/ || true

      - name: Upload msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: catfish-companion-msi-${{ github.sha }}
          path: edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # ─── 打 tag 时, 作 release asset (可选) ───
      - name: Release msi on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: edge/companion-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
