name: CI

# 何时跑:
#   - main / develop push
#   - 所有 PR (合并前必过)
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:  # 手动触发

# 同一 PR 多次 push 时取消老 run, 省 CI 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════
  # 0. 全仓自检 — 跨包的、只需要跑一次的检查
  # ════════════════════════════════════════════════════════════
  # 8/13: 这个 job 是新加的, 因为发现两条"写在军规里但 CI 从来没跑过"的检查:
  #
  #   · check_file_sizes.sh —— CLAUDE.md §2 原话「改完代码必跑」「返回非 0
  #     不许 commit」, 而 CI 里**一处都没挂**, 全靠人记得。
  #   · undefined name (F821) —— 8/8 那个拆分提交一次造了两个洞 (P28 微信中文串
  #     4 天 / P30 微信扫码 500 五天), 都是"函数搬走了、它用的 import 没搬"。
  #     pyflakes 一秒能看出来, 但没人跑。
  #
  # 挂在独立 job 而不是塞进某个模块的 job: 这两条都是**全仓**的, 塞进
  # hermes-plugins (matrix) 会按模块重复跑, 塞进 tool-bridge 又语义不对。
  repo-checks:
    name: 全仓自检 (文件行数 / undefined name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 9/22: 这里一度需要 fetch-depth: 0 —— 旧的版本号判据要用 git log -S
      # 找"VERSION 是哪个提交引入的"。新判据改成直接比内容哈希, 不看历史,
      # 所以浅克隆就够了 (CI 也快一点)。
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pyflakes
        run: pip install pyflakes

      # A 类 = 可执行语句里的未定义名字 (跑到就 NameError) → 必过
      # B 类 = 只在类型注解里 (运行时不查找) → 照常打印, 不拦
      # 分类判据见脚本头部。8/13 全仓扫的结果: A 类 0, B 类 15 处。
      - name: undefined name (F821) — A 类必过
        run: bash scripts/check_undefined_names.sh --strict

      # ⚠ 待办: 现在是 continue-on-error, 因为仓里还有 45 个 ≥800 行的存量文件
      #    (8/13 实测)。存量清完之前一刀切会让每个 PR 都红, 那这条又会变成
      #    被无视的噪音 —— 跟它当初没挂 CI 是同一种失效。
      #
      #    清完存量后删掉 continue-on-error, 并把 repo-checks 加进 ci-pass。
      #    在那之前它至少是**可见的红**, 不是完全不存在。
      - name: 文件行数红线 (CLAUDE.md §1)
        continue-on-error: true
        run: bash scripts/check_file_sizes.sh --strict

      # 9/22: 交付目录里不许出现客户名。
      #
      # 这条**不挂 continue-on-error** —— 跟上面那条不一样, 它没有存量问题
      # (9/22 已经清干净并验证过), 而且失效的代价是把 A 客户的现场记录连同
      # 包一起发给 B 客户。那种错误发出去就收不回来, 值得让 PR 当场红。
      - name: 交付目录不带客户名
        run: bash scripts/check_no_customer_names_in_delivery.sh

      # 9/22: setup.sh 的 .env 生成回归测试。
      #
      # 这个测试 9/12 (020f172, 镜像 tag 改从 compose 读) 起就一直是红的,
      # 到 9/22 才被发现 —— 因为**没有任何地方在跑它**。它守的是"重跑装机
      # 不能换密钥"这件事: 换掉 CATFISH_SECRET_KEY 等于数据库里所有供应商
      # API key 全部解不开, 只能逐个去后台重新申请。
      #
      # 一个写得挺好、记着真实 bug 的测试, 躺在仓库里死了十天。挂上。
      - name: 交付装机脚本 .env 生成回归
        run: bash delivery/catfish-poc/test_setup_env.sh

      # 9/22: 中央端六个镜像的版本号。
      #
      # 版本号是**算出来的** (日期 + 源码内容哈希, 见 scripts/central_version.sh),
      # 这条检查只问一件事: VERSION 跟源码现在算出来的对不对得上。
      # 红了的修法只有一条命令, 不需要任何判断:
      #     bash scripts/central_version.sh --write
      #
      # 之所以不用 semver: 9/12 到 9/22 那十天里六个镜像一直是 0.1.2, 每次
      # 交付都一样 —— 因为"这次算 patch 还是 minor"需要人判断, 而需要判断的
      # 事在交付前会被跳过。同版本号的两个镜像在 docker images 里无法区分。
      - name: 中央端镜像版本同步
        run: bash scripts/check_central_image_version.sh

      # 9/22: setup.sh 和 setup.ps1 必须以同样的方式调用 tools/ 下的共享脚本。
      # 漏传一个参数不会报错, 只会让某一个平台少一道保护 —— 比如 --pg-volume
      # 漏了, 那边重装时既有数据库卷那道闸就失效了。
      # 静态比对, 不需要 PowerShell (CI runner 上没有)。
      - name: 装机脚本两平台参数一致
        run: python3 delivery/catfish-poc/test_wrapper_parity.py

      # 9/22: 交付包里的 gateway 配置不能是空的。
      #
      # 那天真实发生过: overlay 的空模板把整份 baseline 冲掉, 打出来的包里
      # 0 个 model, 而包照样打完报成功。装上去门户打得开、登录正常, 只有员工
      # 发第一条消息才会发现没有模型可用。
      - name: 交付 config 不是空的
        run: bash scripts/check_delivery_config_not_empty.sh

  # ════════════════════════════════════════════════════════════
  # 1. tool-bridge Python tests
  # ════════════════════════════════════════════════════════════
  # tool-bridge pyproject requires-python>=3.10 (装在客户机, 一律 3.10+).
  # 用 3.10 保最低支持版本兼容性, 沙盒和客户机一致.
  tool-bridge:
    name: tool-bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pytest + deps
        run: |
          python -m pip install --upgrade pip
          # BL-CI-MISSING-DEPS (6/3): test_search_skills / test_skill_register 用 yaml.
          # 装项目真依赖更稳, 但 tool-bridge pyproject 真 deps 很重 (含 hermes /
          # browser 库), CI 不需要全装 — 只补 import 时真触发的最小集.
          # BL-CI-TOOLBRIDGE-DOCX (6/3): test_run_skill (5 个) 真调
          # leadership-briefing skill script.py, script.py import docx (python-docx).
          pip install pytest pytest-asyncio pyyaml httpx jieba pydantic python-dotenv \
            python-docx Pillow

      - name: Run tool-bridge tests
        working-directory: edge/tool-bridge
        run: |
          # BL-CI-FIX (5/17): ignore test_fed25_e2e_chain.py — 跨包 E2E 测试,
          # 需要 catfish_gateway 在 PYTHONPATH. 跟 test_e2e_sandbox /
          # test_e2e_agent_workflow 一样, CI 里只跑单包单测.
          PYTHONPATH=src python -m pytest tests/ -v \
            --ignore=tests/test_e2e_sandbox.py \
            --ignore=tests/test_e2e_agent_workflow.py \
            --ignore=tests/test_fed25_e2e_chain.py \
            -p no:cacheprovider

  # ════════════════════════════════════════════════════════════
  # 2. gateway Python tests
  # ════════════════════════════════════════════════════════════
  # BL-CI-FIX (5/17): gateway pyproject requires-python>=3.12 (datetime.UTC,
  # type 等 3.11+/3.12+ 特性已大量使用). 5/17 前 CI 用 3.10 一直默默失败 (现在
  # 1300+ 测试因为 ImportError 全 collect 不上), 是 hermes 0.14 升级时漏改 ci.yml.
  gateway:
    name: gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: central/llm-gateway
        run: |
          python -m pip install --upgrade pip
          # 依赖真源是 pyproject.toml。手写最小依赖清单曾漏掉 ruamel.yaml，
          # 导致 app import 直接失败；后续加字段还会继续漏掉同类依赖。
          pip install -e '.[dev]'

      - name: Run gateway tests
        working-directory: central/llm-gateway
        env:
          # 测试隔离: CI 没真 PG / OIDC
          CATFISH_DB_URL: ""
        run: |
          PYTHONPATH=src python -m pytest tests/ -v \
            --ignore=tests/test_a2a_jwt.py \
            -p no:cacheprovider

  # ════════════════════════════════════════════════════════════
  # 2b. gateway — 真 PG 上跑真 SQL
  # ════════════════════════════════════════════════════════════
  # 上面那个 job 把 CATFISH_DB_URL 设成空, 于是所有碰库的测试都用内存字典
  # 替身。那样能验业务判断, 但有一整类 bug 它**结构上就看不见**:
  #
  #   · 迁移 SQL 到底把什么写进了 JSONB
  #   · pydantic 校验 + model_dump + JSONB round-trip 之后哪些字段还在
  #
  # 8/1 实际漏掉过两个, 都是零报错的:
  #   gemini-flash 的 timeout 被拆分从 60 静默抬到 180
  #   界面存一次模型就丢掉 upstream.provider, 而 api_key_env 落回
  #   INTERNAL_LLM_KEY —— 内网集群的凭据会被发到公网端点
  #
  # 起个真 postgres 服务, 跑真 alembic, 就这一个文件。
  gateway-real-pg:
    name: gateway tests (真 PG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catfish
          POSTGRES_PASSWORD: catfish
          POSTGRES_DB: catfish
        ports: ["5432:5432"]
        # 没有 health check 的话, 后面的 alembic 会在 PG 还没起来时连失败
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: central/llm-gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Alembic upgrade head
        working-directory: central/llm-gateway
        env:
          CATFISH_DB_URL: postgresql://catfish:catfish@localhost:5432/catfish
        run: alembic upgrade head

      - name: Run real-PG tests
        working-directory: central/llm-gateway
        env:
          CATFISH_TEST_PG_URL: postgresql://catfish:catfish@localhost:5432/catfish
        run: |
          PYTHONPATH=src python -m pytest tests/test_provider_split_real_pg.py -v \
            -p no:cacheprovider
          # ⚠ 这个文件没设 CATFISH_TEST_PG_URL 时会整体 skip —— 而 skip 在
          # pytest 里是绿的。所以这里再确认一次它**真的跑了**, 否则哪天
          # 服务容器起不来, 这个 job 会安静地全绿。
          PYTHONPATH=src python -m pytest tests/test_provider_split_real_pg.py \
            -p no:cacheprovider -q 2>&1 | tee /tmp/out.txt
          grep -qE "^[0-9]+ passed" /tmp/out.txt || {
            echo "::error::真 PG 测试一条都没跑 (多半是 postgres 服务没起来)"; exit 1; }

  # ════════════════════════════════════════════════════════════
  # 3. Companion 前端 — tsc strict + vite build
  # ════════════════════════════════════════════════════════════
  companion:
    name: companion-app tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 是 check_version_sync.sh 的「版本号必须跟着代码动」
      # 那道检查需要的 —— 它要沿历史找「当前版本号是哪个 commit 引入的」。
      # 浅克隆里只有一个 commit, git log -S 会把 HEAD 自己算成引入者, 范围
      # 变成空, 检查**静默放行**。加这道检查的那次差点就这么交出去了。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edge/companion-app/package-lock.json

      - name: Install deps
        working-directory: edge/companion-app
        run: npm ci --no-audit --no-fund

      # BL-CI-FIX (5/17): npm 已知 bug (npm/cli#4828) — package-lock.json 在 macOS
      # 生成, npm ci 在 Linux 跑可能不装 platform-specific optionalDependencies.
      # rollup 4 把 native binary 拆 11 个 platform 包, 缺一就 vite build 挂.
      # 显式重装 Linux x64 binary, --no-save 不污染 lockfile.
      - name: Ensure rollup Linux x64 native binary
        working-directory: edge/companion-app
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu

      - name: TSC strict check (no emit)
        working-directory: edge/companion-app
        run: npx tsc --noEmit -p tsconfig.json

      - name: Vite build (no tauri — 不要 Rust 工具链)
        working-directory: edge/companion-app
        run: npx vite build

      # BL-COMPANION-VERSION-SYNC (5/18): 三处版本号 (package.json / Cargo.toml /
      # tauri.conf.json) 必须一致, 防漂移. hermes 同步那一块靠 release runbook,
      # 不在 CI 范围 (hermes 装在 ~/.hermes/, runner 看不到).
      - name: Companion version sync lint
        working-directory: edge/companion-app
        run: bash scripts/check_version_sync.sh

      # 8/10: codex_backend.rs 里有一段以 Rust 字符串常量形式嵌进去的 Python
      # (HERMES_HELPER) —— 换模型这条路全靠它。对 cargo 来说那就是个字符串,
      # 编译器不看; 这个 job 又是纯 Node ("不要 Rust 工具链"), 于是它至今
      # **一次自动化检查都没有过**, 只在员工点模型下拉框时才第一次真正运行。
      #
      # 代价已经付过: 8/3-8/10 之间 disable 分支少了个 no-op 短路, 导致每换
      # 一次普通网关模型都会弹一句假的「这个模型要新开一个对话才会生效」,
      # 员工照做丢掉整段上下文。详见脚本头部。
      #
      # 用 runner 自带的 python3, hermes 全部走桩件, 不装任何东西。
      - name: HERMES_HELPER 嵌入脚本行为测试
        working-directory: edge/companion-app/src-tauri
        run: python3 scripts/test_hermes_helper.py

  # ════════════════════════════════════════════════════════════
  # 3b. 中央门户前端 (central/web) — tsc + build + 路由自查
  # ════════════════════════════════════════════════════════════
  # 7/30: 这个 job 之前**根本不存在**。companion 有 tsc+build+vitest 三道,
  # central/web 一道都没有 —— 而它是管理员每天用的那个后台。
  # 也就是说自 5/10 建仓起, 它的 TypeScript 从没在 CI 里编译过一次。
  central-web:
    name: central/web tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: central/web/package-lock.json

      - name: Install deps
        working-directory: central/web
        run: npm ci --no-audit --no-fund

      # 同 companion job: npm/cli#4828, lockfile 在 macOS 生成时漏 Linux native binary
      - name: Ensure rollup Linux x64 native binary
        working-directory: central/web
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu

      - name: TSC strict check (no emit)
        working-directory: central/web
        run: npx tsc --noEmit -p tsconfig.json

      # 类型系统管不到、失败又都静默的几类问题, 见各脚本文件头:
      #   check-admin-routes  — 路由/侧栏/跨仓硬编码路径一致性
      #   check-css-vars      — 引用了但从没定义过的 CSS 变量 (边框会直接消失)
      #   check-audit-limits  — 前端的截断上限常量 vs 后端 SQL 的 LIMIT
      #                         (对不上的话"只显示前 N 名"和对账告警都会说谎)
      #   check-page-scroll   — 一屏布局: 标了"只滚数据区"的页必须真有一个
      #                         fill 的块, 否则内容被裁掉且没有滚动条
      - name: Static consistency checks
        working-directory: central/web
        run: npm run check

      - name: Vite build
        working-directory: central/web
        run: npx vite build

  # ════════════════════════════════════════════════════════════
  # 4. 中央服务 (skills-hub / mcp-registry / identity-server) — Python 3.12
  # ════════════════════════════════════════════════════════════
  # B3 (6/6 鸿波 audit): 之前 CI 只跑 tool-bridge + gateway 2 个模块, 剩 10 个全
  # 没跑. 按 TESTING-SPEC.md §4 扩 matrix. fail-fast: false 让一个 module 挂
  # 不影响其它 job 跑完, 报告全部失败一次性看清.
  central-services:
    name: central/${{ matrix.module }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: skills-hub
          - module: mcp-registry
          - module: identity-server
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: central/${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          # 每个中央服务的 pyproject.toml 是唯一依赖真源，避免漏装运行时依赖。
          pip install -e '.[dev]'

      - name: Run tests
        working-directory: central/${{ matrix.module }}
        run: |
          PYTHONPATH=src python -m pytest tests/ -v -p no:cacheprovider

  # ════════════════════════════════════════════════════════════
  # 5. Edge agents (local-search / journal-agent / email-agent) — Python 3.10+
  # ════════════════════════════════════════════════════════════
  # 这 3 个标准库为主, deps 很少. local-search 走 3.9+ 但 ubuntu 自带 3.12 也兼容.
  edge-agents:
    name: edge/${{ matrix.module }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: local-search
            python: "3.10"
            extra_deps: "pyyaml"
          - module: journal-agent
            python: "3.10"
            extra_deps: ""
          - module: email-agent
            python: "3.10"
            extra_deps: "pytest-mock"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ${{ matrix.extra_deps }}

      - name: Run tests
        working-directory: edge/${{ matrix.module }}
        run: |
          PYTHONPATH=src python -m pytest tests/ -v -p no:cacheprovider

  # ════════════════════════════════════════════════════════════
  # 6. hermes plugins (catfish-memory / catfish-xcatfish-user) — 特殊路径
  # ════════════════════════════════════════════════════════════
  # plugin 没 pyproject.toml, tests/conftest.py 用 sys.path hack 加 plugin 目录.
  # 真 runtime 需要 hermes-agent 内部 module (gateway / model_tools 等), CI 装不上,
  # 所以这 2 个 module 测试主要是 monkey-patch 单测 (mock hermes module).
  hermes-plugins:
    name: edge/hermes-plugins/${{ matrix.module }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [catfish-memory, catfish-xcatfish-user]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # plugin tests mock 大部分 hermes module, 只装公共依赖
          # C6 (6/6): + aiohttp (catfish-xcatfish-user 真用 aiohttp middleware)
          pip install pytest pytest-asyncio pyyaml httpx 'pydantic>=2' python-dotenv aiohttp

      - name: Run tests
        working-directory: edge/hermes-plugins/${{ matrix.module }}
        run: |
          python -m pytest tests/ -v -p no:cacheprovider

  # ════════════════════════════════════════════════════════════
  # 7. Companion vitest (TypeScript 单测)
  # ════════════════════════════════════════════════════════════
  # B4 (6/6 鸿波 audit): 8 个 *.test.ts 之前 CI 没跑. companion job 只跑 tsc + vite build,
  # 没跑 vitest. 加这个 job 真跑 unit tests.
  companion-vitest:
    name: companion-app vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edge/companion-app/package-lock.json

      - name: Install deps
        working-directory: edge/companion-app
        run: npm ci --no-audit --no-fund

      - name: Run vitest
        working-directory: edge/companion-app
        run: npx vitest run --reporter=verbose

  # ════════════════════════════════════════════════════════════
  # 8. Companion Rust 单测 (cargo test inline modules)
  # ════════════════════════════════════════════════════════════
  # B4: 25 个 .rs 含 #[cfg(test)] inline 模块, CI 之前没跑. macOS-latest 必须 (Tauri
  # 平台特定 code, e.g. AppleScript / Cocoa FFI). Linux runner 部分 platform-gated
  # 代码 skip, 但 #[cfg(test)] inline 大部分能跑.
  companion-cargo:
    name: companion-app cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 9/22: 禁止写死 ~/.hermes。Windows 上 hermes 装在 %LOCALAPPDATA%\hermes,
      # 写死的路径让四个本地服务全部起不来。放在 Rust 工具链之前: 纯 grep,
      # 一秒出结果, 别让人等五分钟编译才知道路径写错了。
      - name: No hardcoded ~/.hermes
        run: bash edge/companion-app/scripts/check_no_hardcoded_hermes_home.sh

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edge/companion-app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('edge/companion-app/src-tauri/Cargo.lock') }}

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 8/13: 原来这一步是
      #     cargo test --lib --no-fail-fast || echo "::warning::..."
      # `|| echo` 把退出码吞了 —— job 永远绿, 失败只剩 log 里一条 annotation。
      # 429 个 Rust 测试等于在 CI 里没有断言能力。
      #
      # 但直接改成硬失败也不对: 当初留这个口子的理由 (Linux runner 上平台相关
      # 代码可能跑不通) 没被证伪过, 一刀切可能让整条 CI 因为无关的平台差异变红。
      #
      # 所以拆成两步, 按"这个失败是不是一定是真错"来分:
      #
      #   编译 —— 编译不过跟平台无关, 一定是真错 → **必过**
      #   运行 —— 可能有平台门控的用例 → 暂时 continue-on-error, 但失败在 UI 上
      #           是可见的红 (不再是绿勾里藏一条 warning)
      - name: cargo test 编译 (必过)
        working-directory: edge/companion-app/src-tauri
        # --no-run 只编译测试二进制不执行。编译失败 = 代码真断了, 没有"平台限制"
        # 这种借口, 所以这一步不给任何逃生口。
        run: cargo test --lib --no-run

      - name: cargo test 运行
        working-directory: edge/companion-app/src-tauri
        # ⚠ 待办: 第一次在 Linux 上全绿之后, 删掉下面这行 continue-on-error,
        #    并把 companion-cargo 加进 ci-pass 的 needs + results 列表。
        #    在那之前它是"可见的已知欠债", 不是"看不见的假绿"。
        #
        # 本机 macOS 实测 429 passed / 0 failed (8/12)。Linux 侧未验 —— 没验过的
        # 事不写成"应该能过"。第一次跑出来的失败清单就是要修的东西: 正确修法是
        # 给真正平台相关的用例加 #[cfg(target_os = "macos")] (仓库里已有 39 处
        # 这样的门控), 而不是把退出码再吞回去。
        continue-on-error: true
        run: cargo test --lib --no-fail-fast

      - name: cargo doctest (必过)
        working-directory: edge/companion-app/src-tauri
        # 9/18: 补这一步是因为 `--lib` **不含 doctest**, 于是
        # wiki_conflicts.rs 里一段缩进四格的 YAML 被 rustdoc 当成 Rust 代码,
        # 从 9/17 起本机 `cargo test` 一直红着, CI 却一路绿 —— 谁也没看见。
        #
        # 这一步不给逃生口: doctest 跟平台无关, 挂了就是注释里的代码块写错了
        # (要么加 ```text 围栏, 要么它真的该能编过)。全仓也就两条, 很快。
        run: cargo test --doc

  # ════════════════════════════════════════════════════════════
  # 9. 全套总结 — 核心 job 都过才算 CI 绿
  # ════════════════════════════════════════════════════════════
  # 核心 (必过): tool-bridge / gateway / companion (tsc+build) / central-web /
  # central-services /
  # edge-agents / hermes-plugins / companion-vitest
  # 半核心: companion-cargo —— **编译那一步是必过的**, 只有"运行结果"还挂着
  #         continue-on-error (Linux 侧没验过)。第一次全绿后就该挪进下面的
  #         needs 列表, 见那个 job 里的待办注释。
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs:
      - tool-bridge
      - gateway
      - gateway-real-pg
      - companion
      - central-web
      - central-services
      - edge-agents
      - hermes-plugins
      - companion-vitest
    if: always()
    steps:
      - name: Check all core jobs passed
        run: |
          declare -A results
          results[tool-bridge]="${{ needs.tool-bridge.result }}"
          results[gateway]="${{ needs.gateway.result }}"
          # 8/1: 真 PG 那个 job 也是 core。不挂在这里的话它红了整体还是绿的
          # —— 而它专门盯的就是"零报错的那类 bug"。
          results[gateway-real-pg]="${{ needs.gateway-real-pg.result }}"
          results[companion]="${{ needs.companion.result }}"
          results[central-web]="${{ needs.central-web.result }}"
          results[central-services]="${{ needs.central-services.result }}"
          results[edge-agents]="${{ needs.edge-agents.result }}"
          results[hermes-plugins]="${{ needs.hermes-plugins.result }}"
          results[companion-vitest]="${{ needs.companion-vitest.result }}"

          failed=0
          for job in "${!results[@]}"; do
            if [ "${results[$job]}" != "success" ]; then
              echo "❌ $job: ${results[$job]}"
              failed=1
            else
              echo "✅ $job"
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo "❌ CI 至少一个 core job 失败"
            exit 1
          fi
          echo ""
          echo "✅ 全套 core CI 绿 (cargo test 非阻塞, 详情看 companion-cargo job log)"
