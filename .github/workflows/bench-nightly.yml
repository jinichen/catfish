name: Bench Nightly (P3.5.61)

# P3.5.61 (6/22 鸿波 catch "继续完成") — nightly bench gateway 跑 locust mock 流量,
# parse_results.py 比 bench/baseline.json, regression > 10% 卡 + PR comment.
#
# 设计:
#   - 不跑真 LLM (mock_upstream 替代), 0 token 成本
#   - PG + gateway + mock_upstream 全 docker compose 起
#   - 短跑 (300 users / 3min), 比 manual 1000/10m 快, 给 nightly 节奏
#   - workflow_dispatch 支持手动调参
#   - 产 artifact (CSV / HTML / summary.json) 给后续 trend
#
# 跟 P3.5.60 /admin/perf 关系: /admin/perf 是生产员工真流量, 走 PG audit;
# nightly 是 CI 合成基准, 走 mock. 一个看真实健康, 一个防 regression.

on:
  schedule:
    # 每天 UTC 17:00 = 北京 01:00 (低峰)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      users:
        description: '并发员工数'
        required: false
        default: '300'
      run_time:
        description: '跑多久 (locust syntax: 3m / 600s)'
        required: false
        default: '3m'
      threshold:
        description: 'regression 阈值 (0.10 = 10%)'
        required: false
        default: '0.10'

concurrency:
  group: bench-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Locust bench + regression check
    runs-on: ubuntu-latest
    # locust + docker stack 完整跑 + parse, 给 25min buffer
    timeout-minutes: 25
    defaults:
      run:
        working-directory: central/llm-gateway

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locust
        run: |
          python -m pip install --upgrade pip
          pip install 'locust>=2.31,<3.0'
          locust --version

      - name: Bring up bench stack (gateway + mock + PG)
        run: |
          docker compose -f bench/docker-compose-bench.yml up -d --build pg mock_upstream gateway
          echo "==> 等 gateway healthy..."
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8999/healthz >/dev/null 2>&1; then
              echo "    gateway up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:8999/healthz || (echo "::error::gateway 没起" && exit 1)

      # 9/18: 这个 job 在 GitHub 上跑过的 6 次全红, 而且症状是"300 用户 3 分钟
      # **零个请求完成**" —— 统计表空、错误报告也空。本机 Mac 起同一套 compose
      # 单发 / locust 10 用户都正常。runner 上到底卡在哪, 之前的 workflow 一个字
      # 都不打: 没探针、gateway 日志也不导。先让它失败时自己说清楚。
      - name: Smoke one streaming request (跟 locust 同一条路)
        run: |
          set -o pipefail
          curl -sN --max-time 30 http://localhost:8999/v1/chat/completions \
            -H "Authorization: Bearer bench-token-alice" \
            -H "Content-Type: application/json" \
            -d '{"model":"catfish-mock-bench","messages":[{"role":"user","content":"smoke"}],"stream":true,"max_tokens":20}' \
            | tee /tmp/smoke.txt | tail -3
          grep -q "\[DONE\]" /tmp/smoke.txt || {
            echo "::error::单发流式请求 30s 内没收到 [DONE] —— locust 零完成的直接原因"; exit 1; }

      - name: Run locust
        env:
          USERS: ${{ github.event.inputs.users || '300' }}
          RUN_TIME: ${{ github.event.inputs.run_time || '3m' }}
        run: |
          TS="$(date +%Y%m%d-%H%M%S)"
          echo "TS=$TS" >> $GITHUB_ENV
          mkdir -p bench/nightly-${TS}
          # 9/20: --exit-code-on-error 0 —— 这是 #91 (以及之前那批) 红在
          # 「Run locust」而不是回归检查上的直接原因。
          #
          # locust --headless 的默认是"只要有任何一个请求失败就 exit 1"。
          # 300 用户压 3 分钟出现千分之几的失败是常态 (6/22 那份基线自己的
          # fail_rate 就是 0.86%), 于是 job 在这一步就死了, **根本走不到真正
          # 的判据那一步** —— 而判据本来就该由 parse_results.py 下:
          # 它比的是 fail_rate 相对基线有没有升 (compare() 里那条 +0.01 规则),
          # 而不是"有没有失败过"。
          #
          # 本机 bench/run.sh 一直是 `locust ... || echo "(exit non-0, 继续)"`,
          # 也就是本机早就在容忍这个退出码。"Mac 上正常、runner 上全红"里有
          # 一半是这个不对称造成的, 不是环境差异。
          #
          # 把它设成 0 之后, locust 非零退出就只剩"locust 自己崩了"一种含义,
          # 那种情况仍然让这步红。至于跑坏了的情形有两道兜底都在 parse 里:
          #   · 零个请求完成 → exit 2 (9/19 加)
          #   · 大面积失败   → fail_rate 相对基线暴涨 → exit 1
          locust -f bench/locustfile.py \
            --host http://localhost:8999 \
            --headless \
            --exit-code-on-error 0 \
            --users "$USERS" \
            --spawn-rate 50 \
            --run-time "$RUN_TIME" \
            --html "bench/nightly-${TS}/report.html" \
            --csv "bench/nightly-${TS}/run" \
            --only-summary

      - name: Parse + regression check
        env:
          THRESHOLD: ${{ github.event.inputs.threshold || '0.10' }}
          # 9/19: 传给 --users / --run-time 做基线可比性校验。locust 的 csv
          # 不记负载参数, 只有这里知道。跟上面 Run locust 那步保持同一个默认值。
          USERS: ${{ github.event.inputs.users || '300' }}
          RUN_TIME: ${{ github.event.inputs.run_time || '3m' }}
        run: |
          python bench/parse_results.py \
            --stats "bench/nightly-${TS}/run_stats.csv" \
            --baseline bench/baseline.json \
            --threshold "$THRESHOLD" \
            --users "$USERS" --run-time "$RUN_TIME" \
            --out "bench/nightly-${TS}/summary.json" \
            --md "bench/nightly-${TS}/summary.md"
        # exit code: 0 = 硬指标通过 / 1 = 硬指标失败 (step 红) / 2 = 没法比
        #
        # ⚠ 9/22 起 **延迟不在这里面**。这台 runner 上同一份 gateway 代码
        # 两次跑的 p50 就能差 35% (实测 #93 vs #94, 两次之间 gateway 侧零
        # 改动), 10% 的阈值比噪声还小。延迟照报但不拦, 理由和数据见
        # bench/parse_results.py 顶部那段。
        continue-on-error: false

      # 把摘要贴到 job summary 页。不贴的话那张延迟趋势表只躺在 artifact 里,
      # 要先 gh run download 才看得见 —— 等于没人看。既然它已经不决定红绿,
      # 唯一的价值就是有人真的会瞄一眼。
      #
      # always(): 上一步硬指标红的时候更需要看到这张表。
      - name: 摘要贴到 job summary
        if: always()
        run: |
          f="bench/nightly-${TS}/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 没有 summary.md —— parse 那步在写文件之前就退出了, 看它的 stderr。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 9/19: 每次都顺手产一份「按这次结果采的候选基线」, 塞进 artifact。
      #
      # 为什么要在 CI 里产, 而不是让人在自己机器上跑 bench/run.sh 采:
      # 基线和实跑必须在**同一台机器**上取, 否则我们刚修掉的「负载不可比」
      # 会立刻换成「硬件不可比」—— 一台 M4 Mac 和 GitHub 的 2-core runner
      # 差出的倍数比任何真回归都大, 门禁又会同时漏报和误报。
      # 基线的唯一合法产地就是跑对比的那台机器。
      #
      # 这一步不改 baseline.json, 只产候选 —— 替换永远是人看过之后的动作。
      # if: always() 是因为上一步有回归就 exit 1, 而恰恰是那种时候最需要
      # 拿候选基线对着看「到底是退化了还是基线本来就不对」。
      - name: Emit candidate baseline (给人 review, 不自动替换)
        if: always()
        env:
          USERS: ${{ github.event.inputs.users || '300' }}
          RUN_TIME: ${{ github.event.inputs.run_time || '3m' }}
        run: |
          python bench/parse_results.py \
            --stats "bench/nightly-${TS}/run_stats.csv" \
            --baseline bench/baseline.json \
            --users "$USERS" --run-time "$RUN_TIME" \
            --emit-baseline "bench/nightly-${TS}/candidate-baseline.json" \
          || echo "::notice::候选基线没产出 (这次跑本身不健康, parse 拒绝了) —— 详情看上面 stderr"

      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "===== gateway ====="; docker compose -f bench/docker-compose-bench.yml logs --no-color --tail 200 gateway || true
          echo "===== mock_upstream ====="; docker compose -f bench/docker-compose-bench.yml logs --no-color --tail 60 mock_upstream || true
          echo "===== pg ====="; docker compose -f bench/docker-compose-bench.yml logs --no-color --tail 30 pg || true
          docker compose -f bench/docker-compose-bench.yml ps || true

      - name: Upload bench artifacts
        if: always()
      # ⚠ 这一条**还会继续报** "Node.js 20 is deprecated" (8/1 查证):
      #
      # actions/upload-artifact 的 v5 / v5.0.0 标签, action.yml 里写的仍然是
      # `using: 'node20'` —— 尽管 v5.0.0 的 release notes 白纸黑字写着
      # "this update supports Node v24.x"。发版说明和标签实际声明的不一致。
      #
      # 上游 main 分支已经改成 node24 了, 但还没发带这个修复的 tag。所以现在
      # 用 @v5 或 @v5.0.0 拿到的都是 node20, 我们这边无解。
      #
      # 教训: 判断一个 action 跑在哪个 Node 上, 要看
      #   https://raw.githubusercontent.com/<owner>/<repo>/<tag>/action.yml
      # 里的 `runs.using`, **不能信 release notes**。本仓其余 5 个
      # (checkout@v5 / cache@v5 / setup-node@v6 / setup-python@v6 /
      #  github-script@v9) 都逐个这么查过, 确认是 node24。
      #
      # 该做什么: 上游发新 tag 后升上去, 这条注释一起删。
      # 在那之前 GitHub 会强制它跑在 node24 上, 功能不受影响。
        uses: actions/upload-artifact@v5
        with:
          name: bench-nightly-${{ env.TS || 'unknown' }}
          path: |
            central/llm-gateway/bench/nightly-*/
          retention-days: 30

      - name: Post summary to PR (if dispatched from PR)
        # workflow_dispatch on PR refs 时, 把 summary.md 贴上去. cron 跑没 PR 上下文, 跳.
        if: github.event_name == 'workflow_dispatch' && github.event.pull_request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ts = process.env.TS;
            const md = fs.readFileSync(
              path.join('central/llm-gateway/bench/nightly-' + ts, 'summary.md'),
              'utf8',
            );
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: md,
            });

      - name: Tear down bench stack
        if: always()
        run: |
          docker compose -f bench/docker-compose-bench.yml down -v || true
